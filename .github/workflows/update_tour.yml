name: Auto Extract Tour Schedule

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tour extraction script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/fetch_and_extract.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tour_data.json feeds_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自动更新动态与巡演信息" && git push)
