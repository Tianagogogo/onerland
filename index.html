      const text = document.getElementById('raw-post-input').value.trim();
      if (!text) return alert('请先粘贴分享链接或动态文案！');

      const urlMatch = text.match(/https?:\/\/[^\s\u4e00-\u9fa5]+/);
      const url = urlMatch ? urlMatch[0] : '';

      let platform = '微博';
      if (/xhslink\.com|xiaohongshu\.com|小红书/.test(text)) platform = '小红书';
      else if (/douyin\.com|抖音/.test(text)) platform = '抖音';
      else if (/b23\.tv|bilibili\.com|B站|哔哩哔哩/.test(text)) platform = 'B站';
      else if (/youtu\.be|youtube\.com|YouTube/i.test(text)) platform = 'YouTube';
      else if (/instagram\.com|ins/i.test(text)) platform = 'Instagram';
      else if (/tiktok\.com|TikTok/i.test(text)) platform = 'TikTok';
      else if (/大麦/.test(text)) platform = '大麦';
      else if (/秀动/.test(text)) platform = '秀动';

      let artist = 'ONER';
      if (text.includes('岳岳') || text.includes('PINKRAY')) artist = '岳岳';
      else if (text.includes('木子洋') || text.includes('KWIN')) artist = '木子洋';
      else if (text.includes('灵超') || text.includes('DIDI')) artist = '灵超';
      else if (text.includes('坤音')) artist = '坤音娱乐';

      let cleanText = text.replace(/https?:\/\/\S+/g, '').replace(/复制打开抖音.*|小红书App.*|长按复制此条消息.*/g, '').trim();
      if (!cleanText) cleanText = `${artist} 的 ${platform} 最新动态`;

      const isTicket = /开票|预售|抢票|巡演|演唱会|大麦|秀动|售票/.test(text);
      document.getElementsByName('cloudEntryType').forEach(r => r.checked = (r.value === (isTicket ? 'ticket' : 'feed')));

      const currentYear = new Date().getFullYear();
      const dateRegex = /(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:周[一二三四五六日天]|星期[一二三四五六日天])?\s*(?:上午|中午|下午|晚上)?\s*(\d{1,2})[:：点时](\d{1,2})?/;
      const m = text.match(dateRegex);
      let targetDateStr = '';
      if (m) {
        const year = m[1] || currentYear;
        const month = m[2].padStart(2, '0');
        const day = m[3].padStart(2, '0');
        let hour = parseInt(m[4], 10);
        if ((text.includes('下午') || text.includes('晚上')) && hour < 12) hour += 12;
        const minute = (m[5] || '00').padStart(2, '0');
        targetDateStr = `${year}-${month}-${day}T${String(hour).padStart(2, '0')}:${minute}`;
      }

      document.getElementById('cp-artist').value = artist;
      document.getElementById('cp-platform').value = platform;
      document.getElementById('cp-content').value = cleanText.slice(0, 200);
      document.getElementById('cp-time').value = targetDateStr;
      document.getElementById('cp-url').value = url;

      toggleCloudFields();
      document.getElementById('parse-confirm-box').classList.remove('hidden');
    }

    async function submitCloudEntry() {
      const type = document.querySelector('input[name="cloudEntryType"]:checked').value;
      const artist = document.getElementById('cp-artist').value;
      const platform = document.getElementById('cp-platform').value.trim() || '微博';

          ? { title: `${artist}|${content}`, ticket_time, platform, url }
          : { platform, artist, content, url };

        });

    function downloadICS(title, timeStr, platform, url) {
      const start = new Date(timeStr.replace(/-/g, '/'));
      if (isNaN(start)) return alert('时间格式暂不支持导出日历');
      const end = new Date(start.getTime() + 30 * 60000);
      const fmt = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
        `SUMMARY:🎫 抢票提醒：${title} (${platform})`,
        `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
        `DESCRIPTION:售票平台：${platform}\\n直达链接：${url || ''}`,
        'BEGIN:VALARM', 'TRIGGER:-PT15M', 'ACTION:DISPLAY', 'DESCRIPTION:还有15分钟开票！', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR'
      ].join('\r\n');
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}-开票提醒.ics`;
      a.click();
    }

    // ================= 4. 多镜像节点兜底抓取（弹窗自定义源用） =================
    async function fetchXmlWithFallback(rawUrl) {
      const candidateUrls = [rawUrl];
      if (rawUrl.includes('rsshub.app')) {
        RSSHUB_MIRRORS.slice(1).forEach(mirror => {
          candidateUrls.push(rawUrl.replace('https://rsshub.app', mirror));
        });
      }

      for (const targetUrl of candidateUrls) {
        try {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);
          const res = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) continue;

          const data = await res.json();
          if (!data.contents || data.contents.includes('RouteNotFound') || data.contents.includes('403 Forbidden') || data.contents.includes('Error 1015')) {
            continue;
          }
          const doc = new DOMParser().parseFromString(data.contents, 'text/xml');
          if (doc.querySelector('parsererror')) continue;

          const nodes = [...doc.querySelectorAll('item'), ...doc.querySelectorAll('entry')];
          if (nodes.length > 0) return nodes;
        } catch (e) {}
      }
      return [];
    }

    function updateCountdowns() {
      const now = Date.now();
      document.querySelectorAll('.countdown-badge').forEach(el => {
        const raw = el.getAttribute('data-time');
        const target = new Date(raw.replace(/-/g, '/')).getTime();
        if (isNaN(target)) return;
        const diff = target - now;
        if (diff <= 0) {
          el.textContent = '已开票';
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `剩 ${d}天${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      });
    }

    // ================= 7. 核心加载函数：融合 Supabase 云端动态 + 本地 feeds_data.json =================
    async function loadAllFeeds(force = false) {
      document.getElementById('timeline-list').innerHTML = `<div class="text-center py-10 text-sm text-slate-400">正在同步最新聚合动态...</div>`;
      let serverPosts = [];
      let failedSources = [];

      // 1. 拉取 Supabase 云端手动投喂的多设备同步动态
      cloudFeeds = [];
      if (SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('你的项目ID')) {
        try {
          const sbRes = await fetch(`${SUPABASE_URL}/rest/v1/feeds?select=*&order=created_at.desc&limit=80`, { headers: SB_HEADERS });
          if (sbRes.ok) {
            const rows = await sbRes.json();
            cloudFeeds = rows.map(r => {
              const meta = ARTIST_META_MAP[r.artist] || { artistId: 'oner', color: COLOR_ONER };
              const matchedArtistObj = artistsConfig.find(a => a.artistName === r.artist);
              const matchedAcc = matchedArtistObj?.accounts.find(acc => acc.name === r.platform);
              return {
                cloudId: r.id,
                artistId: matchedArtistObj?.artistId || meta.artistId,
                artistName: r.artist,
                accountId: matchedAcc?.id || `${meta.artistId}_cloud`,
                platformName: r.platform,
                platformColor: matchedArtistObj?.badgeStyle || meta.color,
                text: r.content,
                imgs: [],
                link: r.url || '#',
                timestamp: new Date(r.created_at).getTime()
              };
            });
            serverPosts.push(...cloudFeeds);
            document.getElementById('last-sync').textContent = '云端已同步 · ' + new Date().toLocaleTimeString();
          }
        } catch (e) {}
      }

      // 2. 补充读取本地 feeds_data.json（如果仓库里有的话）
      try {
        const res = await fetch('./feeds_data.json?t=' + Date.now());
        if (res.ok) {
          const payload = await res.json();
          if (Array.isArray(payload.posts)) {
            serverPosts.push(...payload.posts);
          }
        }
      } catch (e) {}

      // 3. 过滤与排序
      allPosts = serverPosts;
      allPosts.sort((a, b) => b.timestamp - a.timestamp);

      initUI();
    }

      const artistTabs = [{ id: 'ALL', name: '全部艺人', badgeStyle: '#4f46e5' }, ...artistsConfig.map(a => ({

      // 动态提取当前艺人拥有的平台胶囊（兼容预设平台与云端同步的任意平台名）
      const platformMap = new Map();
      artistPosts.forEach(p => {
        const key = `${p.artistName}·${p.platformName}`;

        if (!platformMap.has(label)) {
          platformMap.set(label, { label, color: p.platformColor, count: 0 });
        }

      });

      const platformTabs = [{ id: 'ALL', label: `全部 (${artistPosts.length})`, color: '#1e293b' }, ...[...platformMap.values()].map(item => ({
        id: item.label,

      }))];

        `;
      }).join('');

      renderTourCards();

    function clearDate() {

    }

    function renderTimeline() {
      const dateVal = document.getElementById('date-filter').value;
      const kw = document.getElementById('keyword-filter').value.trim().toLowerCase();

      const filtered = allPosts.filter(p => {
        if (activeArtistId !== 'ALL' && p.artistId !== activeArtistId) return false;
        if (activeAccountId !== 'ALL') {
          const pLabel = activeArtistId === 'ALL' ? `${p.artistName}·${p.platformName}` : p.platformName;
          if (pLabel !== activeAccountId) return false;
        }
        if (dateVal) {
          const d = new Date(p.timestamp);
          const localDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          if (localDate !== dateVal) return false;
        }
        if (kw && !p.text.toLowerCase().includes(kw)) return false;
        return true;
      });

      const listEl = document.getElementById('timeline-list');
      if (!filtered.length) {
        listEl.innerHTML = `<div class="text-center py-10 text-sm text-slate-400">暂无动态记录（管理员可点击右上角「🔒 发布动态」粘贴各平台分享链接同步）</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(p => {
        const dateStr = new Date(p.timestamp).toLocaleString('zh-CN', { hour12: false });
        const imgsHtml = (p.imgs || []).slice(0, 4).map(src => `
          <a href="${src}" target="_blank">
            <img src="${src}" loading="lazy" class="w-full h-36 object-cover rounded-lg border border-slate-200 dark:border-slate-800" />
          </a>
        `).join('');

        return `
          <article class="p-4 sm:p-5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
            <div class="flex items-center justify-between text-xs gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-white font-semibold border border-white/15 shadow-xs" style="background:${p.platformColor}">
                  ${p.artistName} · ${p.platformName}
                </span>
                <span class="text-slate-500">${formatTimeAgo(p.timestamp)} · ${dateStr}</span>
              </div>
              <div class="flex items-center gap-2.5 shrink-0">
                ${p.link && p.link !== '#' ? `<a href="${p.link}" target="_blank" class="text-slate-400 hover:text-indigo-500">原帖 ↗</a>` : ''}
                ${(isAdmin && p.cloudId) ? `<button onclick="deleteCloudRecord('feeds', ${p.cloudId})" class="text-rose-500 hover:underline">删除</button>` : ''}
              </div>
            </div>
            <p class="text-sm leading-relaxed whitespace-pre-line line-clamp-4 cursor-pointer" onclick="this.classList.toggle('line-clamp-4')">${p.text}</p>
            ${imgsHtml ? `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${imgsHtml}</div>` : ''}
          </article>
        `;
      }).join('');
    }

    function formatTimeAgo(ts) {
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
      return Math.floor(diff / 86400) + ' 天前';
    }

    syncAdminUI();
    loadTourData();
    loadAllFeeds();
    setInterval(updateCountdowns, 1000);
    setInterval(() => { loadTourData(); loadAllFeeds(); }, 60000);
  </script>
</body>
</html>
