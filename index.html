<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONER & 坤音娱乐 动态与巡演中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      background-color: #070912;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(244, 114, 182, 0.08), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(96, 165, 250, 0.08), transparent 35%),
        radial-gradient(circle at 50% 80%, rgba(168, 85, 247, 0.07), transparent 40%),
        linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(203, 213, 225, 0.16);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
    }
    .glass-card-silver {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.78));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.24);
      box-shadow: 0 4px 24px rgba(192, 132, 252, 0.1);
    }
    .pearl-gradient {
      background: linear-gradient(135deg, #F472B6 0%, #60A5FA 50%, #A855F7 100%);
    }
    .pearl-text {
      background: linear-gradient(90deg, #F9A8D4 0%, #93C5FD 50%, #D8B4FE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .silver-btn {
      background: linear-gradient(135deg, rgba(226, 232, 240, 0.16), rgba(148, 163, 184, 0.08));
      border: 1px solid rgba(226, 232, 240, 0.28);
    }
    .silver-btn:hover {
      background: linear-gradient(135deg, rgba(226, 232, 240, 0.26), rgba(148, 163, 184, 0.14));
    }
    .line-clamp-1-clean {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .no-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); border-radius: 999px; }
    .no-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 999px; }
    .no-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(192, 132, 252, 0.55); }
  </style>
</head>
<body class="text-slate-100 min-h-screen antialiased selection:bg-purple-500/30 selection:text-white">

  <!-- ================= 顶部精简导航栏（含“艺人 ▾”二级下拉菜单） ================= -->
  <header class="sticky top-0 z-30 bg-[#070912]/80 backdrop-blur-xl border-b border-slate-300/15">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <span id="sync-dot" class="w-2 h-2 rounded-full bg-gradient-to-r from-pink-400 to-sky-400 animate-pulse"></span>
          <h1 class="font-bold text-base sm:text-lg tracking-tight text-slate-100">ONER & 坤音</h1>
        </div>

        <div class="relative" id="artist-dropdown-wrap">
          <button type="button" onclick="toggleArtistMenu(event)" id="artist-menu-btn"
            class="px-3 py-1.5 rounded-full text-xs font-semibold text-white pearl-gradient shadow-sm flex items-center gap-1.5 transition hover:opacity-90">
            <span>🎤 艺人：<span id="current-artist-label">全部艺人</span></span>
            <span class="text-[10px]">▾</span>
          </button>
          <div id="artist-dropdown-menu" class="hidden absolute left-0 mt-2 w-44 rounded-xl bg-slate-900/95 backdrop-blur-xl border border-slate-300/20 shadow-2xl py-1.5 z-40"></div>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <span id="last-sync" class="text-slate-400 hidden lg:inline">准备就绪</span>
        <button id="admin-unlock-btn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-lg silver-btn text-slate-200 transition font-medium">
          🔒 管理
        </button>
        <button onclick="openManageModal()" class="px-3 py-1.5 rounded-lg silver-btn text-slate-200 transition font-medium hidden sm:inline-block">
          ⚙️ 订阅源
        </button>
        <button onclick="loadAllFeeds(true)" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-slate-200 via-slate-100 to-slate-300 text-slate-900 hover:opacity-90 transition font-semibold shadow-sm">
          刷新同步
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">

    <!-- ================= 管理员专属：快捷投喂与编辑台 ================= -->
    <section id="admin-publisher-panel" class="hidden p-4 sm:p-5 rounded-2xl glass-card-silver space-y-3">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <span class="text-sm font-bold pearl-text">✨ 管理员云端投喂台（多设备实时同步）</span>
        <div class="flex items-center gap-3 text-xs">
          <button type="button" onclick="configGeminiKey()" class="text-sky-300 hover:underline font-medium">
            🔑 配置 AI 识图密钥 (<span id="ai-key-status">未配置</span>)
          </button>
          <button onclick="lockAdminMode()" class="text-slate-400 hover:text-rose-400">退出管理</button>
        </div>
      </div>

      <textarea id="raw-post-input" rows="2" placeholder="粘贴微博 / 小红书 / 抖音分享口令或官宣文案（支持识别优先购、预售、正式开票、连演两天及开场时间）..."
        class="w-full text-xs sm:text-sm p-3 rounded-xl border border-slate-400/25 bg-slate-950/70 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-400/60"></textarea>

      <div class="flex items-center gap-2 flex-wrap">
        <button id="smart-parse-btn" onclick="smartParsePost()" class="px-3.5 py-2 rounded-lg pearl-gradient hover:opacity-90 text-white text-xs font-semibold transition shadow-sm">
          🪄 智能识别文案
        </button>
        <button type="button" onclick="openTicketFormDirectly()" class="px-3.5 py-2 rounded-lg silver-btn text-pink-200 text-xs font-semibold transition">
          🎫 手动新增演出 / 倒计时
        </button>
        <button type="button" onclick="openArchiveFormDirectly()" class="px-3.5 py-2 rounded-lg silver-btn text-purple-200 text-xs font-semibold transition">
          🏛️ 录入往日演出 / 识别排期表海报
        </button>
        <button onclick="resetConfirmForm()" class="px-3 py-2 rounded-lg bg-slate-800/80 text-slate-300 hover:text-white text-xs">
          清空收起
        </button>
      </div>

      <!-- 识别后确认 / 编辑微调表单 -->
      <div id="parse-confirm-box" class="hidden pt-3 border-t border-dashed border-slate-400/20 space-y-3">
        <div id="editing-banner" class="hidden px-3 py-2 rounded-lg bg-purple-500/15 border border-purple-400/30 text-xs text-purple-200 flex items-center justify-between">
          <span>✏️ 正在编辑已有演出场次：<strong id="editing-target-name"></strong></span>
          <button type="button" onclick="cancelEditMode()" class="text-pink-300 underline font-medium">取消编辑</button>
        </div>

        <div id="entry-type-selector" class="flex items-center gap-4 text-xs flex-wrap">
          <span class="text-slate-400">同步至板块：</span>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-slate-200">
            <input type="radio" name="cloudEntryType" value="feed" checked onchange="toggleCloudFields()" /> 📱 全平台动态时间线
          </label>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-sky-300">
            <input type="radio" name="cloudEntryType" value="ticket" onchange="toggleCloudFields()" /> 🎫 近期演出（含开票倒计时 & 待开演场次）
          </label>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-purple-300">
            <input type="radio" name="cloudEntryType" value="archive" onchange="toggleCloudFields()" /> 🏛️ 往日演出档案（支持多场表格图批量识别）
          </label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="text-slate-400 block mb-1">关联艺人</label>
            <select id="cp-artist" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80 text-slate-100">
              <option value="ONER">ONER</option>
              <option value="坤音娱乐">坤音娱乐</option>
              <option value="岳岳">岳岳</option>
              <option value="木子洋">木子洋</option>
              <option value="灵超">灵超</option>
            </select>
          </div>
          <div id="cp-feed-platform-wrap">
            <label class="text-slate-400 block mb-1">来源平台（如：微博 / 小红书 / 抖音）</label>
            <input id="cp-platform" type="text" placeholder="微博" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80 text-slate-100" />
          </div>
          <div id="cp-ticket-url-top" class="hidden">
            <label class="text-slate-400 block mb-1">官宣原帖 / 购票链接</label>
            <input id="cp-url-ticket" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80 text-slate-100" />
          </div>

          <!-- ================= 往日演出档案表单（含多张时间表图片上传） ================= -->
          <div id="cp-archive-fields" class="hidden sm:col-span-2 space-y-3 p-3.5 rounded-xl bg-purple-500/5 border border-slate-300/20">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-3">
                <span class="font-bold text-purple-300">演出类型：</span>
                <label class="flex items-center gap-1 cursor-pointer font-medium">
                  <input type="radio" name="archiveSubType" value="tour" checked onchange="toggleArchiveSubFields()" /> 🏟️ 巡演 / Livehouse（含票价与座位图）
                </label>
                <label class="flex items-center gap-1 cursor-pointer font-medium">
                  <input type="radio" name="archiveSubType" value="festival" onchange="toggleArchiveSubFields()" /> 🎪 音乐节（含演出时段、时间表多图与歌单）
                </label>
              </div>
            </div>

            <div class="p-3 rounded-lg bg-slate-950/70 border border-slate-300/15 space-y-2.5">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <label class="font-semibold text-purple-300">🖼️ 上传官宣海报或「多场次排期表格图片」</label>
                <div class="flex items-center gap-2 flex-wrap">
                  <label class="cursor-pointer px-3 py-1 rounded-lg silver-btn text-slate-100 font-medium transition">
                    选择本地图片
                    <input type="file" id="arc-poster-file" accept="image/*" class="hidden" onchange="handlePosterUpload(event)" />
                  </label>
                  <button type="button" id="arc-ocr-btn" onclick="runSmartPosterRecognition()" class="px-3 py-1 rounded-lg pearl-gradient text-white font-medium transition">
                    🔍 智能识别图片（支持多场表格拆分）
                  </button>
                </div>
              </div>
              <input id="arc-poster-url" type="text" placeholder="或粘贴海报图片链接 https://..." class="w-full px-2.5 py-1.5 rounded border border-slate-400/25 bg-transparent text-xs" />
              <div id="arc-ocr-status" class="hidden text-[11px] text-sky-300"></div>
              <img id="arc-poster-preview" class="hidden max-h-40 rounded-lg border border-slate-400/20 object-contain" />

              <div id="multi-show-batch-box" class="hidden pt-2 border-t border-slate-400/20 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <span class="font-bold text-sky-300">📋 识别到图片中的多场演出排期（可勾选微调后一键批量导入）：</span>
                  <div class="flex items-center gap-2">
                    <select id="batch-target-section" class="px-2 py-1 rounded border border-slate-400/30 bg-slate-900 text-[11px]">
                      <option value="archive">导入至：🏛️ 往日演出档案</option>
                      <option value="ticket">导入至：🎫 近期演出列表</option>
                    </select>
                    <button type="button" onclick="batchImportRecognizedShows()" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition">
                      ✅ 批量导入已勾选场次
                    </button>
                  </div>
                </div>
                <div id="multi-show-list" class="space-y-1.5 max-h-64 overflow-y-auto no-scrollbar"></div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-slate-400 block mb-1">巡演/音乐节主题名称（用于横版专题聚合）</label>
                <input id="arc-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
              <div>
                <label class="text-slate-400 block mb-1">具体站次 / 场次标题（必填）</label>
                <input id="arc-title" type="text" placeholder="如：合肥站 / 北京站 / XX音乐节" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
              <div>
                <label class="text-slate-400 block mb-1">演出日期（必填，用于时间线排序）</label>
                <input id="arc-date" type="date" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
              <div>
                <label class="text-slate-400 block mb-1">城市与场馆 / Livehouse / 场地</label>
                <input id="arc-venue" type="text" placeholder="如：北京 · 疆进酒·OMNI SPACE" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>

              <div id="arc-tour-only" class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="text-pink-300 font-medium block mb-1">💰 票价档位</label>
                  <input id="arc-prices" type="text" placeholder="如：预售 280 / 全价 380 / VIP 580" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
                </div>
                <div>
                  <label class="text-sky-300 font-medium block mb-1">💺 场馆座位图（Livehouse 无座位可留空）</label>
                  <div class="flex gap-1.5">
                    <input id="arc-seat-url" type="text" placeholder="https://... 或点右侧上传" class="flex-1 px-2.5 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
                    <label class="cursor-pointer px-2.5 py-2 rounded-lg silver-btn text-sky-200 shrink-0 font-medium">
                      上传图
                      <input type="file" accept="image/*" class="hidden" onchange="handleSeatMapUpload(event)" />
                    </label>
                  </div>
                </div>
              </div>

              <!-- 音乐节专属：演出时段 + 多张时间表图片 + 演唱歌单 -->
              <div id="arc-fest-only" class="hidden sm:col-span-2 space-y-3">
                <div>
                  <label class="text-purple-300 font-medium block mb-1">⏰ 演出时间段（鼠标悬停卡片该标签可预览下方时间表多图）</label>
                  <input id="arc-slot" type="text" placeholder="如：16:20 - 17:00（主舞台）" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
                </div>

                <!-- 往日音乐节时间表多图上传区 -->
                <div class="p-3 rounded-lg bg-slate-950/70 border border-purple-400/25 space-y-2">
                  <div class="flex items-center justify-between flex-wrap gap-2">
                    <label class="text-purple-300 font-medium">🗓️ 音乐节时间表图片（可一次多选上传多张，支持添加图片链接）</label>
                    <label class="cursor-pointer px-2.5 py-1 rounded-lg silver-btn text-purple-200 font-medium transition">
                      + 多选上传时间表图片
                      <input type="file" id="arc-schedule-files" accept="image/*" multiple class="hidden" onchange="handleMultiScheduleUpload(event, 'arc')" />
                    </label>
                  </div>
                  <div class="flex gap-1.5">
                    <input id="arc-schedule-url-input" type="text" placeholder="输入单张时间表图片网址 https://... 后点添加" class="flex-1 px-2.5 py-1.5 rounded border border-slate-400/25 bg-transparent text-xs" />
                    <button type="button" onclick="addScheduleImageByUrl('arc')" class="px-2.5 py-1.5 rounded-lg silver-btn text-sky-200 font-medium">添加链接图</button>
                  </div>
                  <div id="arc-schedule-thumbs" class="flex gap-2 flex-wrap pt-1"></div>
                </div>

                <div>
                  <label class="text-emerald-300 font-medium block mb-1">🎤 现场演唱歌单 Setlist（每行一首）</label>
                  <textarea id="arc-setlist" rows="4" placeholder="1. 过敏&#10;2. 镜中人&#10;3. 凶手" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80 leading-relaxed"></textarea>
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="text-slate-400 block mb-1">官宣原帖 / 回顾链接（选填）</label>
                <input id="arc-url" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
            </div>
          </div>

          <!-- ================= 近期演出表单（含音乐节时间表多图上传 + 悬停预览） ================= -->
          <div id="cp-tour-fields" class="hidden sm:col-span-2 space-y-3 p-3.5 rounded-xl bg-sky-500/5 border border-slate-300/20">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-sky-300 font-medium block mb-1">巡演/音乐节主题名称（同主题可聚合专题页）</label>
                <input id="cp-tour-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
              <div>
                <label class="text-sky-300 font-medium block mb-1">城市站次 / 场次名（必填）</label>
                <input id="cp-tour-title" type="text" placeholder="如：合肥站 / 上海站 / XX音乐节" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
              <div>
                <label class="text-slate-400 block mb-1">演出场馆 / Livehouse / 场地</label>
                <div class="flex gap-1.5">
                  <input id="cp-tour-venue" type="text" placeholder="如：MAO Livehouse / 合肥少荃体育馆" class="flex-1 px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
                  <button type="button" onclick="autoFillVenueTransport()" class="px-2.5 py-1.5 rounded-lg silver-btn text-sky-200 shrink-0 font-medium">
                    🚇 匹配路线
                  </button>
                </div>
              </div>
              <div>
                <label class="text-slate-400 block mb-1">演出日期（支持连演两天，如 2026-12-26 ~ 12-27）</label>
                <input id="cp-tour-showdate" type="text" placeholder="如：2026-12-26 ~ 12-27 (连演2天)" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
              <div>
                <label class="text-purple-300 font-medium block mb-1">⏰ 开场时间（如 19:30 开场）</label>
                <input id="cp-tour-starttime" type="text" placeholder="如：19:30 开场（提前60分钟检票）" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
              <div>
                <label class="text-pink-300 font-medium block mb-1">💰 巡演票价档位</label>
                <input id="cp-tour-prices" type="text" placeholder="如：380 / 580 / 780 / 1080" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>
              <div class="sm:col-span-2">
                <label class="text-purple-300 font-medium block mb-1">🎤 预计演出时段备注（音乐节适用，鼠标悬停卡片该标签可看时间表多图）</label>
                <input id="cp-tour-slot" type="text" placeholder="如：16:20-17:00 预计登台" class="w-full px-3 py-2 rounded-lg border border-slate-400/25 bg-slate-950/80" />
              </div>

              <!-- 近期音乐节时间表多图上传区 -->
              <div class="sm:col-span-2 p-3 rounded-lg bg-slate-950/70 border border-purple-400/25 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <label class="text-purple-300 font-medium">🗓️ 音乐节时间表多图（支持一次多选上传多张图片，悬停演出时段时弹出预览）</label>
                  <label class="cursor-pointer px-2.5 py-1 rounded-lg silver-btn text-purple-200 font-medium transition">
                    + 多选上传时间表图片
                    <input type="file" id="cp-schedule-files" accept="image/*" multiple class="hidden" onchange="handleMultiScheduleUpload(event, 'cp')" />
                  </label>
                </div>
                <div class="flex gap-1.5">

    function cleanSocialPostText(rawText) {
      if (!rawText) return '';
      let text = rawText
        .replace(/https?:\/\/\S+/g, '')
        .replace(/\[?(?:图片|视频|微博视频|查看图片|网页链接|秒拍视频|直播|超话|绿洲图片)\]?/g, '')
        .replace(/[\s\S]*?请领取你的小票\s*/g, '')
        .replace(/[「“"]?\.\.\.把文本复制下来[\s\S]*/g, '')
        .replace(/复制打开抖音[\s\S]*|小红书App[\s\S]*|长按复制此条消息[\s\S]*|打开小红书查看[\s\S]*|打开抖音搜索[\s\S]*/g, '')
        .replace(/[0-9a-zA-Z]{8,12}\s*$/g, '')
        .trim();

      const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
      if (lines.length >= 2) {
        const l1 = lines[0].replace(/[\s\.…。，,!！?？]/g, '');
        const l2 = lines[1].replace(/[\s\.…。，,!！?？]/g, '');
        if (l1 && l2 && (l1 === l2 || l2.startsWith(l1) || l1.startsWith(l2))) {
          lines.splice(0, 1);
        }
      }
      return lines.join(' ');
    }

    function extractVenueFromText(text) {

      if (labelMatch && labelMatch[1].trim().length >= 2) {
        return labelMatch[1].trim();

      const venueRegex = /([\u4e00-\u9fa5A-Za-z0-9·\-\s]{2,28}(?:Live\s*House|LIVE\s*HOUSE|livehouse|OMNI\s*SPACE|HOU\s*LIVE|万代南梦宫|疆进酒|育音堂|声音共和|太空间|纽空间|正火艺术中心|稻香音乐空间|达丰空间|红节奏|不晚|体育中心体育馆|体育中心|体育馆|体育场|演艺中心|文化中心|大剧院|艺术中心|展览中心|会展中心|ECM中心|音乐广场|草坪|公园|营地|度假区|博览园|赛车场|沙滩|生态岛|嬉戏谷))/i;
      const m = text.match(venueRegex);

    function extractShowDateRange(text, currentYear) {
      const rangeMatch = text.match(/(?:演出时间|演出日期|活动时间|时间)?\s*[：:]?\s*(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:[（(][^）)]+[）)])?\s*(?:[-~—至、和&]\s*(?:(\d{1,2})[月\.\-\/])?(\d{1,2})[日号]?)/);
      if (rangeMatch) {
        const y = rangeMatch[1] || currentYear;
        const m1 = rangeMatch[2].padStart(2, '0');
        const d1 = rangeMatch[3].padStart(2, '0');
        const m2 = (rangeMatch[4] || rangeMatch[2]).padStart(2, '0');
        const d2 = rangeMatch[5].padStart(2, '0');
        return `${y}-${m1}-${d1} ~ ${m2}-${d2} (连演2天)`;
      }
      const singleMatch = text.match(/(?:演出时间|演出日期|活动时间|时间)[：:]\s*(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:[（(]?(周[一二三四五六日天]|星期[一二三四五六日天])[）)]?)?/);
      if (singleMatch) {
        const y = singleMatch[1] || currentYear;
        const mo = singleMatch[2].padStart(2, '0');
        const da = singleMatch[3].padStart(2, '0');
        const wk = singleMatch[4] ? ` (${singleMatch[4]})` : '';
        return `${y}-${mo}-${da}${wk}`;
      }
      return '';
    }

    function extractStartTime(text) {
      const labelMatch = text.match(/(?:开场时间|演出开始|开演时间)[：:]?\s*([^\n\r！!。]+)/);
      if (labelMatch) return labelMatch[1].trim();
      const showLine = text.match(/(?:演出时间|演出日期)[：:]\s*([^\n\r]+)/);
      if (showLine) {
        const tMatch = showLine[1].match(/(?:每晚|每日|下午|晚上|晚)?\s*(\d{1,2}[:：]\d{2})/);
        if (tMatch) return `${tMatch[1].replace('：', ':')} 开场`;
      }
      return '';
    }

    function compressImageToDataURL(file, maxWidth = 960, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function preprocessImageForLocalOCR(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const scale = img.width < 1200 ? 2 : 1.3;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.filter = 'grayscale(100%) contrast(165%) brightness(105%)';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }
