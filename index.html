<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONER & 坤音娱乐 动态与巡演中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      background-color: #f3f5f9;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(244, 114, 182, 0.08), transparent 38%),
        radial-gradient(circle at 88% 12%, rgba(96, 165, 250, 0.09), transparent 38%),
        radial-gradient(circle at 50% 85%, rgba(168, 85, 247, 0.06), transparent 42%),
        linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      background-attachment: fixed;
    }
    .frost-card {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }
    .frost-card-silver {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(241, 245, 249, 0.9));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #94a3b8;
      box-shadow: 0 6px 24px rgba(100, 116, 139, 0.09);
    }
    .pearl-gradient {
      background: linear-gradient(135deg, #ec4899 0%, #3b82f6 52%, #8b5cf6 100%);
    }
    .pearl-soft {
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.12) 0%, rgba(96, 165, 250, 0.12) 50%, rgba(168, 85, 247, 0.12) 100%);
    }
    .pearl-text {
      background: linear-gradient(90deg, #db2777 0%, #2563eb 52%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .silver-btn {
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
      border: 1px solid #cbd5e1;
      color: #334155;
    }
    .silver-btn:hover {
      background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
      color: #0f172a;
    }
    .line-clamp-1-clean {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .no-scrollbar::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 999px; }
    .no-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; }
  </style>
</head>
<body class="text-slate-800 min-h-screen antialiased selection:bg-purple-200 selection:text-slate-900">

  <!-- ================= 顶部冷白银导航栏 ================= -->
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-xl border-b border-slate-200/90 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <span id="sync-dot" class="w-2.5 h-2.5 rounded-full pearl-gradient animate-pulse"></span>
          <h1 class="font-bold text-base sm:text-lg tracking-tight text-slate-900">ONER & 坤音</h1>
        </div>

        <div class="relative" id="artist-dropdown-wrap">
          <button type="button" onclick="toggleArtistMenu(event)" id="artist-menu-btn"
            class="px-3 py-1.5 rounded-full text-xs font-semibold text-white pearl-gradient shadow-xs flex items-center gap-1.5 transition hover:opacity-90">
            <span>🎤 艺人：<span id="current-artist-label">全部艺人</span></span>
            <span class="text-[10px]">▾</span>
          </button>
          <div id="artist-dropdown-menu" class="hidden absolute left-0 mt-2 w-44 rounded-xl bg-white/95 backdrop-blur-xl border border-slate-200 shadow-xl py-1.5 z-40"></div>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <span id="last-sync" class="text-slate-400 hidden lg:inline">准备就绪</span>
        <button id="admin-unlock-btn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-lg silver-btn transition font-medium">
          🔒 管理
        </button>
        <button onclick="openManageModal()" class="px-3 py-1.5 rounded-lg silver-btn transition font-medium hidden sm:inline-block">
          ⚙️ 订阅源
        </button>
        <button onclick="loadAllFeeds(true)" class="px-3 py-1.5 rounded-lg bg-slate-800 text-white hover:bg-slate-700 transition font-semibold shadow-xs">
          刷新同步
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">

    <!-- ================= 管理员专属：快捷投喂与编辑台 ================= -->
    <section id="admin-publisher-panel" class="hidden p-4 sm:p-5 rounded-2xl frost-card-silver space-y-3">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <span class="text-sm font-bold pearl-text">✨ 管理员云端投喂台（多设备实时同步）</span>
        <div class="flex items-center gap-3 text-xs">
          <button type="button" onclick="configGeminiKey()" class="text-blue-600 hover:underline font-medium">
            🔑 配置 AI 识图密钥 (<span id="ai-key-status">未配置</span>)
          </button>
          <button onclick="lockAdminMode()" class="text-slate-400 hover:text-rose-600">退出管理</button>
        </div>
      </div>

      <textarea id="raw-post-input" rows="2" placeholder="粘贴微博 / 小红书 / 抖音分享口令或官宣文案（支持识别优先购、预售、正式开票、连演两天及开场时间）..."
        class="w-full text-xs sm:text-sm p-3 rounded-xl border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-purple-400"></textarea>

      <div class="flex items-center gap-2 flex-wrap">
        <button id="smart-parse-btn" onclick="smartParsePost()" class="px-3.5 py-2 rounded-lg pearl-gradient hover:opacity-90 text-white text-xs font-semibold transition shadow-xs">
          🪄 智能识别文案
        </button>
        <button type="button" onclick="openTicketFormDirectly()" class="px-3.5 py-2 rounded-lg silver-btn text-pink-700 text-xs font-semibold transition">
          🎫 手动新增演出 / 倒计时
        </button>
        <button type="button" onclick="openArchiveFormDirectly()" class="px-3.5 py-2 rounded-lg silver-btn text-purple-700 text-xs font-semibold transition">
          🏛️ 录入往日演出 / 识别排期表海报
        </button>
        <button onclick="resetConfirmForm()" class="px-3 py-2 rounded-lg bg-slate-200/80 text-slate-600 hover:text-slate-900 text-xs">
          清空收起
        </button>
      </div>

      <!-- 识别后确认 / 编辑微调表单 -->
      <div id="parse-confirm-box" class="hidden pt-3 border-t border-dashed border-slate-300 space-y-3">
        <div id="editing-banner" class="hidden px-3 py-2 rounded-lg bg-purple-50 border border-purple-200 text-xs text-purple-800 flex items-center justify-between">
          <span>✏️ 正在编辑已有演出场次：<strong id="editing-target-name"></strong></span>
          <button type="button" onclick="cancelEditMode()" class="text-rose-600 underline font-medium">取消编辑</button>
        </div>

        <div id="entry-type-selector" class="flex items-center gap-4 text-xs flex-wrap">
          <span class="text-slate-500">同步至板块：</span>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-slate-700">
            <input type="radio" name="cloudEntryType" value="feed" checked onchange="toggleCloudFields()" /> 📱 全平台动态时间线
          </label>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-blue-700">
            <input type="radio" name="cloudEntryType" value="ticket" onchange="toggleCloudFields()" /> 🎫 近期演出（含开票倒计时 & 待开演场次）
          </label>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-purple-700">
            <input type="radio" name="cloudEntryType" value="archive" onchange="toggleCloudFields()" /> 🏛️ 往日演出档案（支持多场表格图批量识别）
          </label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="text-slate-500 block mb-1">关联艺人</label>
            <select id="cp-artist" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-800">
              <option value="ONER">ONER</option>
              <option value="坤音娱乐">坤音娱乐</option>
              <option value="岳岳">岳岳</option>
              <option value="木子洋">木子洋</option>
              <option value="灵超">灵超</option>
            </select>
          </div>
          <div id="cp-feed-platform-wrap">
            <label class="text-slate-500 block mb-1">来源平台（如：微博 / 小红书 / 抖音）</label>
            <input id="cp-platform" type="text" placeholder="微博" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-800" />
          </div>
          <div id="cp-ticket-url-top" class="hidden">
            <label class="text-slate-500 block mb-1">官宣原帖 / 购票链接</label>
            <input id="cp-url-ticket" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-800" />
          </div>

          <!-- ================= 往日演出档案表单 ================= -->
          <div id="cp-archive-fields" class="hidden sm:col-span-2 space-y-3 p-3.5 rounded-xl bg-white/80 border border-slate-300">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-3">
                <span class="font-bold text-purple-700">演出类型：</span>
                <label class="flex items-center gap-1 cursor-pointer font-medium">
                  <input type="radio" name="archiveSubType" value="tour" checked onchange="toggleArchiveSubFields()" /> 🏟️ 巡演 / Livehouse（含票价与座位图）
                </label>
                <label class="flex items-center gap-1 cursor-pointer font-medium">
                  <input type="radio" name="archiveSubType" value="festival" onchange="toggleArchiveSubFields()" /> 🎪 音乐节（含演出时段、时间表多图与歌单）
                </label>
              </div>
            </div>

            <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 space-y-2.5">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <label class="font-semibold text-purple-700">🖼️ 上传官宣海报或「多场次排期表格图片」</label>
                <div class="flex items-center gap-2 flex-wrap">
                  <label class="cursor-pointer px-3 py-1 rounded-lg silver-btn font-medium transition">
                    选择本地图片
                    <input type="file" id="arc-poster-file" accept="image/*" class="hidden" onchange="handlePosterUpload(event)" />
                  </label>
                  <button type="button" id="arc-ocr-btn" onclick="runSmartPosterRecognition()" class="px-3 py-1 rounded-lg pearl-gradient text-white font-medium transition">
                    🔍 智能识别图片（支持多场表格拆分）
                  </button>
                </div>
              </div>
              <input id="arc-poster-url" type="text" placeholder="或粘贴海报图片链接 https://..." class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs" />
              <div id="arc-ocr-status" class="hidden text-[11px] text-blue-600"></div>
              <img id="arc-poster-preview" class="hidden max-h-40 rounded-lg border border-slate-300 object-contain" />

              <div id="multi-show-batch-box" class="hidden pt-2 border-t border-slate-200 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <span class="font-bold text-blue-700">📋 识别到图片中的多场演出排期（可勾选微调后一键批量导入）：</span>
                  <div class="flex items-center gap-2">
                    <select id="batch-target-section" class="px-2 py-1 rounded border border-slate-300 bg-white text-[11px]">
                      <option value="archive">导入至：🏛️ 往日演出档案</option>
                      <option value="ticket">导入至：🎫 近期演出列表</option>
                    </select>
                    <button type="button" onclick="batchImportRecognizedShows()" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition">
                      ✅ 批量导入已勾选场次
                    </button>
                  </div>
                </div>
                <div id="multi-show-list" class="space-y-1.5 max-h-64 overflow-y-auto no-scrollbar"></div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-slate-500 block mb-1">巡演/音乐节主题名称（用于专题聚合）</label>
                <input id="arc-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
              <div>
                <label class="text-slate-500 block mb-1">具体站次 / 场次标题（必填）</label>
                <input id="arc-title" type="text" placeholder="如：合肥站 / 北京站 / XX音乐节" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
              <div>
                <label class="text-slate-500 block mb-1">演出日期（必填，用于时间线排序）</label>
                <input id="arc-date" type="date" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
              <div>
                <label class="text-slate-500 block mb-1">城市与场馆 / Livehouse / 场地</label>
                <input id="arc-venue" type="text" placeholder="如：北京 · 疆进酒·OMNI SPACE" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>

              <div id="arc-tour-only" class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="text-pink-700 font-medium block mb-1">💰 票价档位</label>
                  <input id="arc-prices" type="text" placeholder="如：预售 280 / 全价 380 / VIP 580" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
                </div>
                <div>
                  <label class="text-blue-700 font-medium block mb-1">💺 场馆座位图（Livehouse 无座位可留空）</label>
                  <div class="flex gap-1.5">
                    <input id="arc-seat-url" type="text" placeholder="https://... 或点右侧上传" class="flex-1 px-2.5 py-2 rounded-lg border border-slate-300 bg-white" />
                    <label class="cursor-pointer px-2.5 py-2 rounded-lg silver-btn text-blue-700 shrink-0 font-medium">
                      上传图
                      <input type="file" accept="image/*" class="hidden" onchange="handleSeatMapUpload(event)" />
                    </label>
                  </div>
                </div>
              </div>

              <div id="arc-fest-only" class="hidden sm:col-span-2 space-y-3">
                <div>
                  <label class="text-purple-700 font-medium block mb-1">⏰ 演出时间段（鼠标悬停卡片该标签可预览下方时间表多图）</label>
                  <input id="arc-slot" type="text" placeholder="如：16:20 - 17:00（主舞台）" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
                </div>

                <div class="p-3 rounded-lg bg-slate-50 border border-purple-200 space-y-2">
                  <div class="flex items-center justify-between flex-wrap gap-2">
                    <label class="text-purple-700 font-medium">🗓️ 音乐节时间表图片（可多选上传多张，建议单次不超过 3 张以保证同步速度）</label>
                    <label class="cursor-pointer px-2.5 py-1 rounded-lg silver-btn text-purple-700 font-medium transition">
                      + 多选上传时间表图片
                      <input type="file" id="arc-schedule-files" accept="image/*" multiple class="hidden" onchange="handleMultiScheduleUpload(event, 'arc')" />
                    </label>
                  </div>
                  <div class="flex gap-1.5">
                    <input id="arc-schedule-url-input" type="text" placeholder="输入单张时间表图片网址 https://... 后点添加" class="flex-1 px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs" />
                    <button type="button" onclick="addScheduleImageByUrl('arc')" class="px-2.5 py-1.5 rounded-lg silver-btn text-blue-700 font-medium">添加链接图</button>
                  </div>
                  <div id="arc-schedule-thumbs" class="flex gap-2 flex-wrap pt-1"></div>
                </div>

                <div>
                  <label class="text-emerald-700 font-medium block mb-1">🎤 现场演唱歌单 Setlist（每行一首）</label>
                  <textarea id="arc-setlist" rows="4" placeholder="1. 过敏&#10;2. 镜中人&#10;3. 凶手" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white leading-relaxed"></textarea>
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="text-slate-500 block mb-1">官宣原帖 / 回顾链接（选填）</label>
                <input id="arc-url" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
            </div>
          </div>

          <!-- ================= 近期演出表单 ================= -->
          <div id="cp-tour-fields" class="hidden sm:col-span-2 space-y-3 p-3.5 rounded-xl bg-white/80 border border-slate-300">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-blue-700 font-medium block mb-1">巡演/音乐节主题名称（同主题可聚合专题页）</label>
                <input id="cp-tour-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
              <div>
                <label class="text-blue-700 font-medium block mb-1">城市站次 / 场次名（必填）</label>
                <input id="cp-tour-title" type="text" placeholder="如：合肥站 / 上海站 / XX音乐节" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
              <div>
                <label class="text-slate-500 block mb-1">演出场馆 / Livehouse / 场地</label>
                <div class="flex gap-1.5">
                  <input id="cp-tour-venue" type="text" placeholder="如：MAO Livehouse / 合肥少荃体育馆" class="flex-1 px-3 py-2 rounded-lg border border-slate-300 bg-white" />
                  <button type="button" onclick="autoFillVenueTransport()" class="px-2.5 py-1.5 rounded-lg silver-btn text-blue-700 shrink-0 font-medium">
                    🚇 匹配路线
                  </button>
                </div>
              </div>
              <div>
                <label class="text-slate-500 block mb-1">演出日期（支持连演两天，如 2026-12-26 ~ 12-27）</label>
                <input id="cp-tour-showdate" type="text" placeholder="如：2026-12-26 ~ 12-27 (连演2天)" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
              <div>
                <label class="text-purple-700 font-medium block mb-1">⏰ 开场时间（如 19:30 开场）</label>
                <input id="cp-tour-starttime" type="text" placeholder="如：19:30 开场（提前60分钟检票）" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
              <div>
                <label class="text-pink-700 font-medium block mb-1">💰 巡演票价档位</label>
                <input id="cp-tour-prices" type="text" placeholder="如：380 / 580 / 780 / 1080" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>
              <div class="sm:col-span-2">
                <label class="text-purple-700 font-medium block mb-1">🎤 预计演出时段备注（音乐节适用，鼠标悬停卡片该标签可看时间表多图）</label>
                <input id="cp-tour-slot" type="text" placeholder="如：16:20-17:00 预计登台" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
              </div>

              <div class="sm:col-span-2 p-3 rounded-lg bg-slate-50 border border-purple-200 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <label class="text-purple-700 font-medium">🗓️ 音乐节时间表多图（支持多选上传多张，悬停演出时段时弹出预览）</label>
                  <label class="cursor-pointer px-2.5 py-1 rounded-lg silver-btn text-purple-700 font-medium transition">
                    + 多选上传时间表图片
                    <input type="file" id="cp-schedule-files" accept="image/*" multiple class="hidden" onchange="handleMultiScheduleUpload(event, 'cp')" />
                  </label>
                </div>
                <div class="flex gap-1.5">
                  <input id="cp-schedule-url-input" type="text" placeholder="输入单张时间表图片网址 https://... 后点添加" class="flex-1 px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs" />
                  <button type="button" onclick="addScheduleImageByUrl('cp')" class="px-2.5 py-1.5 rounded-lg silver-btn text-blue-700 font-medium">添加链接图</button>
                </div>
                <div id="cp-schedule-thumbs" class="flex gap-2 flex-wrap pt-1"></div>
              </div>

              <div>
                <label class="text-purple-700 font-medium block mb-1">🖼️ 演出海报（链接或上传本地图）</label>
                <div class="flex gap-1.5">
                  <input id="cp-tour-poster" type="text" placeholder="https://... 或点右侧上传" class="flex-1 px-2.5 py-2 rounded-lg border border-slate-300 bg-white" />
                  <label class="cursor-pointer px-2.5 py-2 rounded-lg silver-btn text-purple-700 shrink-0 font-medium">
                    上传图
                    <input type="file" accept="image/*" class="hidden" onchange="handleUpcomingPosterUpload(event)" />
                  </label>
                </div>
              </div>
              <div>
                <label class="text-blue-700 font-medium block mb-1">💺 场馆座位图（链接或上传本地图）</label>
                <div class="flex gap-1.5">

    function cleanSocialPostText(rawText) {
      if (!rawText) return '';
      let text = rawText
        .replace(/https?:\/\/\S+/g, '')
        .replace(/\[?(?:图片|视频|微博视频|查看图片|网页链接|秒拍视频|直播|超话|绿洲图片)\]?/g, '')
        .replace(/[\s\S]*?请领取你的小票\s*/g, '')
        .replace(/[「“"]?\.\.\.把文本复制下来[\s\S]*/g, '')
        .replace(/复制打开抖音[\s\S]*|小红书App[\s\S]*|长按复制此条消息[\s\S]*|打开小红书查看[\s\S]*|打开抖音搜索[\s\S]*/g, '')
        .replace(/[0-9a-zA-Z]{8,12}\s*$/g, '')
        .trim();

      const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
      if (lines.length >= 2) {
        const l1 = lines[0].replace(/[\s\.…。，,!！?？]/g, '');
        const l2 = lines[1].replace(/[\s\.…。，,!！?？]/g, '');
        if (l1 && l2 && (l1 === l2 || l2.startsWith(l1) || l1.startsWith(l2))) {
          lines.splice(0, 1);
        }
      }
      return lines.join(' ');
    }

    function extractVenueFromText(text) {
      const labelMatch = text.match(/(?:演出地点|演出场馆|活动地点|举办地点|场馆|场地|地址|地点|📍)\s*[：:]?\s*([^\n\r！!。⏰🗓️]+)/);
      if (labelMatch && labelMatch[1].trim().length >= 2) {
        return labelMatch[1].trim();
      }
      const venueRegex = /([\u4e00-\u9fa5A-Za-z0-9·\-\s]{2,28}(?:Live\s*House|LIVE\s*HOUSE|livehouse|OMNI\s*SPACE|HOU\s*LIVE|万代南梦宫|疆进酒|育音堂|声音共和|太空间|纽空间|正火艺术中心|稻香音乐空间|达丰空间|红节奏|不晚|体育中心体育馆|体育中心|体育馆|体育场|演艺中心|文化中心|大剧院|艺术中心|展览中心|会展中心|ECM中心|音乐广场|草坪|公园|营地|度假区|博览园|赛车场|沙滩|生态岛|嬉戏谷))/i;
      const m = text.match(venueRegex);
      return m ? m[1].trim() : '';
    }

    function extractShowDateRange(text, currentYear) {
      const rangeMatch = text.match(/(?:演出时间|演出日期|活动时间|时间)?\s*[：:]?\s*(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:[（(][^）)]+[）)])?\s*(?:[-~—至、和&]\s*(?:(\d{1,2})[月\.\-\/])?(\d{1,2})[日号]?)/);
      if (rangeMatch) {
        const y = rangeMatch[1] || currentYear;
        const m1 = rangeMatch[2].padStart(2, '0');
        const d1 = rangeMatch[3].padStart(2, '0');
        const m2 = (rangeMatch[4] || rangeMatch[2]).padStart(2, '0');
        const d2 = rangeMatch[5].padStart(2, '0');
        return `${y}-${m1}-${d1} ~ ${m2}-${d2} (连演2天)`;
      }
      const singleMatch = text.match(/(?:演出时间|演出日期|活动时间|时间)[：:]\s*(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:[（(]?(周[一二三四五六日天]|星期[一二三四五六日天])[）)]?)?/);
      if (singleMatch) {
        const y = singleMatch[1] || currentYear;
        const mo = singleMatch[2].padStart(2, '0');
        const da = singleMatch[3].padStart(2, '0');
        const wk = singleMatch[4] ? ` (${singleMatch[4]})` : '';
        return `${y}-${mo}-${da}${wk}`;
      }
      return '';
    }

    function extractStartTime(text) {
      const labelMatch = text.match(/(?:开场时间|演出开始|开演时间)[：:]?\s*([^\n\r！!。]+)/);
      if (labelMatch) return labelMatch[1].trim();
      const showLine = text.match(/(?:演出时间|演出日期)[：:]\s*([^\n\r]+)/);
      if (showLine) {
        const tMatch = showLine[1].match(/(?:每晚|每日|下午|晚上|晚)?\s*(\d{1,2}[:：]\d{2})/);
        if (tMatch) return `${tMatch[1].replace('：', ':')} 开场`;
      }
      return '';
    }

    function compressImageToDataURL(file, maxWidth = 760, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function preprocessImageForLocalOCR(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const scale = img.width < 1200 ? 2 : 1.3;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.filter = 'grayscale(100%) contrast(165%) brightness(105%)';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

        `).join('');

    function parseMultiShowsFromPlainText(rawText) {
      const currentYear = new Date().getFullYear();
      const themeMatch = rawText.match(/[「《]([^」》]+)[」》]\s*(巡回演唱会|演唱会|巡演|音乐节|嘉年华)?/);
      const defaultTheme = themeMatch ? `「${themeMatch[1]}」${themeMatch[2] || '巡回演唱会'}` : '';

      let artist = 'ONER';
      if (rawText.includes('岳岳') || rawText.includes('PINKRAY')) artist = '岳岳';
      else if (rawText.includes('木子洋') || rawText.includes('KWIN')) artist = '木子洋';
      else if (rawText.includes('灵超') || rawText.includes('DIDI')) artist = '灵超';
      else if (rawText.includes('坤音')) artist = '坤音娱乐';

      const lines = rawText.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const multiRows = [];

      lines.forEach(line => {
        const dMatch = line.match(/(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?/);
        const cMatch = line.match(/(北京|上海|广州|深圳|杭州|南京|合肥|西安|成都|重庆|武汉|长沙|苏州|天津|郑州|青岛|厦门|福州|宁波|昆明|沈阳|大连|哈尔滨|济南|太原|石家庄|南昌|贵阳|南宁|海口|三亚|珠海|佛山|东莞|无锡|常州|温州|兰州|乌鲁木齐|呼和浩特|[\u4e00-\u9fa5]{2,4}站)/);
        if (dMatch && cMatch) {
          const y = dMatch[1] || currentYear;
          const mo = dMatch[2].padStart(2, '0');
          const da = dMatch[3].padStart(2, '0');
          const venue = extractVenueFromText(line);
          const cityLabel = cMatch[1].endsWith('站') ? cMatch[1] : `${cMatch[1]}站`;
          multiRows.push({
            artist,
            theme: defaultTheme,
            city_or_title: cityLabel,
            date: `${y}-${mo}-${da}`,
            venue,
            prices: '',
            slot: '',
            type: /音乐节|嘉年华/.test(line + rawText) ? 'festival' : 'tour'
          });
        }
      });

      if (multiRows.length >= 2) return multiRows;

      const singleDateMatch = rawText.match(/(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?/);
      const singleDate = singleDateMatch
        ? `${singleDateMatch[1] || currentYear}-${singleDateMatch[2].padStart(2, '0')}-${singleDateMatch[3].padStart(2, '0')}`
        : '';
      const cityMatch = rawText.match(/[「【\[]?([\u4e00-\u9fa5]{2,5}站)[」】\]]?/);
      const venue = extractVenueFromText(rawText);

      const priceNums = [...rawText.matchAll(/(?:￥|RMB|¥)?\s*(\d{3,4})\s*(?:元)?/g)]
        .map(m => Number(m[1]))
        .filter(n => n >= 180 && n <= 2980 && n !== 2024 && n !== 2025 && n !== 2026);
      const uniquePrices = [...new Set(priceNums)].sort((a, b) => a - b);

      const slotMatch = rawText.match(/\b(\d{1,2}:\d{2}\s*[-~—至]\s*\d{1,2}:\d{2})\b/);

      return [{
        artist,
        theme: defaultTheme,
        city_or_title: cityMatch ? cityMatch[1] : (defaultTheme || ''),
        date: singleDate,
        venue,
        prices: uniquePrices.length ? uniquePrices.map(p => `¥${p}`).join(' / ') : '',
        slot: slotMatch ? slotMatch[1] : '',
        type: /音乐节|嘉年华/.test(rawText) ? 'festival' : 'tour'
      }];
    }

    async function callGeminiVisionWithFallback(apiKey, mimeType, base64Data, promptText) {
      const candidateModels = [
        'gemini-3.5-flash-lite',
        'gemini-3.8-flash',
        'gemini-3-flash-preview'
      ];
      let lastErr = '';
      for (const modelName of candidateModels) {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const resp = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: mimeType, data: base64Data } }
              ]
            }]
          })
        });
        if (resp.ok) {
          return await resp.json();
        }
        lastErr = `模型 ${modelName} 返回 HTTP ${resp.status}`;
      }
      throw new Error(lastErr || '所有 AI 模型节点均未响应');
    }

    async function runSmartPosterRecognition() {
      const imgSrc = document.getElementById('arc-poster-url').value.trim();
      if (!imgSrc) return alert('请先上传官宣海报或排期表格图片！');

      const btn = document.getElementById('arc-ocr-btn');
      const statusEl = document.getElementById('arc-ocr-status');
      btn.disabled = true;
      btn.textContent = '⏳ 识别中...';
      statusEl.classList.remove('hidden');

      const geminiApiKey = localStorage.getItem(GEMINI_KEY_STORAGE);

      try {
        if (geminiApiKey && imgSrc.startsWith('data:image/')) {
          statusEl.textContent = '🤖 正在使用 Gemini 最新多模态引擎分析海报与排期表格...';
          const base64Data = imgSrc.split(',')[1];
          const mimeType = imgSrc.split(';')[0].split(':')[1] || 'image/jpeg';

          const promptText = `请仔细识别这张演出/巡演/音乐节海报或排期表格图片中的所有场次信息。
如果图片是一张包含多场巡演排期的表格，请把每一场演出拆分为数组中的独立对象；如果只是单场海报，则返回包含1个对象的数组。
严格仅返回纯 JSON 数组（不要加 markdown 代码块标记），字段格式如下：
[
  {
    "artist": "艺人或组合名（如 ONER / 岳岳 / 木子洋 / 灵超 / 坤音娱乐）",
    "theme": "巡演或音乐节主标题（如 「极尽声色」巡回演唱会）",
    "city_or_title": "城市站次或具体场次名（如 合肥站 / 北京站）",
    "date": "演出日期 YYYY-MM-DD（若未写年份默认 2026）",
    "date_display": "若连演两天写如 2026-12-26 ~ 12-27 (连演2天)，单天写 YYYY-MM-DD",
    "start_time": "开场时间（如 19:30 开场，若有）",
    "venue": "具体场馆或Livehouse名称（如 疆进酒·OMNI SPACE / 合肥少荃体育中心体育馆）",
    "prices": "票价档位（如 ¥380 / ¥580 / ¥780）",
    "sale_time": "开票时间 YYYY-MM-DD HH:mm（若有）",
    "platform": "购票平台（如 大麦 | 猫眼）",
    "slot": "音乐节演出时段（如 16:20-17:00，若有）",
    "type": "tour 或 festival"
  }
]`;

          const json = await callGeminiVisionWithFallback(geminiApiKey, mimeType, base64Data, promptText);
          const rawOut = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const cleanedJsonStr = rawOut.replace(/```json|```/gi, '').trim();
          const parsedShows = JSON.parse(cleanedJsonStr);

          renderRecognizedShowsBatch(parsedShows);
          statusEl.textContent = `✅ AI 视觉识别成功！共提取到 ${parsedShows.length} 场演出信息，请核对后保存或批量导入。`;
          return;
        }

        statusEl.textContent = '🔍 正在增强图片对比度并运行本地中文 OCR...';
        const enhancedImg = imgSrc.startsWith('data:image/') ? await preprocessImageForLocalOCR(imgSrc) : imgSrc;
        const result = await Tesseract.recognize(enhancedImg, 'chi_sim+eng');
        const ocrText = (result.data?.text || '').trim();
        if (!ocrText) {
          statusEl.textContent = '⚠️ 未能识别到清晰文字，建议配置顶部「🔑 AI 识图密钥」或手动填写。';
          return;
        }
        const shows = parseMultiShowsFromPlainText(ocrText);
        renderRecognizedShowsBatch(shows);
        statusEl.textContent = `✅ 本地 OCR 识别完成，共提取到 ${shows.length} 场信息，请核对微调后保存。`;
      } catch (e) {
        statusEl.textContent = `❌ 识别出错：${e.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = '🔍 智能识别图片（支持多场表格拆分）';
      }
    }

    function parseDateFromSnippet(snippet, currentYear) {
      const dateRegex = /(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:[（(]?(?:周[一二三四五六日天]|星期[一二三四五六日天])[）)]?)?\s*(?:上午|中午|下午|晚上)?\s*(\d{1,2})[:：点时](\d{1,2})?/;
      const m = snippet.match(dateRegex);
      if (!m) return '';
      const year = m[1] || currentYear;
      const month = m[2].padStart(2, '0');
      const day = m[3].padStart(2, '0');
      let hour = parseInt(m[4], 10);
      if ((snippet.includes('下午') || snippet.includes('晚上')) && hour < 12) hour += 12;
      const minute = (m[5] || '00').padStart(2, '0');
      return `${year}-${month}-${day}T${String(hour).padStart(2, '0')}:${minute}`;
    }

      else if (text.includes('坤音')) artist = '坤音娱乐';

      const isTicket = /开票|预售|抢票|巡演|演唱会|音乐节|嘉年华|Livehouse|Live House|大麦|秀动|售票时间|购票平台|优先购|特权购/i.test(text);
      document.getElementsByName('cloudEntryType').forEach(r => r.checked = (r.value === (isTicket ? 'ticket' : 'feed')));

      let defaultPlatform = '微博';
      if (isTicket) {
        const platMatch = text.match(/(?:购票平台|售票平台|票务平台)[：:]\s*([^\n\r⏰📍🗓️]+)/);
        if (platMatch) {
          defaultPlatform = platMatch[1].trim();
        } else {
          const foundPlats = ['大麦', '坤音商城小程序', '坤音商城', '猫眼', '携程', '票星球', '秀动', '纷玩岛'].filter(p => text.includes(p));
          if (foundPlats.length) defaultPlatform = [...new Set(foundPlats)].join(' | ');
        }
      } else {
        if (/xhslink\.com|xiaohongshu\.com|小红书/.test(text)) defaultPlatform = '小红书';
        else if (/douyin\.com|抖音/.test(text)) defaultPlatform = '抖音';
        else if (/b23\.tv|bilibili\.com|B站|哔哩哔哩/.test(text)) defaultPlatform = 'B站';
        else if (/youtu\.be|youtube\.com|YouTube/i.test(text)) defaultPlatform = 'YouTube';
        else if (/instagram\.com|ins/i.test(text)) defaultPlatform = 'Instagram';
        else if (/tiktok\.com|TikTok/i.test(text)) defaultPlatform = 'TikTok';
      }

      const themeMatch = text.match(/[「《]([^」》]+)[」》]\s*(巡回演唱会|演唱会|巡演|音乐节|嘉年华|见面会|音乐会)?/);
      const festDirectMatch = text.match(/([\u4e00-\u9fa5A-Za-z0-9·]{2,16}(?:音乐节|嘉年华))/);
      const themeStr = themeMatch
        ? `「${themeMatch[1]}」${themeMatch[2] || (text.includes('音乐节') ? '音乐节' : '巡回演唱会')}`
        : (festDirectMatch ? festDirectMatch[1] : '');

      const cityMatch = text.match(/[「【\[]?([\u4e00-\u9fa5]{2,5}站)[」】\]]?/);
      const cityStr = cityMatch ? cityMatch[1] : (themeStr || '巡演场次');

      const venueStr = extractVenueFromText(text);
      const currentYear = new Date().getFullYear();
      const showDateStr = extractShowDateRange(text, currentYear);
      const startTimeStr = extractStartTime(text);

      const priceLineMatch = text.match(/(?:票价|价格|门票)[：:]?\s*([^\n\r]+)/);
      const pricesStr = priceLineMatch ? priceLineMatch[1].trim() : '';

      let slotStr = '';
      const slotLabelMatch = text.match(/(?:预计演出时段|演出时段|登台时间|出场时间)[：:]\s*([^\n\r！!。]+)/);
      if (slotLabelMatch) {
        slotStr = slotLabelMatch[1].trim();
      } else if (/音乐节|嘉年华/.test(text)) {
        const rangeMatch = text.match(/\b(\d{1,2}:\d{2}\s*[-~—至]\s*\d{1,2}:\d{2})\b/);
        if (rangeMatch) slotStr = rangeMatch[1].trim();
      }

      const roundsContainer = document.getElementById('ticket-rounds-container');
      roundsContainer.innerHTML = '';

      const detectedRounds = [];
      const prioMatch = text.match(/(?:优先购|特权购|会员购)[^\n\r]{0,38}/);
      if (prioMatch) {
        const t = parseDateFromSnippet(prioMatch[0], currentYear);
        if (t) {
          const pPlat = prioMatch[0].includes('坤音') ? '坤音商城小程序' : defaultPlatform;
          detectedRounds.push({ round_name: '优先购', sale_time: t, platform: pPlat });
        }
      }

      const presaleMatch = text.match(/(?:全面预售|预售开启|预售时间|预售)[^\n\r]{0,38}/);
      if (presaleMatch) {
        const t = parseDateFromSnippet(presaleMatch[0], currentYear);
        if (t && !detectedRounds.some(r => r.sale_time === t)) {
          detectedRounds.push({ round_name: '预售', sale_time: t, platform: defaultPlatform });
        }
      }

      const mainSaleMatch = text.match(/(?:正式开票|全面开票|售票时间|开票时间)[^\n\r]{0,40}/);
      if (mainSaleMatch) {
        const t = parseDateFromSnippet(mainSaleMatch[0], currentYear);
        if (t && !detectedRounds.some(r => r.sale_time === t)) {
          detectedRounds.push({ round_name: '正式开票', sale_time: t, platform: defaultPlatform });
        }
      }

      if (detectedRounds.length === 0) {
        const fallbackTime = parseDateFromSnippet(text, currentYear);
        const defaultLabel = /预售/.test(text) ? '预售' : '正式开票';
        detectedRounds.push({ round_name: defaultLabel, sale_time: fallbackTime, platform: defaultPlatform });
      }

      detectedRounds.forEach(r => addTicketRoundRow(r.round_name, r.sale_time, r.platform));

      let matchedTransport = findPresetTransport(`${themeStr} ${cityStr} ${venueStr} ${text}`);
      if (!matchedTransport && isTicket) {
        const placeName = venueStr || '演出现场';
        matchedTransport = [
          `🚇 地铁/公交：点击「导航 ↗」使用高德地图搜索「${placeName}」查看最近站点`,
          `🚄 高铁站/机场 → ${placeName}：出站后可乘地铁换乘或网约车直达`
        ].join('\n');
      }

      const cleanText = cleanSocialPostText(text);

      document.getElementById('cp-artist').value = artist;
      document.getElementById('cp-platform').value = defaultPlatform;
      document.getElementById('cp-tour-theme').value = themeStr;
      document.getElementById('cp-tour-title').value = cityStr;
      document.getElementById('cp-tour-venue').value = venueStr;
      document.getElementById('cp-tour-showdate').value = showDateStr;
      document.getElementById('cp-tour-starttime').value = startTimeStr;
      document.getElementById('cp-tour-prices').value = pricesStr;
      document.getElementById('cp-tour-slot').value = slotStr;
      document.getElementById('cp-tour-poster').value = '';
      document.getElementById('cp-tour-seat').value = '';
      document.getElementById('cp-tour-transport').value = matchedTransport;
      document.getElementById('cp-content').value = cleanText;
      document.getElementById('cp-time').value = isTicket ? '' : (parseDateFromSnippet(text, currentYear) || getLocalDatetimeString());
      document.getElementById('cp-url').value = url;
      document.getElementById('cp-url-ticket').value = url;
      document.getElementById('cp-img').value = '';

      toggleCloudFields();
      document.getElementById('parse-confirm-box').classList.remove('hidden');
    }

    async function submitCloudEntry() {
      const type = document.querySelector('input[name="cloudEntryType"]:checked').value;
      const artist = document.getElementById('cp-artist').value;

      const btn = document.getElementById('cp-submit-btn');
      btn.disabled = true;
      btn.textContent = '☁️ 正在同步至云端...';

      try {
        if (type === 'ticket') {
          const theme = document.getElementById('cp-tour-theme').value.trim();
          const tourTitle = document.getElementById('cp-tour-title').value.trim();
          const venue = document.getElementById('cp-tour-venue').value.trim() || '场馆待补充';
          const showDate = document.getElementById('cp-tour-showdate').value.trim();
          const startTime = document.getElementById('cp-tour-starttime').value.trim();
          const prices = document.getElementById('cp-tour-prices').value.trim();
          const slotNote = document.getElementById('cp-tour-slot').value.trim();
          const posterUrl = document.getElementById('cp-tour-poster').value.trim();
          const seatUrl = document.getElementById('cp-tour-seat').value.trim();
          const transportText = document.getElementById('cp-tour-transport').value.trim();
          const url = document.getElementById('cp-url-ticket').value.trim();

          if (!tourTitle) throw new Error('请填写城市站次或场次名！');

          const rounds = [];
          document.querySelectorAll('.ticket-round-row').forEach(row => {
            const round_name = row.querySelector('.tr-name').value.trim() || '正式开票';
            const sale_time = row.querySelector('.tr-time').value;
            const platform = row.querySelector('.tr-plat').value.trim() || '大麦';
            if (sale_time) {
              rounds.push({ round_name, sale_time: sale_time.replace('T', ' '), platform });
            }
          });

          rounds.sort((a, b) => new Date(a.sale_time.replace(/-/g, '/')) - new Date(b.sale_time.replace(/-/g, '/')));
          const fallbackIso = (showDate.match(/\d{4}-\d{2}-\d{2}/)?.[0] || new Date().toISOString().slice(0, 10)) + 'T19:30';
          const earliestIsoTime = rounds.length > 0 ? rounds[0].sale_time.replace(' ', 'T') : fallbackIso;

          const displayTitle = theme && !tourTitle.includes(theme) ? `${theme} · ${tourTitle}` : tourTitle;
          const structuredTitle = `${artist}|${displayTitle}|${venue}|${showDate || earliestIsoTime.slice(0, 10)}|${slotNote}`;
          const tourMetaObj = {
            rounds,
            transport: transportText,
            slot: slotNote,
            theme,
            prices,
            startTime,
            posterUrl,
            seatUrl,
            scheduleImgs: cpScheduleImgs
          };
          const encodedMeta = `META:${JSON.stringify(tourMetaObj)}`;
          const payload = { title: structuredTitle, ticket_time: earliestIsoTime, platform: encodedMeta, url };

          const apiUrl = editingTicketId
            ? `${SUPABASE_URL}/rest/v1/tickets?id=eq.${editingTicketId}`
            : `${SUPABASE_URL}/rest/v1/tickets`;
          const method = editingTicketId ? 'PATCH' : 'POST';

          const res = await fetch(apiUrl, {
            method, headers: SB_HEADERS, body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        } else if (type === 'archive') {
          const subType = document.querySelector('input[name="archiveSubType"]:checked')?.value || 'tour';
          const theme = document.getElementById('arc-theme').value.trim();
          const title = document.getElementById('arc-title').value.trim();
          const showDate = document.getElementById('arc-date').value;
          const venue = document.getElementById('arc-venue').value.trim() || '演出地点待补充';
          const posterUrl = document.getElementById('arc-poster-url').value.trim();
          const prices = document.getElementById('arc-prices').value.trim();
          const seatUrl = document.getElementById('arc-seat-url').value.trim();
          const slot = document.getElementById('arc-slot').value.trim();
          const setlistRaw = document.getElementById('arc-setlist').value.trim();
          const url = document.getElementById('arc-url').value.trim();

          if (!title) throw new Error('请填写具体站次或场次标题！');
          if (!showDate) throw new Error('请选择演出日期！');

          const setlist = setlistRaw
            ? setlistRaw.split('\n').map(s => s.replace(/^\d+[\.、\s]+/, '').trim()).filter(Boolean)
            : [];

          const displayTitle = theme && !title.includes(theme) ? `${theme} · ${title}` : title;
          const archiveObj = {
            subType,
            theme,
            venue,
            posterUrl,
            prices,
            seatUrl,
            slot,
            scheduleImgs: arcScheduleImgs,
            setlist
          };
          const structuredTitle = `ARCHIVE|${artist}|${displayTitle}|${showDate}`;
          const encodedMeta = `ARCHIVE:${JSON.stringify(archiveObj)}`;
          const payload = { title: structuredTitle, ticket_time: `${showDate}T19:30`, platform: encodedMeta, url };

          const res = await fetch(`${SUPABASE_URL}/rest/v1/tickets`, {
            method: 'POST', headers: SB_HEADERS, body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

          document.getElementById('arc-poster-preview').classList.add('hidden');
          document.getElementById('arc-ocr-status').classList.add('hidden');
        } else {
          const platform = document.getElementById('cp-platform').value.trim() || '微博';
          const content = cleanSocialPostText(document.getElementById('cp-content').value.trim());
          const url = document.getElementById('cp-url').value.trim();
          const imgUrl = document.getElementById('cp-img').value.trim();
          const customTimeVal = document.getElementById('cp-time').value;

          if (!content) throw new Error('请填写博文正文！');

          let storedContent = content;
          if (imgUrl) storedContent += `\n[IMG:${imgUrl}]`;
          if (customTimeVal) {
            const pubTs = new Date(customTimeVal).getTime();
            if (!isNaN(pubTs)) storedContent += `\n[PUB:${pubTs}]`;
          }

          const payload = { platform, artist, content: storedContent, url };
          const res = await fetch(`${SUPABASE_URL}/rest/v1/feeds`, {
            method: 'POST', headers: SB_HEADERS, body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        }

        resetConfirmForm();
        await loadTourData();
        await loadAllFeeds(true);
      } catch (e) {
        alert(`同步失败 (${e.message})`);
      } finally {
        btn.disabled = false;
        btn.textContent = editingTicketId ? '💾 保存修改并同步至所有设备' : '☁️ 确认发布并同步至所有设备';
      }
    }

    async function archiveExistingTicket(cloudId) {
      const item = cloudTickets.find(t => t.cloudId === cloudId);
      if (!item) return;
      if (!confirm(`确定将「${item.city}」归档到往日演出回顾时间线吗？`)) return;

      const dateOnly = (item.show_date || '').match(/\d{4}-\d{2}-\d{2}/)?.[0] || new Date().toISOString().slice(0, 10);
      const isFest = /音乐节|嘉年华/.test(item.city);
      const archiveObj = {

        theme: item.theme || '',
        venue: item.venue || '',
        posterUrl: item.posterUrl || '',
        prices: item.prices || '',
        seatUrl: item.seatUrl || '',
        slot: item.slot || '',
        scheduleImgs: item.scheduleImgs || [],
        setlist: []
      };

      const payload = {
        title: `ARCHIVE|${item.artist}|${item.city}|${dateOnly}`,
        ticket_time: `${dateOnly}T19:30`,

    function downloadICS(title, timeStr, platform, url) {
      const start = new Date(timeStr.replace(/-/g, '/'));
      if (isNaN(start)) return alert('时间格式暂不支持导出日历');
      const end = new Date(start.getTime() + 30 * 60000);
      const fmt = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
        `SUMMARY:🎫 抢票提醒：${title} (${platform})`,
        `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
        `DESCRIPTION:售票平台：${platform}\\n直达链接：${url || ''}`,
        'BEGIN:VALARM', 'TRIGGER:-PT15M', 'ACTION:DISPLAY', 'DESCRIPTION:还有15分钟开票！', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR'
      ].join('\r\n');
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}-开票提醒.ics`;
      a.click();
    }
