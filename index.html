    function extractThemeName(fullTitle, savedTheme = '') {
      if (savedTheme) return savedTheme;
      const m = (fullTitle || '').match(/([「《][^」》]+[」》]\s*(?:巡回演唱会|演唱会|巡演|音乐节|嘉年华)?)/);
      return m ? m[1].trim() : '';
    }

    // 单条容错加载云端演出记录，确保任何单条异常数据都不会影响全部演出展示
    async function loadTourData() {
      cloudTickets = [];
      cloudArchives = [];
      try {
        const sbRes = await fetch(`${SUPABASE_URL}/rest/v1/tickets?select=*&order=ticket_time.asc`, { headers: SB_HEADERS });
        if (sbRes.ok) {
          const rows = await sbRes.json();
          rows.forEach(r => {
            try {
              const rawTitle = r.title || '';
              const rawTime = r.ticket_time || '';
              const rawPlat = r.platform || '';

              if (rawTitle.startsWith('ARCHIVE|')) {
                const parts = rawTitle.split('|');
                const artist = parts[1] || 'ONER';
                const showTitle = parts[2] || '演出回顾';
                const showDate = parts[3] || rawTime.slice(0, 10);
                let arcData = { subType: 'tour', theme: '', venue: '', posterUrl: '', prices: '', seatUrl: '', slot: '', scheduleImgs: [], setlist: [] };
                if (rawPlat.startsWith('ARCHIVE:')) {
                  try {
                    arcData = { ...arcData, ...JSON.parse(rawPlat.slice(8)) };
                  } catch (e) {}
                }
                const resolvedTheme = extractThemeName(showTitle, arcData.theme);
                cloudArchives.push({
                  cloudId: r.id,
                  artist,
                  title: showTitle,
                  theme: resolvedTheme,
                  showDate,
                  year: showDate.slice(0, 4),
                  url: r.url || '',
                  ...arcData
                });
                return;
              }

              const parts = rawTitle.split('|');
              const artist = parts.length > 1 ? parts[0] : 'ONER';
              const cityTitle = parts.length > 1 ? parts[1] : rawTitle;
              const venue = parts.length > 2 ? parts[2] : '场馆待补充';
              const showDate = parts.length > 3 ? parts[3] : rawTime.replace('T', ' ');
              let slotNote = parts.length > 4 ? parts[4] : '';

              let parsedRounds = [];
              let savedTransport = '';
              let savedTheme = '';
              let savedPrices = '';
              let savedStartTime = '';
              let savedPosterUrl = '';
              let savedSeatUrl = '';
              let savedScheduleImgs = [];

              if (rawPlat.startsWith('META:')) {
                try {
                  const meta = JSON.parse(rawPlat.slice(5));
                  if (Array.isArray(meta.rounds)) parsedRounds = meta.rounds;
                  if (meta.transport) savedTransport = meta.transport;
                  if (meta.slot) slotNote = meta.slot;
                  if (meta.theme) savedTheme = meta.theme;
                  if (meta.prices) savedPrices = meta.prices;
                  if (meta.startTime) savedStartTime = meta.startTime;
                  if (meta.posterUrl) savedPosterUrl = meta.posterUrl;
                  if (meta.seatUrl) savedSeatUrl = meta.seatUrl;
                  if (Array.isArray(meta.scheduleImgs)) savedScheduleImgs = meta.scheduleImgs;
                } catch (e) {}
              } else if (rawPlat.startsWith('ROUNDS:')) {
                try {
                  parsedRounds = JSON.parse(rawPlat.slice(7));
                } catch (e) {}
              }

              if (!Array.isArray(parsedRounds) || parsedRounds.length === 0) {
                if (rawPlat && !rawPlat.startsWith('META:')) {
                  parsedRounds = [{
                    round_name: '正式开票',
                    sale_time: rawTime.replace('T', ' '),
                    platform: rawPlat || '大麦'
                  }];
                }
              }

              if (!savedTransport) {
                savedTransport = findPresetTransport(`${cityTitle} ${venue}`);
              }

              const resolvedTheme = extractThemeName(cityTitle, savedTheme);

              cloudTickets.push({
                cloudId: r.id,
                artist,
                city: cityTitle,
                theme: resolvedTheme,
                venue,
                show_date: showDate,
                startTime: savedStartTime,
                slot: slotNote,
                prices: savedPrices,
                posterUrl: savedPosterUrl,
                seatUrl: savedSeatUrl,
                scheduleImgs: savedScheduleImgs,
                source_url: r.url || '#',
                rounds: parsedRounds,
                transport: savedTransport
              });
            } catch (rowErr) {
              console.warn('跳过异常行数据:', r, rowErr);
            }
          });
        }
      } catch (e) {
        console.error('加载演出数据异常:', e);
      }

      cloudArchives.sort((a, b) => new Date(b.showDate) - new Date(a.showDate));
      updateArchiveYearOptions();

      tourSchedules = [...cloudTickets];
      renderThemeQuickBar();
      renderTourCards();
      renderArchiveTimeline();
    }

    function renderThemeQuickBar() {
      const bar = document.getElementById('tour-themes-bar');
      const allThemes = new Set();
      [...tourSchedules, ...cloudArchives].forEach(item => {
        if (item.theme) allThemes.add(item.theme);
      });
      if (!allThemes.size) {
        bar.innerHTML = '';
        return;
      }
      bar.innerHTML = [...allThemes].map(theme => {
        const safeTheme = String(theme).replace(/['"<>]/g, '');
        return `
          <button type="button" data-theme="${safeTheme}" onclick="openThemeDetailModal(this.dataset.theme)"
            class="text-xs px-2.5 py-1 rounded-full silver-btn text-purple-700 font-medium transition shadow-2xs">
            🎪 ${safeTheme} 巡礼专题 ↗
          </button>
        `;
      }).join('');
    }

    // 同主题巡演一页式网格专题 Modal（含各站海报直接展示）
    function openThemeDetailModal(themeName) {
      const upcoming = tourSchedules.filter(t => t.theme === themeName).map(u => ({
        status: (u.rounds || []).some(r => new Date(r.sale_time.replace(/-/g, '/')).getTime() > Date.now()) ? 'selling' : 'upcoming',
        title: u.city,
        date: u.show_date,
        startTime: u.startTime || '',
        venue: u.venue,
        prices: u.prices || '',
        posterUrl: u.posterUrl || '',
        seatUrl: u.seatUrl || '',
        transport: u.transport || '',
        url: u.source_url && u.source_url !== '#' ? u.source_url : '',
        artist: u.artist
      }));

      const past = cloudArchives.filter(a => a.theme === themeName).map(p => ({
        status: 'past',
        title: p.title,
        date: p.showDate,
        startTime: '',
        venue: p.venue,
        prices: p.prices || '',
        posterUrl: p.posterUrl || '',
        seatUrl: p.seatUrl || '',
        transport: '',
        url: p.url || '',
        artist: p.artist
      }));

      const allStops = [...upcoming, ...past].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      const sampleArtist = allStops[0]?.artist || 'ONER';
      const mainPoster = past.find(p => p.posterUrl)?.posterUrl || upcoming.find(u => u.posterUrl)?.posterUrl || '';

      const posterEl = document.getElementById('theme-modal-poster');
      if (mainPoster) {
        posterEl.src = mainPoster;
        posterEl.classList.remove('hidden');
      } else {
        posterEl.classList.add('hidden');
      }

      document.getElementById('theme-modal-title').textContent = themeName;
      document.getElementById('theme-modal-subtitle').textContent = `关联艺人：${sampleArtist} ｜ 共收录 ${allStops.length} 站（近期待演 ${upcoming.length} 站 · 已圆满落幕 ${past.length} 站）`;

      const bodyEl = document.getElementById('theme-modal-body');

      bodyEl.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
          ${allStops.map((stop, idx) => {
            const statusPill = stop.status === 'selling'
              ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-pink-50 text-pink-700 border border-pink-200 font-semibold">🔥 售票中</span>`
              : stop.status === 'upcoming'
                ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-semibold">🎫 待开演</span>`
                : `<span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-300 font-medium">🏛️ 已落幕</span>`;

            const shortName = stop.title.replace(themeName, '').replace(/^[·\s]+/, '') || stop.title;
            const displayPoster = stop.posterUrl || mainPoster;

            return `
              <div class="p-3.5 rounded-xl bg-white border border-slate-200 hover:border-purple-300 shadow-2xs transition flex flex-col justify-between gap-2.5 text-xs">
                <div class="flex gap-3">
                  ${displayPoster ? `
                    <img src="${displayPoster}" data-cap="${shortName} · 演出海报" onclick="openLightbox(this.src, this.dataset.cap)"
                      class="w-16 h-24 object-cover rounded-lg border border-slate-200 cursor-zoom-in shrink-0 hover:opacity-90 transition" />
                  ` : ''}
                  <div class="space-y-1.5 min-w-0 flex-1">
                    <div class="flex items-start justify-between gap-1.5">
                      <span class="font-bold text-sm text-slate-900 leading-snug">${shortName}</span>
                      ${statusPill}
                    </div>
                    <div class="text-slate-500 space-y-0.5">
                      <p>🗓️ ${stop.date} ${stop.startTime ? `· ⏰ ${stop.startTime}` : ''}</p>
                      <p class="truncate" title="${stop.venue}">📍 ${stop.venue}</p>
                    </div>
                    ${stop.prices ? `<div class="text-[11px] text-pink-700 bg-pink-50 border border-pink-200 px-2 py-0.5 rounded inline-block">💰 ${stop.prices}</div>` : ''}
                  </div>
                </div>

                <div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-2 flex-wrap">
                  <div class="flex items-center gap-1.5">
                    ${stop.seatUrl ? `<button type="button" data-src="${stop.seatUrl}" data-cap="${shortName} · 座位图" onclick="openLightbox(this.dataset.src, this.dataset.cap)" class="px-2 py-0.5 rounded silver-btn text-blue-700 text-[11px]">💺 座位图</button>` : ''}
                    ${stop.transport ? `<button type="button" onclick="document.getElementById('theme-tr-${idx}').classList.toggle('hidden')" class="px-2 py-0.5 rounded silver-btn text-purple-700 text-[11px]">🚇 交通</button>` : ''}
                  </div>
                  ${stop.url ? `<a href="${stop.url}" target="_blank" class="text-[11px] text-slate-500 hover:text-blue-600">原帖 ↗</a>` : ''}
                </div>
                ${stop.transport ? `<div id="theme-tr-${idx}" class="hidden p-2 rounded bg-slate-50 border border-slate-200 text-[11px] text-slate-600 whitespace-pre-line leading-relaxed">${stop.transport}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;

      document.getElementById('theme-detail-modal').classList.remove('hidden');
    }

    function updateArchiveYearOptions() {
      const selectEl = document.getElementById('archive-year-filter');
      const currentVal = selectEl.value;
      const years = [...new Set(cloudArchives.map(a => a.year).filter(Boolean))].sort((a, b) => b.localeCompare(a));
      selectEl.innerHTML = `<option value="ALL">全部年份</option>` + years.map(y => `<option value="${y}">${y} 年</option>`).join('');
      if (years.includes(currentVal)) selectEl.value = currentVal;
    }

    function setArchiveTypeFilter(type) {
      activeArchiveType = type;
      ['ALL', 'tour', 'festival'].forEach(t => {
        const btn = document.getElementById(`arc-filter-${t}`);
        if (!btn) return;
        if (t === type) {
          btn.className = 'px-2.5 py-1 rounded-md pearl-gradient text-white font-medium transition';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md text-slate-600 hover:bg-slate-100 transition';
        }
      });
      renderArchiveTimeline();
    }

    function toggleArchiveExpand() {
      isArchiveExpanded = !isArchiveExpanded;
      renderArchiveTimeline();
    }

    function buildSlotHoverBadgeHTML(slotText, scheduleImgs, popoverId, titleLabel) {
      if (!slotText && (!scheduleImgs || !scheduleImgs.length)) return '';
      const imgs = Array.isArray(scheduleImgs) ? scheduleImgs : [];
      const hasImgs = imgs.length > 0;
      const safeTitle = String(titleLabel || '').replace(/['"<>]/g, '');

      const popoverHtml = hasImgs ? `
        <div id="${popoverId}" class="hidden absolute left-0 bottom-full mb-2 z-50 w-72 sm:w-96 p-3 rounded-xl bg-white border border-purple-300 shadow-2xl">
          <div class="flex items-center justify-between text-[11px] text-purple-800 font-semibold mb-2">
            <span>🗓️ ${safeTitle} · 音乐节时间表（共 ${imgs.length} 张，点击放大）</span>
          </div>
          <div class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto no-scrollbar">
            ${imgs.map((src, i) => `
              <img src="${src}" data-caption="${safeTitle} · 时间表 #${i + 1}"
                onclick="event.stopPropagation(); openLightbox(this.src, this.dataset.caption)"
                class="w-full h-28 object-cover rounded-lg border border-slate-200 cursor-zoom-in hover:opacity-90 transition bg-slate-50" />
            `).join('')}
          </div>
        </div>
      ` : '';

      return `
        <div class="relative inline-block"
          ${hasImgs ? `onmouseenter="showSlotHoverPopover('${popoverId}')" onmouseleave="hideSlotHoverPopover('${popoverId}')"` : ''}>
          <span ${hasImgs ? `onclick="toggleSlotHoverPopover('${popoverId}')"` : ''}
            class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-md bg-purple-50 border border-purple-200 text-purple-700 font-medium ${hasImgs ? 'cursor-pointer hover:bg-purple-100' : ''}">
            <span>🎤 ${slotText || '音乐节时间表'}</span>
            ${hasImgs ? `<span class="text-[10px] px-1 rounded bg-white text-blue-700 border border-purple-200">时间表×${imgs.length}</span>` : ''}
          </span>
          ${popoverHtml}
        </div>
      `;
    }

    // 往日演出统一采用清晰直观的竖行卡片样式
    function buildArchiveVerticalCardHTML(item) {
      const matchedArtist = artistsConfig.find(a => a.artistName.toLowerCase() === (item.artist || '').toLowerCase());
      const artistBadgeBg = matchedArtist?.badgeStyle || COLOR_PEARL;
      const isFest = item.subType === 'festival';
      const slotPopoverId = `arc-slot-pop-${item.cloudId}`;
      const safeTitle = String(item.title || '').replace(/['"<>]/g, '');
      const safeTheme = String(item.theme || '').replace(/['"<>]/g, '');

      const setlistHtml = (item.setlist || []).length > 0
        ? `<div class="mt-2.5 p-3 rounded-xl bg-emerald-50/70 border border-emerald-200">
            <div class="text-xs font-bold text-emerald-800 mb-1.5">🎤 现场演唱歌单（共 ${item.setlist.length} 首）：</div>
            <ol class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-700 list-decimal list-inside">
              ${item.setlist.map(song => `<li class="truncate">${song}</li>`).join('')}
            </ol>
          </div>`
        : '';

      return `
        <div class="p-4 sm:p-5 rounded-2xl frost-card flex flex-col sm:flex-row gap-4">
          ${item.posterUrl ? `
            <div class="sm:w-32 shrink-0">
              <img src="${item.posterUrl}" alt="${safeTitle}" data-cap="${safeTitle} · 官宣海报" onclick="openLightbox(this.src, this.dataset.cap)"
                class="w-full h-44 object-cover rounded-xl border border-slate-200 cursor-zoom-in hover:opacity-90 transition shadow-2xs" />
            </div>
          ` : ''}

          <div class="flex-1 min-w-0 flex flex-col justify-between gap-2">
            <div>
              <div class="flex items-start justify-between gap-2">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs px-2 py-0.5 rounded text-white font-semibold" style="background:${artistBadgeBg}">${item.artist}</span>
                  <span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${isFest ? 'bg-purple-50 text-purple-700 border border-purple-200' : 'bg-blue-50 text-blue-700 border border-blue-200'}">
                    ${isFest ? '🎪 音乐节' : '🏟️ 巡演/Livehouse'}
                  </span>
                  <h3 class="font-bold text-base text-slate-900">${safeTitle}</h3>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  ${safeTheme ? `<button type="button" data-theme="${safeTheme}" onclick="openThemeDetailModal(this.dataset.theme)" class="text-xs text-purple-700 hover:underline font-medium">巡礼专题 ↗</button>` : ''}
                  ${item.url ? `<a href="${item.url}" target="_blank" class="text-xs text-slate-500 hover:text-blue-600">原帖 ↗</a>` : ''}
                  ${isAdmin ? `<button type="button" onclick="deleteCloudRecord('tickets', ${item.cloudId})" class="text-xs text-rose-600 hover:underline">删除</button>` : ''}
                </div>
              </div>

              <p class="text-xs text-slate-500 mt-1.5">🗓️ ${item.showDate} ｜ 📍 ${item.venue}</p>

              ${!isFest ? `
                <div class="flex items-center gap-2 flex-wrap mt-2.5">
                  ${item.prices ? `<span class="text-xs px-2.5 py-1 rounded-lg bg-pink-50 border border-pink-200 text-pink-700 font-medium">💰 票价：${item.prices}</span>` : ''}
                  ${item.seatUrl ? `<button type="button" data-src="${item.seatUrl}" data-cap="${safeTitle} · 场馆座位图" onclick="openLightbox(this.dataset.src, this.dataset.cap)" class="text-xs px-2.5 py-1 rounded-lg silver-btn text-blue-700 font-medium transition">💺 查看场馆座位图</button>` : ''}
                </div>
              ` : `
                <div class="mt-2.5">
                  ${buildSlotHoverBadgeHTML(item.slot, item.scheduleImgs, slotPopoverId, safeTitle)}
                  ${setlistHtml}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderArchiveTimeline() {
      const container = document.getElementById('archive-timeline-list');
      const sectionEl = container.closest('section');
      const currentArtistObj = artistsConfig.find(a => a.artistId === activeArtistId);
      const selectedYear = document.getElementById('archive-year-filter').value;

      const filtered = cloudArchives.filter(item => {
        if (activeArtistId !== 'ALL' && currentArtistObj) {
          if (!item.artist || item.artist.toLowerCase() !== currentArtistObj.artistName.toLowerCase()) return false;
        }
        if (activeArchiveType !== 'ALL' && item.subType !== activeArchiveType) return false;
        if (selectedYear !== 'ALL' && item.year !== selectedYear) return false;
        return true;
      });

      if (!filtered.length) {
        const hasAnyForArtist = activeArtistId === 'ALL' || cloudArchives.some(
          item => item.artist && currentArtistObj && item.artist.toLowerCase() === currentArtistObj.artistName.toLowerCase()
        );
        if (activeArtistId !== 'ALL' && !hasAnyForArtist) {
          sectionEl.classList.add('hidden');
        } else {
          sectionEl.classList.remove('hidden');
          container.innerHTML = `<div class="text-sm text-slate-400 py-4">暂无符合筛选条件的往日演出记录</div>`;
        }
        return;
      }
      sectionEl.classList.remove('hidden');

      const featured = filtered[0];
      const rest = filtered.slice(1);

      let html = buildArchiveVerticalCardHTML(featured);

      if (rest.length > 0) {
        html += `
          <div class="pt-1 space-y-3">
            <button type="button" onclick="toggleArchiveExpand()"
              class="w-full py-2.5 px-4 rounded-xl silver-btn text-xs font-semibold text-slate-700 flex items-center justify-center gap-2 transition shadow-2xs">
              <span>${isArchiveExpanded ? `🔼 收起其余 ${rest.length} 场往日演出` : `📂 展开其余 ${rest.length} 场往日演出回顾（竖行列表展示）▾`}</span>
            </button>
            ${isArchiveExpanded ? `
              <div class="space-y-3">
                ${rest.map(item => buildArchiveVerticalCardHTML(item)).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function toggleTransportDrawer(idx) {
      const el = document.getElementById(`transport-box-${idx}`);
      if (el) el.classList.toggle('hidden');
    }

    function renderTourCards() {
      const container = document.getElementById('tour-grid');
      const sectionEl = container.closest('section');
      const currentArtistObj = artistsConfig.find(a => a.artistId === activeArtistId);
      const filteredTours = tourSchedules.filter(t => {
        if (activeArtistId === 'ALL' || !currentArtistObj) return true;
        if (!t.artist) return false;
        return t.artist.toLowerCase() === currentArtistObj.artistName.toLowerCase();
      });

      if (!filteredTours.length) {
        if (activeArtistId !== 'ALL') {
          sectionEl.classList.add('hidden');
        } else {
          sectionEl.classList.remove('hidden');
          container.innerHTML = `<div class="text-sm text-slate-400">暂无近期演出日程（管理员可点击「🎫 手动新增演出 / 倒计时」添加）</div>`;
        }
        return;
      }
      sectionEl.classList.remove('hidden');

      container.innerHTML = filteredTours.map((item, idx) => {
        const matchedArtist = artistsConfig.find(a => a.artistName.toLowerCase() === (item.artist || '').toLowerCase());
        const artistBadgeBg = matchedArtist?.badgeStyle || COLOR_PEARL;
        const navKeyword = (item.venue && !item.venue.includes('待')) ? item.venue : item.city;
        const amapSearchUrl = `https://uri.amap.com/search?keyword=${encodeURIComponent(navKeyword)}`;
        const slotPopoverId = `cp-slot-pop-${item.cloudId || idx}`;
        const safeCity = String(item.city || '').replace(/['"<>]/g, '');
        const safeTheme = String(item.theme || '').replace(/['"<>]/g, '');

        const activeRounds = (item.rounds || []).filter(r => {
          const targetTs = new Date(r.sale_time.replace(/-/g, '/')).getTime();
          return isNaN(targetTs) || targetTs > Date.now();
        });

        const hasActiveSale = activeRounds.length > 0;
        const statusBadgeHtml = hasActiveSale
          ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-pink-50 text-pink-700 border border-pink-200 font-semibold">🔥 售票倒计时中</span>`
          : `<span class="text-[11px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-semibold">🎫 开票已结束 · 待开演</span>`;

        const roundsHtml = hasActiveSale
          ? activeRounds.map(r => {
              const isPrio = /优先|特权|会员/.test(r.round_name);
              const isPresale = /预售/.test(r.round_name);
              const badgeStyleClass = isPrio
                ? 'bg-purple-50 text-purple-800 border border-purple-200 font-medium'
                : isPresale
                  ? 'bg-sky-50 text-sky-800 border border-sky-200 font-medium'
                  : 'bg-pink-50 text-pink-800 border border-pink-200 font-medium';

              return `
                <div class="flex items-center justify-between gap-2 text-xs py-1.5 px-2.5 rounded-lg ${badgeStyleClass}">
                  <span class="truncate" title="${r.round_name}：${r.sale_time} (${r.platform})">
                    <strong>${r.round_name}</strong>：${r.sale_time} <span class="opacity-85">(${r.platform})</span>
                  </span>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="countdown-badge font-mono font-bold text-slate-900" data-time="${r.sale_time}"></span>
                    <button type="button" onclick="downloadICS('${safeCity}-${String(r.round_name || '').replace(/['"<>]/g, '')}', '${r.sale_time}', '${String(r.platform || '').replace(/['"<>]/g, '')}', '${item.source_url || ''}')" class="text-[11px] px-1.5 py-0.5 rounded bg-white border border-slate-200 text-slate-700 hover:bg-slate-100" title="加入手机/电脑日历">📅</button>
                  </div>
                </div>
              `;
            }).join('')
          : '';

        return `
          <div class="p-4 rounded-xl frost-card flex flex-col justify-between gap-3">
            <div class="flex gap-3.5">
              ${item.posterUrl ? `
                <img src="${item.posterUrl}" alt="${safeCity}" data-cap="${safeCity} · 演出海报" onclick="openLightbox(this.src, this.dataset.cap)"
                  class="w-20 h-28 object-cover rounded-lg border border-slate-200 cursor-zoom-in shrink-0 hover:opacity-90 transition shadow-2xs" />
              ` : ''}

              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2 flex-wrap">
                    ${item.artist ? `<span class="text-xs px-2 py-0.5 rounded text-white font-semibold shrink-0" style="background:${artistBadgeBg}">${item.artist}</span>` : ''}
                    <span class="font-bold text-base text-slate-900">${safeCity}</span>
                    ${statusBadgeHtml}
                  </div>
                  <div class="flex items-center gap-2 shrink-0 flex-wrap justify-end">
                    ${safeTheme ? `<button type="button" data-theme="${safeTheme}" onclick="openThemeDetailModal(this.dataset.theme)" class="text-xs text-purple-700 hover:underline font-medium">专题页 ↗</button>` : ''}
                    ${item.source_url && item.source_url !== '#' ? `<a href="${item.source_url}" target="_blank" class="text-xs text-slate-500 hover:text-blue-600">原帖 ↗</a>` : ''}
                    ${(isAdmin && item.cloudId) ? `<button type="button" onclick="editExistingTicket(${item.cloudId})" class="text-xs text-blue-600 hover:underline font-medium">✏️ 编辑</button>` : ''}
                    ${(isAdmin && item.cloudId) ? `<button type="button" onclick="archiveExistingTicket(${item.cloudId})" class="text-xs text-purple-700 hover:underline" title="归档至往日演出">归档</button>` : ''}
                    ${(isAdmin && item.cloudId) ? `<button type="button" onclick="deleteCloudRecord('tickets', ${item.cloudId})" class="text-xs text-rose-600 hover:underline">删除</button>` : ''}
                  </div>
                </div>

                <p class="text-xs text-slate-500 mt-1.5">
                  📍 ${item.venue} ｜ 🗓️ ${item.show_date} ${item.startTime ? `｜ ⏰ ${item.startTime}` : ''}
                </p>

                <div class="flex items-center justify-between gap-2 mt-2 flex-wrap">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    ${item.prices ? `<span class="text-[11px] px-2 py-0.5 rounded-md bg-pink-50 border border-pink-200 text-pink-700 font-medium">💰 ${item.prices}</span>` : ''}
                    ${item.seatUrl ? `<button type="button" data-src="${item.seatUrl}" data-cap="${safeCity} · 场馆座位图" onclick="openLightbox(this.dataset.src, this.dataset.cap)" class="text-[11px] px-2 py-0.5 rounded-md silver-btn text-blue-700 font-medium transition">💺 座位图</button>` : ''}
                    ${buildSlotHoverBadgeHTML(item.slot, item.scheduleImgs, slotPopoverId, safeCity)}
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" onclick="toggleTransportDrawer(${idx})" class="text-[11px] px-2 py-0.5 rounded-md silver-btn text-blue-700 font-medium transition">
                      🚇 交通攻略 ▾
                    </button>
                    <a href="${amapSearchUrl}" target="_blank" class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200 text-slate-700 hover:bg-slate-200 transition">
                      导航 ↗
                    </a>
                  </div>
                </div>

                <div id="transport-box-${idx}" class="hidden mt-2.5 p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-700 space-y-1 leading-relaxed whitespace-pre-line">
                  <div class="font-semibold text-blue-700 mb-1">🚇 交通枢纽 → ${item.venue}：</div>
                  ${item.transport || '该场地暂未录入预设路线，可点击右侧「导航 ↗」一键使用高德地图规划路线。'}
                </div>
              </div>
            </div>

            ${roundsHtml ? `<div class="space-y-1.5">${roundsHtml}</div>` : ''}
          </div>
        `;
      }).join('');
      updateCountdowns();
    }

    function updateCountdowns() {
      const now = Date.now();
      let needReRender = false;
      document.querySelectorAll('.countdown-badge').forEach(el => {
        const raw = el.getAttribute('data-time');
        const target = new Date(raw.replace(/-/g, '/')).getTime();
        if (isNaN(target)) return;
        const diff = target - now;
        if (diff <= 0) {
          needReRender = true;
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `剩 ${d}天${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      });
      if (needReRender) renderTourCards();
    }

    async function loadAllFeeds(force = false) {
      document.getElementById('timeline-list').innerHTML = `<div class="text-center py-10 text-sm text-slate-400">正在同步最新聚合动态...</div>`;
      let serverPosts = [];

      cloudFeeds = [];
      try {
        const sbRes = await fetch(`${SUPABASE_URL}/rest/v1/feeds?select=*&order=created_at.desc&limit=80`, { headers: SB_HEADERS });
        if (sbRes.ok) {
          const rows = await sbRes.json();
          cloudFeeds = rows.map(r => {
            const meta = ARTIST_META_MAP[r.artist] || { artistId: 'oner', color: COLOR_ONER };
            const matchedArtistObj = artistsConfig.find(a => a.artistName === r.artist);
            const matchedAcc = matchedArtistObj?.accounts.find(acc => acc.name === r.platform);
            const rawContent = r.content || '';
            const pubMatch = rawContent.match(/\[PUB:(\d+)\]/);
            const strippedBody = rawContent
              .replace(/\n?\[IMG:https?:\/\/[^\]]+\]/g, '')
              .replace(/\n?\[PUB:\d+\]/g, '')
              .trim();
            const cleanBody = cleanSocialPostText(strippedBody);
            const realTimestamp = pubMatch ? Number(pubMatch[1]) : new Date(r.created_at).getTime();

            return {
              cloudId: r.id,
              artistId: matchedArtistObj?.artistId || meta.artistId,
              artistName: r.artist,
              accountId: matchedAcc?.id || `${meta.artistId}_cloud`,
              platformName: r.platform,
              platformColor: matchedArtistObj?.badgeStyle || meta.color,
              text: cleanBody,
              link: r.url || '#',
              timestamp: realTimestamp
            };
          });
          serverPosts.push(...cloudFeeds);
          document.getElementById('last-sync').textContent = '云端已同步 · ' + new Date().toLocaleTimeString();
        }
      } catch (e) {}

      try {
        const res = await fetch('./feeds_data.json?t=' + Date.now());
        if (res.ok) {
          const payload = await res.json();
          if (Array.isArray(payload.posts)) {
            const cleanedStatic = payload.posts.map(p => ({
              ...p,
              text: cleanSocialPostText(p.text || '')
            }));
            serverPosts.push(...cleanedStatic);
          }
        }
      } catch (e) {}

      allPosts = serverPosts;
      allPosts.sort((a, b) => b.timestamp - a.timestamp);
      initUI();
    }

    function initUI() {
      const artistOptions = [{ id: 'ALL', name: '全部艺人', badgeStyle: COLOR_PEARL }, ...artistsConfig.map(a => ({
        id: a.artistId,
        name: a.artistName,
        badgeStyle: a.badgeStyle || a.accounts[0]?.color || COLOR_PEARL
      }))];

      const currentObj = artistOptions.find(a => a.id === activeArtistId) || artistOptions[0];
      const menuBtn = document.getElementById('artist-menu-btn');
      document.getElementById('current-artist-label').textContent = currentObj.name;
      menuBtn.style.background = currentObj.badgeStyle;

      document.getElementById('artist-dropdown-menu').innerHTML = artistOptions.map(t => {
        const isActive = activeArtistId === t.id;
        return `
          <button type="button" onclick="selectArtist('${t.id}')"
            class="w-full px-3.5 py-2 text-left text-xs flex items-center justify-between hover:bg-slate-100 transition ${isActive ? 'font-bold text-purple-700' : 'text-slate-700'}">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${t.badgeStyle}"></span>
              <span>${t.name}</span>
            </span>
            ${isActive ? '<span>✓</span>' : ''}
          </button>
        `;
      }).join('');

      const artistPosts = activeArtistId === 'ALL' ? allPosts : allPosts.filter(p => p.artistId === activeArtistId);

      const spotlightEl = document.getElementById('latest-spotlight');
      if (artistPosts.length > 0) {
        const top = artistPosts[0];
        spotlightEl.classList.remove('hidden');
        document.getElementById('spotlight-artist').textContent = top.artistName;
        document.getElementById('spotlight-platform').textContent = top.platformName;
        document.getElementById('spotlight-time').textContent = formatTimeAgo(top.timestamp);
        document.getElementById('spotlight-text').textContent = top.text;
        document.getElementById('spotlight-link').href = top.link;
      } else {
        spotlightEl.classList.add('hidden');
      }

      const platformMap = new Map();
      artistPosts.forEach(p => {
        const key = `${p.artistName}·${p.platformName}`;
        const label = activeArtistId === 'ALL' ? key : p.platformName;
        if (!platformMap.has(label)) {
          platformMap.set(label, { label, color: p.platformColor, count: 0 });
        }
        platformMap.get(label).count++;
      });

      const platformTabs = [{ id: 'ALL', label: `全部 (${artistPosts.length})`, color: COLOR_PEARL }, ...[...platformMap.values()].map(item => ({
        id: item.label,
        label: `${item.label} (${item.count})`,
        color: item.color
      }))];

      document.getElementById('platform-tabs').innerHTML = platformTabs.map(t => {
        const isActive = activeAccountId === t.id;
        return `
          <button type="button" onclick="selectAccount('${t.id}')"
            style="${isActive ? `background:${t.color}` : ''}"
            class="px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition border ${isActive ? 'text-white border-transparent shadow-xs' : 'bg-white text-slate-600 border-slate-300 hover:border-slate-400'}">
            ${t.label}
          </button>
        `;
      }).join('');

      renderTourCards();
      renderArchiveTimeline();
      renderTimeline();
    }

    function selectArtist(id) {
      activeArtistId = id;
      activeAccountId = 'ALL';
      isArchiveExpanded = false;
      document.getElementById('artist-dropdown-menu').classList.add('hidden');
      initUI();
    }

    function selectAccount(id) {
      activeAccountId = id;
      initUI();
    }

    function clearDate() {
      document.getElementById('date-start-filter').value = '';
      document.getElementById('date-end-filter').value = '';
      renderTimeline();
    }

    function renderTimeline() {
      const startDateVal = document.getElementById('date-start-filter').value;
      const endDateVal = document.getElementById('date-end-filter').value;
      const kw = document.getElementById('keyword-filter').value.trim().toLowerCase();

      const startTs = startDateVal ? new Date(`${startDateVal}T00:00:00`).getTime() : null;
      const endTs = endDateVal ? new Date(`${endDateVal}T23:59:59`).getTime() : null;

      const filtered = allPosts.filter(p => {
        if (activeArtistId !== 'ALL' && p.artistId !== activeArtistId) return false;
        if (activeAccountId !== 'ALL') {
          const pLabel = activeArtistId === 'ALL' ? `${p.artistName}·${p.platformName}` : p.platformName;
          if (pLabel !== activeAccountId) return false;
        }
        if (startTs && p.timestamp < startTs) return false;
        if (endTs && p.timestamp > endTs) return false;
        if (kw && !p.text.toLowerCase().includes(kw)) return false;
        return true;
      });

      const listEl = document.getElementById('timeline-list');
      if (!filtered.length) {
        listEl.innerHTML = `<div class="text-center py-10 text-sm text-slate-400">暂无符合筛选条件的动态记录</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(p => {
        const dateStr = new Date(p.timestamp).toLocaleString('zh-CN', { hour12: false });
        return `
          <article class="p-3.5 sm:p-4 rounded-xl frost-card space-y-2">
            <div class="flex items-center justify-between text-xs gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-white font-semibold shadow-2xs" style="background:${p.platformColor}">
                  ${p.artistName} · ${p.platformName}
                </span>
                <span class="text-slate-400">${formatTimeAgo(p.timestamp)} · ${dateStr}</span>
              </div>
              <div class="flex items-center gap-2.5 shrink-0">
                ${p.link && p.link !== '#' ? `<a href="${p.link}" target="_blank" class="text-slate-500 hover:text-blue-600">原帖 ↗</a>` : ''}
                ${(isAdmin && p.cloudId) ? `<button type="button" onclick="deleteCloudRecord('feeds', ${p.cloudId})" class="text-rose-600 hover:underline">删除</button>` : ''}
              </div>
            </div>
            <p class="text-sm leading-relaxed text-slate-700 line-clamp-1-clean cursor-pointer" title="点击展开/收起全文" onclick="this.classList.toggle('line-clamp-1-clean')">${p.text}</p>
          </article>
        `;
      }).join('');
    }

    function formatTimeAgo(ts) {
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 0) return '即将发布';
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
      return Math.floor(diff / 86400) + ' 天前';
    }

    syncAdminUI();
    loadTourData();
    loadAllFeeds();
    setInterval(updateCountdowns, 1000);
    setInterval(() => { loadTourData(); loadAllFeeds(); }, 60000);
  </script>
</body>
</html>
