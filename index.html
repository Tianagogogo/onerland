<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONER & 坤音娱乐 动态与巡演中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    .line-clamp-4 {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen">

  <!-- ================= 顶部精简导航栏（含“艺人 ▾”二级下拉菜单） ================= -->
  <header class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <h1 class="font-bold text-base sm:text-lg tracking-tight">ONER & 坤音</h1>
        </div>

        <!-- 紧凑型“艺人”二级下拉菜单按钮 -->
        <div class="relative" id="artist-dropdown-wrap">
          <button type="button" onclick="toggleArtistMenu(event)" id="artist-menu-btn"
            class="px-3 py-1.5 rounded-full text-xs font-semibold text-white bg-indigo-600 shadow-xs flex items-center gap-1.5 transition hover:opacity-90">
            <span>🎤 艺人：<span id="current-artist-label">全部艺人</span></span>
            <span class="text-[10px]">▾</span>
          </button>
          <div id="artist-dropdown-menu" class="hidden absolute left-0 mt-2 w-44 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl py-1.5 z-40"></div>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <span id="last-sync" class="text-slate-400 hidden lg:inline">准备就绪</span>
        <button id="admin-unlock-btn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition font-medium">
          🔒 管理
        </button>
        <button onclick="openManageModal()" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition font-medium hidden sm:inline-block">
          ⚙️ 订阅源
        </button>
        <button onclick="loadAllFeeds(true)" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white dark:bg-indigo-600 hover:opacity-90 transition font-medium">
          刷新同步
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">

    <!-- ================= 管理员专属：快捷投喂与多场次识别台 ================= -->
    <section id="admin-publisher-panel" class="hidden p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900 border-2 border-indigo-500/40 shadow-lg space-y-3">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <span class="text-sm font-bold text-indigo-600 dark:text-indigo-400">✨ 管理员云端投喂台（多设备实时同步）</span>
        <div class="flex items-center gap-3 text-xs">
          <button type="button" onclick="configGeminiKey()" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">
            🔑 配置 AI 识图密钥 (<span id="ai-key-status">未配置</span>)
          </button>
          <button onclick="lockAdminMode()" class="text-slate-400 hover:text-rose-500">退出管理</button>
        </div>
      </div>

      <textarea id="raw-post-input" rows="2" placeholder="粘贴微博 / 小红书 / 抖音分享口令或官宣文案；或直接点击下方按钮手动新增倒计时 / 上传多场次排期海报图..."
        class="w-full text-xs sm:text-sm p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:border-indigo-500"></textarea>

      <div class="flex items-center gap-2 flex-wrap">
        <button id="smart-parse-btn" onclick="smartParsePost()" class="px-3.5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition">
          🪄 智能识别文案
        </button>
        <button type="button" onclick="openTicketFormDirectly()" class="px-3.5 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold transition">
          🎫 手动新增开票倒计时
        </button>
        <button type="button" onclick="openArchiveFormDirectly()" class="px-3.5 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold transition">
          🏛️ 录入往日演出 / 识别排期表海报
        </button>
        <button onclick="document.getElementById('raw-post-input').value=''; document.getElementById('parse-confirm-box').classList.add('hidden');" class="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs">
          清空
        </button>
      </div>

      <!-- 识别后确认/微调表单 -->
      <div id="parse-confirm-box" class="hidden pt-3 border-t border-dashed border-slate-200 dark:border-slate-800 space-y-3">
        <div class="flex items-center gap-4 text-xs flex-wrap">
          <span class="text-slate-400">同步至板块：</span>
          <label class="flex items-center gap-1 cursor-pointer font-medium">
            <input type="radio" name="cloudEntryType" value="feed" checked onchange="toggleCloudFields()" /> 📱 全平台动态时间线
          </label>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-amber-600 dark:text-amber-400">
            <input type="radio" name="cloudEntryType" value="ticket" onchange="toggleCloudFields()" /> 🎫 近期演出与开票倒计时
          </label>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-purple-600 dark:text-purple-400">
            <input type="radio" name="cloudEntryType" value="archive" onchange="toggleCloudFields()" /> 🏛️ 往日演出档案（支持多场表格图批量识别）
          </label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="text-slate-400 block mb-1">关联艺人</label>
            <select id="cp-artist" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950">
              <option value="ONER">ONER</option>
              <option value="坤音娱乐">坤音娱乐</option>
              <option value="岳岳">岳岳</option>
              <option value="木子洋">木子洋</option>
              <option value="灵超">灵超</option>
            </select>
          </div>
          <div id="cp-feed-platform-wrap">
            <label class="text-slate-400 block mb-1">来源平台（如：微博 / 小红书 / 抖音）</label>
            <input id="cp-platform" type="text" placeholder="微博" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950" />
          </div>
          <div id="cp-ticket-url-top" class="hidden">
            <label class="text-slate-400 block mb-1">官宣原帖 / 购票链接</label>
            <input id="cp-url-ticket" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950" />
          </div>

          <!-- ================= 往日演出档案表单 ================= -->
          <div id="cp-archive-fields" class="hidden sm:col-span-2 space-y-3 p-3.5 rounded-xl bg-purple-500/5 border border-purple-500/20">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-3">
                <span class="font-bold text-purple-700 dark:text-purple-300">演出类型：</span>
                <label class="flex items-center gap-1 cursor-pointer font-medium">
                  <input type="radio" name="archiveSubType" value="tour" checked onchange="toggleArchiveSubFields()" /> 🏟️ 巡演 / Livehouse（含票价与座位图）
                </label>
                <label class="flex items-center gap-1 cursor-pointer font-medium">
                  <input type="radio" name="archiveSubType" value="festival" onchange="toggleArchiveSubFields()" /> 🎪 音乐节（含演出时段与歌单）
                </label>
              </div>
            </div>

            <div class="p-3 rounded-lg bg-white dark:bg-slate-950 border border-purple-500/20 space-y-2.5">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <label class="font-semibold text-purple-700 dark:text-purple-300">🖼️ 上传官宣海报或「多场次排期表格图片」</label>
                <div class="flex items-center gap-2 flex-wrap">
                  <label class="cursor-pointer px-3 py-1 rounded-lg bg-purple-600 hover:bg-purple-700 text-white font-medium transition">
                    选择本地图片
                    <input type="file" id="arc-poster-file" accept="image/*" class="hidden" onchange="handlePosterUpload(event)" />
                  </label>
                  <button type="button" id="arc-ocr-btn" onclick="runSmartPosterRecognition()" class="px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition">
                    🔍 智能识别图片（支持多场表格拆分）
                  </button>
                </div>
              </div>
              <input id="arc-poster-url" type="text" placeholder="或粘贴海报图片链接 https://..." class="w-full px-2.5 py-1.5 rounded border border-slate-200 dark:border-slate-700 bg-transparent text-xs" />
              <div id="arc-ocr-status" class="hidden text-[11px] text-indigo-600 dark:text-indigo-400"></div>
              <img id="arc-poster-preview" class="hidden max-h-40 rounded-lg border border-slate-200 dark:border-slate-800 object-contain" />

              <div id="multi-show-batch-box" class="hidden pt-2 border-t border-indigo-500/20 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <span class="font-bold text-indigo-600 dark:text-indigo-400">📋 识别到图片中的多场演出排期（可勾选并微调后一键批量导入）：</span>
                  <div class="flex items-center gap-2">
                    <select id="batch-target-section" class="px-2 py-1 rounded border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-[11px]">
                      <option value="archive">导入至：🏛️ 往日演出档案</option>
                      <option value="ticket">导入至：🎫 近期演出与开票倒计时</option>
                    </select>
                    <button type="button" onclick="batchImportRecognizedShows()" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold transition">
                      ✅ 批量导入已勾选场次
                    </button>
                  </div>
                </div>
                <div id="multi-show-list" class="space-y-1.5 max-h-64 overflow-y-auto"></div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-slate-500 block mb-1">巡演/音乐节主题名称（用于同主题专题聚合）</label>
                <input id="arc-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
              <div>
                <label class="text-slate-500 block mb-1">具体站次 / 场次标题（必填）</label>
                <input id="arc-title" type="text" placeholder="如：合肥站 / 北京站 / XX音乐节" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
              <div>
                <label class="text-slate-500 block mb-1">演出日期（必填，用于时间线排序）</label>
                <input id="arc-date" type="date" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
              <div>
                <label class="text-slate-500 block mb-1">城市与场馆 / Livehouse / 场地</label>
                <input id="arc-venue" type="text" placeholder="如：北京 · 疆进酒·OMNI SPACE" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>

              <div id="arc-tour-only" class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="text-amber-700 dark:text-amber-300 font-medium block mb-1">💰 票价档位</label>
                  <input id="arc-prices" type="text" placeholder="如：预售 280 / 全价 380 / VIP 580" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
                </div>
                <div>
                  <label class="text-sky-700 dark:text-sky-300 font-medium block mb-1">💺 场馆座位图（Livehouse 无座位可留空）</label>
                  <div class="flex gap-1.5">
                    <input id="arc-seat-url" type="text" placeholder="https://... 或点右侧上传" class="flex-1 px-2.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
                    <label class="cursor-pointer px-2.5 py-2 rounded-lg bg-sky-500/15 text-sky-700 dark:text-sky-300 hover:bg-sky-500/25 shrink-0 font-medium">
                      上传图
                      <input type="file" accept="image/*" class="hidden" onchange="handleSeatMapUpload(event)" />
                    </label>
                  </div>
                </div>
              </div>

              <div id="arc-fest-only" class="hidden sm:col-span-2 space-y-3">
                <div>
                  <label class="text-purple-700 dark:text-purple-300 font-medium block mb-1">⏰ 演出时间段</label>
                  <input id="arc-slot" type="text" placeholder="如：16:20 - 17:00（主舞台）" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
                </div>
                <div>
                  <label class="text-emerald-700 dark:text-emerald-300 font-medium block mb-1">🎤 现场演唱歌单 Setlist（每行一首）</label>
                  <textarea id="arc-setlist" rows="4" placeholder="1. 过敏&#10;2. 镜中人&#10;3. 凶手" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 leading-relaxed"></textarea>
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="text-slate-500 block mb-1">官宣原帖 / 回顾链接（选填）</label>
                <input id="arc-url" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
            </div>
          </div>

          <!-- ================= 近期演出与开票倒计时表单（含海报 / 票价 / 座位图） ================= -->
          <div id="cp-tour-fields" class="hidden sm:col-span-2 space-y-3 p-3.5 rounded-xl bg-amber-500/5 border border-amber-500/20">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-amber-700 dark:text-amber-300 font-medium block mb-1">巡演/音乐节主题名称（同主题可聚合专题页）</label>
                <input id="cp-tour-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
              <div>
                <label class="text-amber-700 dark:text-amber-300 font-medium block mb-1">城市站次 / 场次名（必填）</label>
                <input id="cp-tour-title" type="text" placeholder="如：合肥站 / 上海站" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
              <div>
                <label class="text-slate-500 block mb-1">演出场馆 / Livehouse / 场地</label>
                <div class="flex gap-1.5">
                  <input id="cp-tour-venue" type="text" placeholder="如：MAO Livehouse / 合肥少荃体育馆" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
                  <button type="button" onclick="autoFillVenueTransport()" class="px-2.5 py-1.5 rounded-lg bg-sky-500/15 text-sky-700 dark:text-sky-300 hover:bg-sky-500/25 shrink-0 font-medium">
                    🚇 匹配路线
                  </button>
                </div>
              </div>
              <div>
                <label class="text-slate-500 block mb-1">演出日期</label>
                <input id="cp-tour-showdate" type="text" placeholder="如：2026-12-26 (周六)" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
              <div>
                <label class="text-amber-700 dark:text-amber-300 font-medium block mb-1">💰 巡演票价档位</label>
                <input id="cp-tour-prices" type="text" placeholder="如：380 / 580 / 780 / 1080" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
              <div>
                <label class="text-purple-700 dark:text-purple-300 font-medium block mb-1">🎤 预计演出时段备注（音乐节适用，可留空）</label>
                <input id="cp-tour-slot" type="text" placeholder="如：16:20-17:00 预计登台" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
              </div>
              <div>
                <label class="text-purple-700 dark:text-purple-300 font-medium block mb-1">🖼️ 演出海报（链接或上传本地图）</label>
                <div class="flex gap-1.5">
                  <input id="cp-tour-poster" type="text" placeholder="https://... 或点右侧上传" class="flex-1 px-2.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
                  <label class="cursor-pointer px-2.5 py-2 rounded-lg bg-purple-600 text-white hover:bg-purple-700 shrink-0 font-medium">
                    上传图
                    <input type="file" accept="image/*" class="hidden" onchange="handleUpcomingPosterUpload(event)" />
                  </label>
                </div>
              </div>
              <div>
                <label class="text-sky-700 dark:text-sky-300 font-medium block mb-1">💺 场馆座位图（链接或上传本地图）</label>
                <div class="flex gap-1.5">
                  <input id="cp-tour-seat" type="text" placeholder="https://... 或点右侧上传" class="flex-1 px-2.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950" />
                  <label class="cursor-pointer px-2.5 py-2 rounded-lg bg-sky-500/15 text-sky-700 dark:text-sky-300 hover:bg-sky-500/25 shrink-0 font-medium">
                    上传图
                    <input type="file" accept="image/*" class="hidden" onchange="handleUpcomingSeatUpload(event)" />
                  </label>
                </div>
              </div>
            </div>

            <div class="pt-2 border-t border-amber-500/15 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-amber-700 dark:text-amber-300 font-semibold">🎫 开票轮次设置（支持优先购、正式开票、二开等多轮倒计时）</span>
                <button type="button" onclick="addTicketRoundRow()" class="px-2.5 py-1 rounded-lg bg-amber-500/15 text-amber-700 dark:text-amber-300 hover:bg-amber-500/25 font-medium transition">
                  + 添加一轮开票
                </button>
              </div>
              <div id="ticket-rounds-container" class="space-y-2"></div>
            </div>

            <div class="pt-2 border-t border-amber-500/15 space-y-1.5">
              <div class="flex items-center justify-between">
                <label class="text-sky-700 dark:text-sky-300 font-semibold">🚇 交通枢纽到场馆具体时间与路线</label>
                <span class="text-[11px] text-slate-400">可自由修改</span>
              </div>
              <textarea id="cp-tour-transport" rows="3" placeholder="系统将自动匹配常用场馆与Livehouse路线，也可手动补充..."
                class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 leading-relaxed"></textarea>
            </div>
          </div>

          <!-- 动态正文输入框 -->
          <div id="cp-feed-fields" class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="sm:col-span-2">
              <label class="text-slate-400 block mb-1">完整博文正文（支持多行）</label>
              <textarea id="cp-content" rows="4" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 leading-relaxed"></textarea>
            </div>
            <div>
              <label class="text-indigo-600 dark:text-indigo-400 font-semibold block mb-1">原帖实际发布时间（可修改）</label>
              <input id="cp-time" type="datetime-local" class="w-full px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950" />
            </div>
            <div>
              <label class="text-slate-400 block mb-1">直达原帖链接</label>
              <input id="cp-url" type="text" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950" />
            </div>
            <div class="sm:col-span-2">
              <label class="text-slate-400 block mb-1">配图链接（可留空或手动粘贴图片网址）</label>
              <input id="cp-img" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950" />
            </div>
          </div>

    function extractVenueFromText(text) {
      const labelMatch = text.match(/(?:演出地点|演出场馆|活动地点|举办地点|场馆|场地|地址|地点|📍)\s*[：:]?\s*([^\n\r！!。⏰🗓️]+)/);
      if (labelMatch && labelMatch[1].trim().length >= 2) {
        return labelMatch[1].trim();
      }
      const venueRegex = /([\u4e00-\u9fa5A-Za-z0-9·\-\s]{2,28}(?:Live\s*House|LIVE\s*HOUSE|livehouse|OMNI\s*SPACE|HOU\s*LIVE|万代南梦宫|疆进酒|育音堂|声音共和|太空间|纽空间|正火艺术中心|稻香音乐空间|达丰空间|红节奏|不晚|体育中心体育馆|体育中心|体育馆|体育场|演艺中心|文化中心|大剧院|艺术中心|展览中心|会展中心|ECM中心|音乐广场|草坪|公园|营地|度假区|博览园|赛车场|沙滩|生态岛|嬉戏谷))/i;
      const m = text.match(venueRegex);
      return m ? m[1].trim() : '';
    }

    function compressImageToDataURL(file, maxWidth = 960, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function preprocessImageForLocalOCR(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const scale = img.width < 1200 ? 2 : 1.3;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.filter = 'grayscale(100%) contrast(165%) brightness(105%)';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function parseMultiShowsFromPlainText(rawText) {
      const currentYear = new Date().getFullYear();
      const themeMatch = rawText.match(/[「《]([^」》]+)[」》]\s*(巡回演唱会|演唱会|巡演|音乐节|嘉年华)?/);
      const defaultTheme = themeMatch ? `「${themeMatch[1]}」${themeMatch[2] || '巡回演唱会'}` : '';

      let artist = 'ONER';
      if (rawText.includes('岳岳') || rawText.includes('PINKRAY')) artist = '岳岳';
      else if (rawText.includes('木子洋') || rawText.includes('KWIN')) artist = '木子洋';
      else if (rawText.includes('灵超') || rawText.includes('DIDI')) artist = '灵超';
      else if (rawText.includes('坤音')) artist = '坤音娱乐';

      const lines = rawText.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const multiRows = [];

      lines.forEach(line => {
        const dMatch = line.match(/(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?/);
        const cMatch = line.match(/(北京|上海|广州|深圳|杭州|南京|合肥|西安|成都|重庆|武汉|长沙|苏州|天津|郑州|青岛|厦门|福州|宁波|昆明|沈阳|大连|哈尔滨|济南|太原|石家庄|南昌|贵阳|南宁|海口|三亚|珠海|佛山|东莞|无锡|常州|温州|兰州|乌鲁木齐|呼和浩特|[\u4e00-\u9fa5]{2,4}站)/);
        if (dMatch && cMatch) {
          const y = dMatch[1] || currentYear;
          const mo = dMatch[2].padStart(2, '0');
          const da = dMatch[3].padStart(2, '0');
          const venue = extractVenueFromText(line);
          const cityLabel = cMatch[1].endsWith('站') ? cMatch[1] : `${cMatch[1]}站`;
          multiRows.push({
            artist,
            theme: defaultTheme,
            city_or_title: cityLabel,
            date: `${y}-${mo}-${da}`,
            venue,
            prices: '',
            slot: '',
            type: /音乐节|嘉年华/.test(line + rawText) ? 'festival' : 'tour'
          });
        }
      });

      if (multiRows.length >= 2) return multiRows;

      const singleDateMatch = rawText.match(/(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?/);
      const singleDate = singleDateMatch
        ? `${singleDateMatch[1] || currentYear}-${singleDateMatch[2].padStart(2, '0')}-${singleDateMatch[3].padStart(2, '0')}`
        : '';
      const cityMatch = rawText.match(/[「【\[]?([\u4e00-\u9fa5]{2,5}站)[」】\]]?/);
      const venue = extractVenueFromText(rawText);

      const priceNums = [...rawText.matchAll(/(?:￥|RMB|¥)?\s*(\d{3,4})\s*(?:元)?/g)]
        .map(m => Number(m[1]))
        .filter(n => n >= 180 && n <= 2980 && n !== 2024 && n !== 2025 && n !== 2026);
      const uniquePrices = [...new Set(priceNums)].sort((a, b) => a - b);

      const slotMatch = rawText.match(/\b(\d{1,2}:\d{2}\s*[-~—至]\s*\d{1,2}:\d{2})\b/);

      return [{
        artist,
        theme: defaultTheme,
        city_or_title: cityMatch ? cityMatch[1] : (defaultTheme || ''),
        date: singleDate,
        venue,
        prices: uniquePrices.length ? uniquePrices.map(p => `¥${p}`).join(' / ') : '',
        slot: slotMatch ? slotMatch[1] : '',
        type: /音乐节|嘉年华/.test(rawText) ? 'festival' : 'tour'
      }];
    }

    async function runSmartPosterRecognition() {
      const imgSrc = document.getElementById('arc-poster-url').value.trim();
      if (!imgSrc) return alert('请先上传官宣海报或排期表格图片！');

      const btn = document.getElementById('arc-ocr-btn');
      const statusEl = document.getElementById('arc-ocr-status');
      btn.disabled = true;
      btn.textContent = '⏳ 识别中...';
      statusEl.classList.remove('hidden');

      const geminiApiKey = localStorage.getItem(GEMINI_KEY_STORAGE);

      try {
        if (geminiApiKey && imgSrc.startsWith('data:image/')) {
          statusEl.textContent = '🤖 正在使用 Gemini AI 视觉引擎分析海报与表格排期...';
          const base64Data = imgSrc.split(',')[1];
          const mimeType = imgSrc.split(';')[0].split(':')[1] || 'image/jpeg';

          const promptText = `请仔细识别这张演出/巡演/音乐节海报或排期表格图片中的所有场次信息。
如果图片是一张包含多场巡演排期的表格，请把每一场演出拆分为数组中的独立对象；如果只是单场海报，则返回包含1个对象的数组。
严格仅返回纯 JSON 数组（不要加 markdown 代码块标记），字段格式如下：
[
  {
    "artist": "艺人或组合名（如 ONER / 岳岳 / 木子洋 / 灵超 / 坤音娱乐）",
    "theme": "巡演或音乐节主标题（如 「极尽声色」巡回演唱会）",
    "city_or_title": "城市站次或具体场次名（如 合肥站 / 北京站）",
    "date": "演出日期 YYYY-MM-DD（若未写年份默认 2026）",
    "venue": "具体场馆或Livehouse名称（如 疆进酒·OMNI SPACE / 合肥少荃体育中心体育馆）",
    "prices": "票价档位（如 ¥380 / ¥580 / ¥780）",
    "sale_time": "开票时间 YYYY-MM-DD HH:mm（若有）",
    "platform": "购票平台（如 大麦 | 猫眼）",
    "slot": "音乐节演出时段（如 16:20-17:00，若有）",
    "type": "tour 或 festival"
  }
]`;

          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiApiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: mimeType, data: base64Data } }
                ]
              }]
            })
          });

          if (!resp.ok) throw new Error(`AI 接口返回 HTTP ${resp.status}`);
          const json = await resp.json();
          const rawOut = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const cleanedJsonStr = rawOut.replace(/```json|```/gi, '').trim();
          const parsedShows = JSON.parse(cleanedJsonStr);

          renderRecognizedShowsBatch(parsedShows);
          statusEl.textContent = `✅ AI 视觉识别成功！共提取到 ${parsedShows.length} 场演出信息，请核对后保存或批量导入。`;
          return;
        }

        statusEl.textContent = '🔍 正在增强图片对比度并运行本地中文 OCR...';
        const enhancedImg = imgSrc.startsWith('data:image/') ? await preprocessImageForLocalOCR(imgSrc) : imgSrc;
        const result = await Tesseract.recognize(enhancedImg, 'chi_sim+eng');
        const ocrText = (result.data?.text || '').trim();
        if (!ocrText) {
          statusEl.textContent = '⚠️ 未能识别到清晰文字，建议配置顶部「🔑 AI 识图密钥」或手动填写。';
          return;
        }
        const shows = parseMultiShowsFromPlainText(ocrText);
        renderRecognizedShowsBatch(shows);
        statusEl.textContent = `✅ 本地 OCR 识别完成，共提取到 ${shows.length} 场信息，请核对微调后保存。`;
      } catch (e) {
        statusEl.textContent = `❌ 识别出错：${e.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = '🔍 智能识别图片（支持多场表格拆分）';

    function parseDateFromSnippet(snippet, currentYear) {
      const dateRegex = /(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:[（(]?(?:周[一二三四五六日天]|星期[一二三四五六日天])[）)]?)?\s*(?:上午|中午|下午|晚上)?\s*(\d{1,2})[:：点时](\d{1,2})?/;
      const m = snippet.match(dateRegex);
      if (!m) return '';
      const year = m[1] || currentYear;
      const month = m[2].padStart(2, '0');
      const day = m[3].padStart(2, '0');
      let hour = parseInt(m[4], 10);
      if ((snippet.includes('下午') || snippet.includes('晚上')) && hour < 12) hour += 12;
      const minute = (m[5] || '00').padStart(2, '0');
      return `${year}-${month}-${day}T${String(hour).padStart(2, '0')}:${minute}`;
    }

    function smartParsePost() {
      const text = document.getElementById('raw-post-input').value.trim();
      if (!text) return alert('请先粘贴分享链接或动态文案！');

      const urlMatch = text.match(/https?:\/\/[^\s\u4e00-\u9fa5]+/);
      const url = urlMatch ? urlMatch[0] : '';

      let artist = 'ONER';
      if (text.includes('岳岳') || text.includes('PINKRAY')) artist = '岳岳';
      else if (text.includes('木子洋') || text.includes('KWIN')) artist = '木子洋';
      else if (text.includes('灵超') || text.includes('DIDI')) artist = '灵超';
      else if (text.includes('坤音')) artist = '坤音娱乐';

      const isTicket = /开票|预售|抢票|巡演|演唱会|音乐节|嘉年华|Livehouse|Live House|大麦|秀动|售票时间|购票平台|优先购|特权购/i.test(text);
      document.getElementsByName('cloudEntryType').forEach(r => r.checked = (r.value === (isTicket ? 'ticket' : 'feed')));

      let defaultPlatform = '微博';
      if (isTicket) {
        const platMatch = text.match(/(?:购票平台|售票平台|票务平台)[：:]\s*([^\n\r⏰📍🗓️]+)/);
        if (platMatch) {
          defaultPlatform = platMatch[1].trim();
        } else {
          const foundPlats = ['大麦', '坤音商城小程序', '坤音商城', '猫眼', '携程', '票星球', '秀动', '纷玩岛'].filter(p => text.includes(p));
          if (foundPlats.length) defaultPlatform = [...new Set(foundPlats)].join(' | ');
        }
      } else {
        if (/xhslink\.com|xiaohongshu\.com|小红书/.test(text)) defaultPlatform = '小红书';
        else if (/douyin\.com|抖音/.test(text)) defaultPlatform = '抖音';
        else if (/b23\.tv|bilibili\.com|B站|哔哩哔哩/.test(text)) defaultPlatform = 'B站';
        else if (/youtu\.be|youtube\.com|YouTube/i.test(text)) defaultPlatform = 'YouTube';
        else if (/instagram\.com|ins/i.test(text)) defaultPlatform = 'Instagram';
        else if (/tiktok\.com|TikTok/i.test(text)) defaultPlatform = 'TikTok';
      }

      const themeMatch = text.match(/[「《]([^」》]+)[」》]\s*(巡回演唱会|演唱会|巡演|音乐节|嘉年华|见面会|音乐会)?/);
      const festDirectMatch = text.match(/([\u4e00-\u9fa5A-Za-z0-9·]{2,16}(?:音乐节|嘉年华))/);
      const themeStr = themeMatch
        ? `「${themeMatch[1]}」${themeMatch[2] || (text.includes('音乐节') ? '音乐节' : '巡回演唱会')}`
        : (festDirectMatch ? festDirectMatch[1] : '');

      const cityMatch = text.match(/[「【\[]?([\u4e00-\u9fa5]{2,5}站)[」】\]]?/);
      const cityStr = cityMatch ? cityMatch[1] : (themeStr || '巡演场次');

      const venueStr = extractVenueFromText(text);

      const currentYear = new Date().getFullYear();
      const showDateMatch = text.match(/(?:演出时间|演出日期|活动时间|时间)[：:]\s*(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:[（(]?(周[一二三四五六日天]|星期[一二三四五六日天])[）)]?)?/);
      let showDateStr = '';
      if (showDateMatch) {
        const y = showDateMatch[1] || currentYear;
        const mo = showDateMatch[2].padStart(2, '0');
        const da = showDateMatch[3].padStart(2, '0');
        const wk = showDateMatch[4] ? ` (${showDateMatch[4]})` : '';
        showDateStr = `${y}-${mo}-${da}${wk}`;
      }

      const priceLineMatch = text.match(/(?:票价|价格|门票)[：:]?\s*([^\n\r]+)/);
      const pricesStr = priceLineMatch ? priceLineMatch[1].trim() : '';

      let slotStr = '';
      const slotLabelMatch = text.match(/(?:预计演出时段|演出时段|登台时间|出场时间)[：:]\s*([^\n\r！!。]+)/);
      if (slotLabelMatch) {
        slotStr = slotLabelMatch[1].trim();
      } else if (/音乐节|嘉年华/.test(text)) {
        const rangeMatch = text.match(/\b(\d{1,2}:\d{2}\s*[-~—至]\s*\d{1,2}:\d{2})\b/);
        if (rangeMatch) slotStr = rangeMatch[1].trim();
      }

      const roundsContainer = document.getElementById('ticket-rounds-container');
      roundsContainer.innerHTML = '';

      const detectedRounds = [];
      const prioMatch = text.match(/(?:优先购|特权购|会员购)[^\n\r]{0,35}/);
      if (prioMatch) {
        const t = parseDateFromSnippet(prioMatch[0], currentYear);
        if (t) {
          const pPlat = prioMatch[0].includes('坤音') ? '坤音商城小程序' : defaultPlatform;
          detectedRounds.push({ round_name: '优先购', sale_time: t, platform: pPlat });
        }
      }

      const mainSaleMatch = text.match(/(?:正式开票|全面预售|预售时间|售票时间|开票时间)[^\n\r]{0,40}/);
      if (mainSaleMatch) {
        const t = parseDateFromSnippet(mainSaleMatch[0], currentYear);
        if (t && !detectedRounds.some(r => r.sale_time === t)) {
          detectedRounds.push({ round_name: '正式开票', sale_time: t, platform: defaultPlatform });
        }
      }

      if (detectedRounds.length === 0) {
        const fallbackTime = parseDateFromSnippet(text, currentYear);
        detectedRounds.push({ round_name: '正式开票', sale_time: fallbackTime, platform: defaultPlatform });
      }

      detectedRounds.forEach(r => addTicketRoundRow(r.round_name, r.sale_time, r.platform));

      let matchedTransport = findPresetTransport(`${themeStr} ${cityStr} ${venueStr} ${text}`);
      if (!matchedTransport && isTicket) {
        const placeName = venueStr || '演出现场';
        matchedTransport = [
          `🚇 地铁/公交：点击「导航 ↗」使用高德地图搜索「${placeName}」查看最近站点`,
          `🚄 高铁站/机场 → ${placeName}：出站后可乘地铁换乘或网约车直达`
        ].join('\n');
      }

      let cleanText = text
        .replace(/https?:\/\/\S+/g, '')
        .replace(/[\s\S]*?请领取你的小票\s*/g, '')
        .replace(/[「“"]?\.\.\.把文本复制下来[\s\S]*/g, '')
        .replace(/复制打开抖音[\s\S]*|小红书App[\s\S]*|长按复制此条消息[\s\S]*|打开小红书查看[\s\S]*|打开抖音搜索[\s\S]*/g, '')
        .replace(/[0-9a-zA-Z]{8,12}\s*$/g, '')
        .trim();

      document.getElementById('cp-artist').value = artist;
      document.getElementById('cp-platform').value = defaultPlatform;
      document.getElementById('cp-tour-theme').value = themeStr;
      document.getElementById('cp-tour-title').value = cityStr;
      document.getElementById('cp-tour-venue').value = venueStr;
      document.getElementById('cp-tour-showdate').value = showDateStr;
      document.getElementById('cp-tour-prices').value = pricesStr;
      document.getElementById('cp-tour-slot').value = slotStr;
      document.getElementById('cp-tour-poster').value = '';
      document.getElementById('cp-tour-seat').value = '';
      document.getElementById('cp-tour-transport').value = matchedTransport;
      document.getElementById('cp-content').value = cleanText;
      document.getElementById('cp-time').value = isTicket ? '' : (parseDateFromSnippet(text, currentYear) || getLocalDatetimeString());
      document.getElementById('cp-url').value = url;
      document.getElementById('cp-url-ticket').value = url;
      document.getElementById('cp-img').value = '';

      toggleCloudFields();
      document.getElementById('parse-confirm-box').classList.remove('hidden');
    }

    async function submitCloudEntry() {
      const type = document.querySelector('input[name="cloudEntryType"]:checked').value;
      const artist = document.getElementById('cp-artist').value;

      const btn = document.getElementById('cp-submit-btn');
      btn.disabled = true;
      btn.textContent = '☁️ 正在同步至云端...';

      try {
        if (type === 'ticket') {
          const theme = document.getElementById('cp-tour-theme').value.trim();
          const tourTitle = document.getElementById('cp-tour-title').value.trim();
          const venue = document.getElementById('cp-tour-venue').value.trim() || '场馆待补充';
          const showDate = document.getElementById('cp-tour-showdate').value.trim();
          const prices = document.getElementById('cp-tour-prices').value.trim();
          const slotNote = document.getElementById('cp-tour-slot').value.trim();
          const posterUrl = document.getElementById('cp-tour-poster').value.trim();
          const seatUrl = document.getElementById('cp-tour-seat').value.trim();
          const transportText = document.getElementById('cp-tour-transport').value.trim();
          const url = document.getElementById('cp-url-ticket').value.trim();

          if (!tourTitle) throw new Error('请填写城市站次或场次名！');

          const rounds = [];
          document.querySelectorAll('.ticket-round-row').forEach(row => {
            const round_name = row.querySelector('.tr-name').value.trim() || '正式开票';
            const sale_time = row.querySelector('.tr-time').value;
            const platform = row.querySelector('.tr-plat').value.trim() || '大麦';
            if (sale_time) {
              rounds.push({ round_name, sale_time: sale_time.replace('T', ' '), platform });
            }
          });

          if (rounds.length === 0) throw new Error('请至少填写一轮完整的开票时间！');

          rounds.sort((a, b) => new Date(a.sale_time.replace(/-/g, '/')) - new Date(b.sale_time.replace(/-/g, '/')));
          const earliestIsoTime = rounds[0].sale_time.replace(' ', 'T');

          const displayTitle = theme && !tourTitle.includes(theme) ? `${theme} · ${tourTitle}` : tourTitle;
          const structuredTitle = `${artist}|${displayTitle}|${venue}|${showDate || rounds[0].sale_time}|${slotNote}`;
          const tourMetaObj = { rounds, transport: transportText, slot: slotNote, theme, prices, posterUrl, seatUrl };
          const encodedMeta = `META:${JSON.stringify(tourMetaObj)}`;
          const payload = { title: structuredTitle, ticket_time: earliestIsoTime, platform: encodedMeta, url };

          const res = await fetch(`${SUPABASE_URL}/rest/v1/tickets`, {
            method: 'POST', headers: SB_HEADERS, body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        } else if (type === 'archive') {
          const subType = document.querySelector('input[name="archiveSubType"]:checked')?.value || 'tour';
          const theme = document.getElementById('arc-theme').value.trim();
          const title = document.getElementById('arc-title').value.trim();
          const showDate = document.getElementById('arc-date').value;
          const venue = document.getElementById('arc-venue').value.trim() || '演出地点待补充';
          const posterUrl = document.getElementById('arc-poster-url').value.trim();
          const prices = document.getElementById('arc-prices').value.trim();
          const seatUrl = document.getElementById('arc-seat-url').value.trim();
          const slot = document.getElementById('arc-slot').value.trim();
          const setlistRaw = document.getElementById('arc-setlist').value.trim();
          const url = document.getElementById('arc-url').value.trim();

          if (!title) throw new Error('请填写具体站次或场次标题！');
          if (!showDate) throw new Error('请选择演出日期！');

          const setlist = setlistRaw
            ? setlistRaw.split('\n').map(s => s.replace(/^\d+[\.、\s]+/, '').trim()).filter(Boolean)
            : [];

          const displayTitle = theme && !title.includes(theme) ? `${theme} · ${title}` : title;
          const archiveObj = { subType, theme, venue, posterUrl, prices, seatUrl, slot, setlist };
          const structuredTitle = `ARCHIVE|${artist}|${displayTitle}|${showDate}`;
          const encodedMeta = `ARCHIVE:${JSON.stringify(archiveObj)}`;
          const payload = { title: structuredTitle, ticket_time: `${showDate}T19:30`, platform: encodedMeta, url };

          const res = await fetch(`${SUPABASE_URL}/rest/v1/tickets`, {
            method: 'POST', headers: SB_HEADERS, body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

          document.getElementById('arc-poster-preview').classList.add('hidden');
          document.getElementById('arc-ocr-status').classList.add('hidden');
        } else {
          const platform = document.getElementById('cp-platform').value.trim() || '微博';
          const content = document.getElementById('cp-content').value.trim();
          const url = document.getElementById('cp-url').value.trim();
          const imgUrl = document.getElementById('cp-img').value.trim();
          const customTimeVal = document.getElementById('cp-time').value;

          if (!content) throw new Error('请填写博文正文！');

          let storedContent = content;
          if (imgUrl) storedContent += `\n[IMG:${imgUrl}]`;
          if (customTimeVal) {
            const pubTs = new Date(customTimeVal).getTime();
            if (!isNaN(pubTs)) storedContent += `\n[PUB:${pubTs}]`;
          }

          const payload = { platform, artist, content: storedContent, url };
          const res = await fetch(`${SUPABASE_URL}/rest/v1/feeds`, {
            method: 'POST', headers: SB_HEADERS, body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        }

        document.getElementById('raw-post-input').value = '';
        document.getElementById('parse-confirm-box').classList.add('hidden');
        await loadTourData();
        await loadAllFeeds(true);
      } catch (e) {
        alert(`同步失败 (${e.message})`);
      } finally {
        btn.disabled = false;
        btn.textContent = '☁️ 确认发布并同步至所有设备';
      }
    }

      const dateOnly = (item.show_date || '').slice(0, 10) || new Date().toISOString().slice(0, 10);
      const isFest = /音乐节|嘉年华/.test(item.city);
      const archiveObj = {

        venue: item.venue || '',
        posterUrl: item.posterUrl || '',
        prices: item.prices || '',
        seatUrl: item.seatUrl || '',
        slot: item.slot || '',

      const payload = {
        title: `ARCHIVE|${item.artist}|${item.city}|${dateOnly}`,
        ticket_time: `${dateOnly}T19:30`,

    function downloadICS(title, timeStr, platform, url) {
      const start = new Date(timeStr.replace(/-/g, '/'));
      if (isNaN(start)) return alert('时间格式暂不支持导出日历');
      const end = new Date(start.getTime() + 30 * 60000);
      const fmt = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
        `SUMMARY:🎫 抢票提醒：${title} (${platform})`,
        `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
        `DESCRIPTION:售票平台：${platform}\\n直达链接：${url || ''}`,
        'BEGIN:VALARM', 'TRIGGER:-PT15M', 'ACTION:DISPLAY', 'DESCRIPTION:还有15分钟开票！', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR'
      ].join('\r\n');
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}-开票提醒.ics`;
      a.click();
    }

    function addArtistAccount() {
      const artistName = document.getElementById('input-artist-name').value.trim();
      const platformName = document.getElementById('input-platform-name').value.trim();
      const rssUrl = document.getElementById('input-rss-url').value.trim();
      const color = document.getElementById('input-color').value;

      if (!artistName || !platformName || !rssUrl) {
        alert('请完整填写艺人名称、账号标签和 RSS 链接！');
        return;
      }

      const existingArtist = artistsConfig.find(a => a.artistName === artistName);
      const finalColor = existingArtist?.badgeStyle || color;

      const newAcc = {
        id: 'acc_' + Date.now(),
        name: platformName,
        color: finalColor,
        url: rssUrl
      };

      if (existingArtist) {
        existingArtist.accounts.push(newAcc);
      } else {
        artistsConfig.push({
          artistId: 'artist_' + Date.now(),
          artistName: artistName,
          badgeStyle: color,
          accounts: [newAcc]
        });
      }

      saveArtistsConfig();
      document.getElementById('input-platform-name').value = '';
      document.getElementById('input-rss-url').value = '';
      renderManageList();
      loadAllFeeds(true);

    function extractThemeName(fullTitle, savedTheme = '') {
      if (savedTheme) return savedTheme;
      const m = (fullTitle || '').match(/([「《][^」》]+[」》]\s*(?:巡回演唱会|演唱会|巡演|音乐节|嘉年华)?)/);
      return m ? m[1].trim() : '';
    }

    async function loadTourData() {
      cloudTickets = [];
      cloudArchives = [];
      try {
        const sbRes = await fetch(`${SUPABASE_URL}/rest/v1/tickets?select=*&order=ticket_time.asc`, { headers: SB_HEADERS });
        if (sbRes.ok) {
          const rows = await sbRes.json();
          rows.forEach(r => {
            if (r.title && r.title.startsWith('ARCHIVE|')) {
              const parts = r.title.split('|');
              const artist = parts[1] || 'ONER';
              const showTitle = parts[2] || '演出回顾';
              const showDate = parts[3] || r.ticket_time.slice(0, 10);
              let arcData = { subType: 'tour', theme: '', venue: '', posterUrl: '', prices: '', seatUrl: '', slot: '', setlist: [] };
              if (r.platform && r.platform.startsWith('ARCHIVE:')) {
                try {
                  arcData = { ...arcData, ...JSON.parse(r.platform.slice(8)) };
                } catch (e) {}
              }
              const resolvedTheme = extractThemeName(showTitle, arcData.theme);
              cloudArchives.push({
                cloudId: r.id,
                artist,
                title: showTitle,
                theme: resolvedTheme,
                showDate,
                year: showDate.slice(0, 4),
                url: r.url || '',
                ...arcData
              });
              return;
            }

            const parts = r.title.split('|');
            const artist = parts.length > 1 ? parts[0] : 'ONER';
            const cityTitle = parts.length > 1 ? parts[1] : r.title;
            const venue = parts.length > 2 ? parts[2] : '场馆待补充';
            const showDate = parts.length > 3 ? parts[3] : r.ticket_time.replace('T', ' ');
            let slotNote = parts.length > 4 ? parts[4] : '';

            let parsedRounds = [];
            let savedTransport = '';
            let savedTheme = '';
            let savedPrices = '';
            let savedPosterUrl = '';
            let savedSeatUrl = '';

            if (r.platform && r.platform.startsWith('META:')) {
              try {
                const meta = JSON.parse(r.platform.slice(5));
                if (Array.isArray(meta.rounds)) parsedRounds = meta.rounds;
                if (meta.transport) savedTransport = meta.transport;
                if (meta.slot) slotNote = meta.slot;
                if (meta.theme) savedTheme = meta.theme;
                if (meta.prices) savedPrices = meta.prices;
                if (meta.posterUrl) savedPosterUrl = meta.posterUrl;
                if (meta.seatUrl) savedSeatUrl = meta.seatUrl;
              } catch (e) {}
            } else if (r.platform && r.platform.startsWith('ROUNDS:')) {
              try {
                parsedRounds = JSON.parse(r.platform.slice(7));
              } catch (e) {}
            }

            if (!Array.isArray(parsedRounds) || parsedRounds.length === 0) {
              parsedRounds = [{
                round_name: '正式开票',
                sale_time: r.ticket_time.replace('T', ' '),
                platform: r.platform || '大麦'
              }];
            }

            if (!savedTransport) {
              savedTransport = findPresetTransport(`${cityTitle} ${venue}`);
            }

            const resolvedTheme = extractThemeName(cityTitle, savedTheme);

            cloudTickets.push({
              cloudId: r.id,
              artist,
              city: cityTitle,
              theme: resolvedTheme,
              venue,
              show_date: showDate,
              slot: slotNote,
              prices: savedPrices,
              posterUrl: savedPosterUrl,
              seatUrl: savedSeatUrl,
              source_url: r.url || '#',
              rounds: parsedRounds,
              transport: savedTransport
            });
          });
        }
      } catch (e) {}

      cloudArchives.sort((a, b) => new Date(b.showDate) - new Date(a.showDate));
      updateArchiveYearOptions();

      tourSchedules = [...cloudTickets];
      renderThemeQuickBar();
      renderTourCards();
      renderArchiveTimeline();
    }

        if (activeArchiveType !== 'ALL' && item.subType !== activeArchiveType) return false;
        if (selectedYear !== 'ALL' && item.year !== selectedYear) return false;
        return true;

        if (activeArtistId === 'ALL' || !currentArtistObj) return true;
        if (!t.artist) return false;
        return t.artist.toLowerCase() === currentArtistObj.artistName.toLowerCase();
      });

      if (!filteredTours.length) {

          sectionEl.classList.add('hidden');

          container.innerHTML = `<div class="text-sm text-slate-400">暂无近期开票日程（管理员可点击「🎫 手动新增开票倒计时」添加）</div>`;

        const amapSearchUrl = `https://uri.amap.com/search?keyword=${encodeURIComponent(navKeyword)}`;

        const activeRounds = (item.rounds || []).filter(r => {
          const targetTs = new Date(r.sale_time.replace(/-/g, '/')).getTime();
          return isNaN(targetTs) || targetTs > Date.now();
        });

        const roundsHtml = activeRounds.length > 0
          ? activeRounds.map(r => {
              const isPrio = /优先|特权|会员/.test(r.round_name);
              const badgeStyleClass = isPrio
                ? 'bg-purple-500/10 text-purple-700 dark:text-purple-300 font-medium'
                : 'bg-amber-500/10 text-amber-700 dark:text-amber-300 font-medium';

              return `
                <div class="flex items-center justify-between gap-2 text-xs py-1.5 px-2.5 rounded-lg ${badgeStyleClass}">

                  </span>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="countdown-badge font-mono" data-time="${r.sale_time}"></span>
                    <button onclick="downloadICS('${item.city.replace(/'/g, '')}-${r.round_name.replace(/'/g, '')}', '${r.sale_time}', '${r.platform}', '${item.source_url || ''}')" class="text-[11px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 hover:opacity-80" title="加入手机/电脑日历">📅</button>
                  </div>
                </div>
              `;
            }).join('')
          : `<div class="text-[11px] text-slate-400 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800/40 flex items-center justify-between">
              <span>✅ 开票阶段已结束（倒计时已自动隐藏）</span>
              ${isAdmin && item.cloudId ? `<button onclick="archiveExistingTicket(${item.cloudId})" class="text-purple-600 dark:text-purple-400 font-semibold hover:underline">📦 演出已结束？一键归档至往日 ↗</button>` : ''}
            </div>`;

        return `
          <div class="p-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between gap-3">
            <div class="flex gap-3.5">
              ${item.posterUrl ? `
                <img src="${item.posterUrl}" alt="${item.city}" onclick="openLightbox('${item.posterUrl}', '${item.city} · 演出海报')"
                  class="w-20 h-28 object-cover rounded-lg border border-slate-200 dark:border-slate-800 cursor-zoom-in shrink-0 hover:opacity-90 transition" />
              ` : ''}

              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2 flex-wrap">
                    ${item.artist ? `<span class="text-xs px-2 py-0.5 rounded text-white font-semibold border border-white/15 shrink-0" style="background:${artistBadgeBg}">${item.artist}</span>` : ''}
                    <span class="font-bold text-base">${item.city}</span>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    ${item.theme ? `<button onclick="openThemeDetailModal('${item.theme.replace(/'/g, "\\'")}')" class="text-xs text-purple-600 dark:text-purple-400 hover:underline font-medium">专题页 ↗</button>` : ''}
                    ${item.source_url && item.source_url !== '#' ? `<a href="${item.source_url}" target="_blank" class="text-xs text-slate-400 hover:text-indigo-500">原帖 ↗</a>` : ''}
                    ${(isAdmin && item.cloudId) ? `<button onclick="archiveExistingTicket(${item.cloudId})" class="text-xs text-purple-500 hover:underline" title="归档至往日演出">归档</button>` : ''}
                    ${(isAdmin && item.cloudId) ? `<button onclick="deleteCloudRecord('tickets', ${item.cloudId})" class="text-xs text-rose-500 hover:underline">删除</button>` : ''}
                  </div>
                </div>

                <p class="text-xs text-slate-500 mt-1.5">📍 ${item.venue} ｜ 🗓️ ${item.show_date}</p>

                <div class="flex items-center justify-between gap-2 mt-2 flex-wrap">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    ${item.prices ? `<span class="text-[11px] px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-700 dark:text-amber-300 font-medium">💰 ${item.prices}</span>` : ''}
                    ${item.seatUrl ? `<button onclick="openLightbox('${item.seatUrl}', '${item.city} · 场馆座位图')" class="text-[11px] px-2 py-0.5 rounded-md bg-sky-500/15 text-sky-700 dark:text-sky-300 hover:bg-sky-500/25 font-medium transition">💺 座位图</button>` : ''}
                    ${item.slot ? `<span class="text-[11px] px-2 py-0.5 rounded-md bg-purple-500/10 text-purple-700 dark:text-purple-300 font-medium">🎤 ${item.slot}</span>` : ''}
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="toggleTransportDrawer(${idx})" class="text-[11px] px-2 py-0.5 rounded-md bg-sky-500/10 text-sky-700 dark:text-sky-300 hover:bg-sky-500/20 font-medium transition">
                      🚇 交通攻略 ▾
                    </button>
                    <a href="${amapSearchUrl}" target="_blank" class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-indigo-500 transition">
                      导航 ↗
                    </a>
                  </div>
                </div>

                <div id="transport-box-${idx}" class="hidden mt-2.5 p-2.5 rounded-lg bg-sky-500/5 border border-sky-500/20 text-xs text-slate-600 dark:text-slate-300 space-y-1 leading-relaxed whitespace-pre-line">
                  <div class="font-semibold text-sky-700 dark:text-sky-300 mb-1">🚇 交通枢纽 → ${item.venue}：</div>
                  ${item.transport || '该场地暂未录入预设路线，可点击右侧「导航 ↗」一键使用高德地图规划路线。'}
                </div>
              </div>
            </div>

            <div class="space-y-1.5">
              ${roundsHtml}
            </div>
          </div>
        `;
      }).join('');
      updateCountdowns();
    }

    function updateCountdowns() {
      const now = Date.now();
      let needReRender = false;
      document.querySelectorAll('.countdown-badge').forEach(el => {
        const raw = el.getAttribute('data-time');
        const target = new Date(raw.replace(/-/g, '/')).getTime();
        if (isNaN(target)) return;
        const diff = target - now;
        if (diff <= 0) {
          needReRender = true;
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `剩 ${d}天${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      });
      if (needReRender) renderTourCards();
    }

    async function loadAllFeeds(force = false) {
      document.getElementById('timeline-list').innerHTML = `<div class="text-center py-10 text-sm text-slate-400">正在同步最新聚合动态...</div>`;
      let serverPosts = [];

      cloudFeeds = [];
      try {
        const sbRes = await fetch(`${SUPABASE_URL}/rest/v1/feeds?select=*&order=created_at.desc&limit=80`, { headers: SB_HEADERS });
        if (sbRes.ok) {
          const rows = await sbRes.json();
          cloudFeeds = rows.map(r => {
            const meta = ARTIST_META_MAP[r.artist] || { artistId: 'oner', color: COLOR_ONER };
            const matchedArtistObj = artistsConfig.find(a => a.artistName === r.artist);
            const matchedAcc = matchedArtistObj?.accounts.find(acc => acc.name === r.platform);
            const rawContent = r.content || '';
            const imgMatch = rawContent.match(/\[IMG:(https?:\/\/[^\]]+)\]/);
            const pubMatch = rawContent.match(/\[PUB:(\d+)\]/);
            const cleanBody = rawContent
              .replace(/\n?\[IMG:https?:\/\/[^\]]+\]/g, '')
              .replace(/\n?\[PUB:\d+\]/g, '')
              .trim();
            const realTimestamp = pubMatch ? Number(pubMatch[1]) : new Date(r.created_at).getTime();

            return {
              cloudId: r.id,
              artistId: matchedArtistObj?.artistId || meta.artistId,
              artistName: r.artist,
              accountId: matchedAcc?.id || `${meta.artistId}_cloud`,
              platformName: r.platform,
              platformColor: matchedArtistObj?.badgeStyle || meta.color,
              text: cleanBody,
              imgs: imgMatch ? [imgMatch[1]] : [],
              link: r.url || '#',
              timestamp: realTimestamp
            };
          });
          serverPosts.push(...cloudFeeds);
          document.getElementById('last-sync').textContent = '云端已同步 · ' + new Date().toLocaleTimeString();
        }
      } catch (e) {}

      try {
        const res = await fetch('./feeds_data.json?t=' + Date.now());
        if (res.ok) {
          const payload = await res.json();
          if (Array.isArray(payload.posts)) {
            serverPosts.push(...payload.posts);
          }
        }
      } catch (e) {}

      allPosts = serverPosts;
      allPosts.sort((a, b) => b.timestamp - a.timestamp);
      initUI();
    }

    function initUI() {
      const artistOptions = [{ id: 'ALL', name: '全部艺人', badgeStyle: '#4f46e5' }, ...artistsConfig.map(a => ({
        id: a.artistId,
        name: a.artistName,
        badgeStyle: a.badgeStyle || a.accounts[0]?.color || '#4f46e5'
      }))];

      const currentObj = artistOptions.find(a => a.id === activeArtistId) || artistOptions[0];
      const menuBtn = document.getElementById('artist-menu-btn');
      document.getElementById('current-artist-label').textContent = currentObj.name;
      menuBtn.style.background = currentObj.badgeStyle;

      document.getElementById('artist-dropdown-menu').innerHTML = artistOptions.map(t => {
        const isActive = activeArtistId === t.id;
        return `
          <button type="button" onclick="selectArtist('${t.id}')"
            class="w-full px-3.5 py-2 text-left text-xs flex items-center justify-between hover:bg-slate-100 dark:hover:bg-slate-800 transition ${isActive ? 'font-bold text-indigo-600 dark:text-indigo-400' : 'text-slate-700 dark:text-slate-300'}">
            <span class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${t.badgeStyle}"></span>
              <span>${t.name}</span>
            </span>
            ${isActive ? '<span>✓</span>' : ''}
          </button>
        `;
      }).join('');

      const artistPosts = activeArtistId === 'ALL' ? allPosts : allPosts.filter(p => p.artistId === activeArtistId);

      const spotlightEl = document.getElementById('latest-spotlight');
      if (artistPosts.length > 0) {
        const top = artistPosts[0];
        spotlightEl.classList.remove('hidden');
        document.getElementById('spotlight-artist').textContent = top.artistName;
        document.getElementById('spotlight-platform').textContent = top.platformName;
        document.getElementById('spotlight-time').textContent = formatTimeAgo(top.timestamp);
        document.getElementById('spotlight-text').textContent = top.text.slice(0, 140) + (top.text.length > 140 ? '...' : '');
        document.getElementById('spotlight-link').href = top.link;
      } else {
        spotlightEl.classList.add('hidden');
      }

      const platformMap = new Map();
      artistPosts.forEach(p => {
        const key = `${p.artistName}·${p.platformName}`;
        const label = activeArtistId === 'ALL' ? key : p.platformName;
        if (!platformMap.has(label)) {
          platformMap.set(label, { label, color: p.platformColor, count: 0 });
        }
        platformMap.get(label).count++;
      });

      const platformTabs = [{ id: 'ALL', label: `全部 (${artistPosts.length})`, color: '#1e293b' }, ...[...platformMap.values()].map(item => ({
        id: item.label,
        label: `${item.label} (${item.count})`,
        color: item.color
      }))];

      document.getElementById('platform-tabs').innerHTML = platformTabs.map(t => {
        const isActive = activeAccountId === t.id;
        return `
          <button onclick="selectAccount('${t.id}')"
            style="${isActive ? `background:${t.color}` : ''}"
            class="px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition border ${isActive ? 'text-white border-white/20 shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-transparent'}">
            ${t.label}
          </button>
        `;
      }).join('');

      renderTourCards();
      renderArchiveTimeline();
      renderTimeline();
    }

    function selectArtist(id) {
      activeArtistId = id;
      activeAccountId = 'ALL';
      document.getElementById('artist-dropdown-menu').classList.add('hidden');
      initUI();
    }

    function selectAccount(id) {
      activeAccountId = id;
      initUI();
    }

    function clearDate() {
      document.getElementById('date-start-filter').value = '';
      document.getElementById('date-end-filter').value = '';
      renderTimeline();
    }

    function renderTimeline() {
      const startDateVal = document.getElementById('date-start-filter').value;
      const endDateVal = document.getElementById('date-end-filter').value;
      const kw = document.getElementById('keyword-filter').value.trim().toLowerCase();

      const startTs = startDateVal ? new Date(`${startDateVal}T00:00:00`).getTime() : null;
      const endTs = endDateVal ? new Date(`${endDateVal}T23:59:59`).getTime() : null;

      const filtered = allPosts.filter(p => {
        if (activeArtistId !== 'ALL' && p.artistId !== activeArtistId) return false;
        if (activeAccountId !== 'ALL') {
          const pLabel = activeArtistId === 'ALL' ? `${p.artistName}·${p.platformName}` : p.platformName;
          if (pLabel !== activeAccountId) return false;
        }
        if (startTs && p.timestamp < startTs) return false;
        if (endTs && p.timestamp > endTs) return false;
        if (kw && !p.text.toLowerCase().includes(kw)) return false;
        return true;
      });

      const listEl = document.getElementById('timeline-list');
      if (!filtered.length) {
        listEl.innerHTML = `<div class="text-center py-10 text-sm text-slate-400">暂无符合筛选条件的动态记录</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(p => {
        const dateStr = new Date(p.timestamp).toLocaleString('zh-CN', { hour12: false });
        const imgsHtml = (p.imgs || []).slice(0, 4).map(src => `
          <a href="${src}" target="_blank">
            <img src="${src}" loading="lazy" class="w-full h-36 object-cover rounded-lg border border-slate-200 dark:border-slate-800" />
          </a>
        `).join('');

        return `
          <article class="p-4 sm:p-5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
            <div class="flex items-center justify-between text-xs gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-white font-semibold border border-white/15 shadow-xs" style="background:${p.platformColor}">
                  ${p.artistName} · ${p.platformName}
                </span>
                <span class="text-slate-500">${formatTimeAgo(p.timestamp)} · ${dateStr}</span>
              </div>
              <div class="flex items-center gap-2.5 shrink-0">
                ${p.link && p.link !== '#' ? `<a href="${p.link}" target="_blank" class="text-slate-400 hover:text-indigo-500">原帖 ↗</a>` : ''}
                ${(isAdmin && p.cloudId) ? `<button onclick="deleteCloudRecord('feeds', ${p.cloudId})" class="text-rose-500 hover:underline">删除</button>` : ''}
              </div>
            </div>
            <p class="text-sm leading-relaxed whitespace-pre-line line-clamp-4 cursor-pointer" onclick="this.classList.toggle('line-clamp-4')">${p.text}</p>
            ${imgsHtml ? `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${imgsHtml}</div>` : ''}
          </article>
        `;
      }).join('');
    }

    function formatTimeAgo(ts) {
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 0) return '即将发布';
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
      return Math.floor(diff / 86400) + ' 天前';
    }

    syncAdminUI();
    loadTourData();
    loadAllFeeds();
    setInterval(updateCountdowns, 1000);
    setInterval(() => { loadTourData(); loadAllFeeds(); }, 60000);
  </script>
</body>
</html>
