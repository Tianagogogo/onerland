<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ONER时光典藏纪念册</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      background-color: #f4f5f7;
      background-image:
        radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.96), transparent 55%),
        radial-gradient(circle at 85% 15%, rgba(203, 213, 225, 0.35), transparent 45%),
        linear-gradient(180deg, #f8f9fb 0%, #eceff4 100%);
      background-attachment: fixed;
    }
    .metal-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.94), rgba(241,244,249,0.88));
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid #cbd5e1;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 4px 18px rgba(15,23,42,0.045);
    }
    .chronicle-card {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 55%, #e2e8f0 100%);
      border: 1px solid #94a3b8;
      box-shadow: inset 0 1px 0 #ffffff, 0 8px 26px rgba(15,23,42,0.07);
    }
    .liquid-silver-btn {
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 52%, #cbd5e1 100%);
      border: 1px solid #94a3b8; color: #0f172a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(15,23,42,0.06);
    }
    .liquid-silver-btn:hover { background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 52%, #94a3b8 100%); color: #020617; }
    .obsidian-btn {
      background: linear-gradient(135deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid #475569; color: #f8fafc;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 6px rgba(15,23,42,0.14);
    }
    .obsidian-btn:hover { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    .line-clamp-1-clean { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
    .no-scrollbar::-webkit-scrollbar { height:6px; width:6px; }
    .no-scrollbar::-webkit-scrollbar-track { background:#e2e8f0; border-radius:999px; }
    .no-scrollbar::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:999px; }

    /* 倒计时黑曜石徽章 */
    .cd-badge {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #475569;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 6px rgba(15,23,42,0.2);
    }
    .cd-badge .cd-num { font-weight: 800; letter-spacing: 0.02em; }
    .cd-badge .cd-unit { font-size: 9px; color: #94a3b8; display:block; text-align:center; line-height:1; margin-top:2px; }

    /* 视角探索器 */
    .zone-hit { cursor: pointer; transition: opacity .15s, filter .15s; }
    .zone-hit:hover { filter: brightness(1.15); }
    .zone-hit.active { filter: brightness(1.35) saturate(1.2); }
    .zone-hit.active rect, .zone-hit.active path, .zone-hit.active polygon { stroke: #f59e0b; stroke-width: 2.5; }

    #vv-fp-svg-container svg { display:block; width:100%; height:auto; }

    /* 防 iOS 聚焦自动放大 */
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
      .modal-scroll-safe { max-height: 90dvh !important; }
    }
    .touch-pinch { touch-action: pinch-zoom pan-x pan-y; }
  </style>
</head>
<body class="text-slate-800 min-h-screen antialiased selection:bg-slate-300 selection:text-slate-950">

  <!-- ================= 顶部导航栏 ================= -->
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-xl border-b border-slate-300/80 shadow-2xs">
    <div class="max-w-5xl mx-auto px-3 sm:px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
        <div class="flex items-center gap-2">
          <span id="sync-dot" class="w-2 h-2 rounded-full bg-slate-700 animate-pulse"></span>
          <h1 class="font-bold text-base sm:text-lg tracking-tight text-slate-900 whitespace-nowrap">ONER时光典藏纪念册</h1>
        </div>

        <div class="inline-flex items-center p-0.5 rounded-full bg-slate-200/85 border border-slate-300 text-xs">
          <button type="button" id="nav-tab-shows" onclick="switchMainTab('shows')" class="px-3 py-1 rounded-full obsidian-btn font-semibold transition whitespace-nowrap">🎫 演出典藏</button>
          <button type="button" id="nav-tab-feeds" onclick="switchMainTab('feeds')" class="px-3 py-1 rounded-full text-slate-600 hover:text-slate-900 font-medium transition whitespace-nowrap">📱 社媒动态</button>
        </div>

        <!-- 三级级联艺人菜单 -->
        <div class="relative" id="artist-dropdown-wrap">
          <button type="button" onclick="toggleArtistMenu(event)" id="artist-menu-btn"
            class="px-3 py-1.5 rounded-full text-xs font-semibold text-white bg-slate-800 shadow-2xs flex items-center gap-1.5 transition hover:opacity-90 whitespace-nowrap">
            <span>🎤 <span id="current-artist-label">全部艺人</span></span>
            <span class="text-[10px]">▾</span>
          </button>
          <div id="artist-dropdown-menu" class="hidden absolute left-0 mt-2 w-52 rounded-xl bg-white/97 backdrop-blur-xl border border-slate-300 shadow-xl py-1.5 z-40 max-h-[70vh] overflow-y-auto no-scrollbar"></div>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <span id="last-sync" class="text-slate-400 hidden lg:inline">准备就绪</span>
        <div id="admin-entry-buttons" class="hidden items-center gap-2">
          <button id="admin-unlock-btn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-lg liquid-silver-btn transition font-medium whitespace-nowrap">🔒 管理</button>
          <button onclick="openManageModal()" class="px-3 py-1.5 rounded-lg liquid-silver-btn transition font-medium hidden sm:inline-block whitespace-nowrap">⚙️ 订阅源</button>
        </div>
        <button onclick="refreshCurrentTab()" class="px-3 py-1.5 rounded-lg obsidian-btn transition font-semibold whitespace-nowrap">刷新同步</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-4 py-6 space-y-8">

    <!-- ================= 管理员面板 ================= -->
    <section id="admin-publisher-panel" class="hidden p-4 sm:p-5 rounded-2xl chronicle-card space-y-3">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <span class="text-sm font-bold text-slate-900">✨ 管理员投喂台</span>
        <div class="flex items-center gap-3 text-xs">
          <button type="button" onclick="configGeminiKey()" class="text-slate-700 hover:underline font-medium">
            🔑 AI 识图密钥 (<span id="ai-key-status">未配置</span>)
          </button>
          <button onclick="lockAdminMode()" class="text-slate-400 hover:text-rose-600">退出管理</button>
        </div>
      </div>

      <textarea id="raw-post-input" rows="2" placeholder="粘贴微博 / 小红书 / 抖音分享口令或官宣文案..."
        class="w-full text-xs sm:text-sm p-3 rounded-xl border border-slate-300 bg-white/95 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-slate-500"></textarea>

      <div class="flex items-center gap-2 flex-wrap">
        <button id="smart-parse-btn" onclick="smartParsePost()" class="px-3.5 py-2 rounded-lg obsidian-btn text-xs font-semibold transition">🪄 智能识别文案</button>
        <button type="button" onclick="openTicketFormDirectly()" class="px-3.5 py-2 rounded-lg liquid-silver-btn text-xs font-semibold transition">🎫 手动新增演出</button>
        <button type="button" onclick="openArchiveFormDirectly()" class="px-3.5 py-2 rounded-lg liquid-silver-btn text-xs font-semibold transition">🏛️ 录入往日演出</button>
        <button onclick="resetConfirmForm()" class="px-3 py-2 rounded-lg bg-slate-200/80 text-slate-600 hover:text-slate-900 text-xs">清空收起</button>
      </div>

      <div id="parse-confirm-box" class="hidden pt-3 border-t border-dashed border-slate-300 space-y-3">
        <div id="editing-banner" class="hidden px-3 py-2 rounded-lg bg-slate-200/70 border border-slate-400 text-xs text-slate-800 flex items-center justify-between">
          <span>✏️ 正在编辑：<strong id="editing-target-name"></strong></span>
          <button type="button" onclick="cancelEditMode()" class="text-rose-600 underline font-medium">取消编辑</button>
        </div>

        <div id="entry-type-selector" class="flex items-center gap-4 text-xs flex-wrap">
          <span class="text-slate-500">同步至板块：</span>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-slate-800"><input type="radio" name="cloudEntryType" value="feed" checked onchange="toggleCloudFields()" /> 📱 社媒动态</label>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-slate-800"><input type="radio" name="cloudEntryType" value="ticket" onchange="toggleCloudFields()" /> 🎫 近期演出</label>
          <label class="flex items-center gap-1 cursor-pointer font-medium text-slate-800"><input type="radio" name="cloudEntryType" value="archive" onchange="toggleCloudFields()" /> 🏛️ 往日档案</label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="text-slate-500 block mb-1">关联艺人</label>
            <select id="cp-artist" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-800">
              <option value="ONER">ONER</option>
              <option value="坤音娱乐">坤音娱乐</option>
              <option value="岳岳">岳岳</option>
              <option value="木子洋">木子洋</option>
              <option value="灵超">灵超</option>
            </select>
          </div>
          <div id="cp-feed-platform-wrap">
            <label class="text-slate-500 block mb-1">来源平台</label>
            <input id="cp-platform" type="text" placeholder="微博" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-800" />
          </div>
          <div id="cp-ticket-url-top" class="hidden">
            <label class="text-slate-500 block mb-1">官宣原帖 / 购票链接</label>
            <input id="cp-url-ticket" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-800" />
          </div>

          <!-- 往日档案 -->
          <div id="cp-archive-fields" class="hidden sm:col-span-2 space-y-3 p-3.5 rounded-xl bg-white/90 border border-slate-300">
            <div class="flex items-center gap-3 flex-wrap">
              <span class="font-bold text-slate-800">演出类型：</span>
              <label class="flex items-center gap-1 cursor-pointer font-medium"><input type="radio" name="archiveSubType" value="tour" checked onchange="toggleArchiveSubFields()" /> 🏟️ 巡演 / Livehouse</label>
              <label class="flex items-center gap-1 cursor-pointer font-medium"><input type="radio" name="archiveSubType" value="festival" onchange="toggleArchiveSubFields()" /> 🎪 音乐节</label>
            </div>

            <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 space-y-2.5">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <label class="font-semibold text-slate-800">🖼️ 官宣海报 / 多场次排期表</label>
                <div class="flex items-center gap-2 flex-wrap">
                  <label class="cursor-pointer px-3 py-1 rounded-lg liquid-silver-btn font-medium transition">选择本地图片<input type="file" id="arc-poster-file" accept="image/*" class="hidden" onchange="handlePosterUpload(event)" /></label>
                  <button type="button" id="arc-ocr-btn" onclick="runSmartPosterRecognition('archive')" class="px-3 py-1 rounded-lg obsidian-btn font-medium transition">🔍 识别海报</button>
                </div>
              </div>
              <input id="arc-poster-url" type="text" placeholder="或粘贴海报图片链接 https://..." class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs" />
              <div id="arc-ocr-status" class="hidden text-[11px] text-slate-600 font-medium"></div>
              <img id="arc-poster-preview" class="hidden max-h-40 rounded-lg border border-slate-300 object-contain" />

              <div id="multi-show-batch-box" class="hidden pt-2 border-t border-slate-200 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <span class="font-bold text-slate-800">📋 识别到多场排期（勾选后批量导入）：</span>
                  <div class="flex items-center gap-2">
                    <select id="batch-target-section" class="px-2 py-1 rounded border border-slate-300 bg-white text-[11px]">
                      <option value="archive">导入至：🏛️ 往日档案</option>
                      <option value="ticket">导入至：🎫 近期演出</option>
                    </select>
                    <button type="button" onclick="batchImportRecognizedShows()" class="px-3 py-1 rounded-lg obsidian-btn font-semibold transition">✅ 批量导入</button>
                  </div>
                </div>
                <div id="multi-show-list" class="space-y-1.5 max-h-64 overflow-y-auto no-scrollbar"></div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><label class="text-slate-500 block mb-1">巡演主题</label><input id="arc-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-500 block mb-1">站次 / 场次名（必填）</label><input id="arc-title" type="text" placeholder="如：合肥站" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-500 block mb-1">演出日期（必填）</label><input id="arc-date" type="date" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-500 block mb-1">城市与场馆</label><input id="arc-venue" type="text" placeholder="如：北京 · 疆进酒·OMNI SPACE" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>

              <div id="arc-tour-only" class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label class="text-slate-700 font-medium block mb-1">💰 票价档位</label><input id="arc-prices" type="text" placeholder="如：预售 280 / 全价 380 / VIP 580" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
                <div>
                  <label class="text-slate-700 font-medium block mb-1">💺 座位图</label>
                  <div class="flex gap-1.5">
                    <input id="arc-seat-url" type="text" placeholder="https://..." class="flex-1 px-2.5 py-2 rounded-lg border border-slate-300 bg-white" />
                    <label class="cursor-pointer px-2.5 py-2 rounded-lg liquid-silver-btn shrink-0 font-medium">上传<input type="file" accept="image/*" class="hidden" onchange="handleSeatMapUpload(event)" /></label>
                  </div>
                </div>
              </div>

              <div id="arc-fest-only" class="hidden sm:col-span-2 space-y-3">
                <div><label class="text-slate-700 font-medium block mb-1">⏰ 演出时间段</label><input id="arc-slot" type="text" placeholder="如：16:20 - 17:00（主舞台）" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
                <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 space-y-2">
                  <div class="flex items-center justify-between flex-wrap gap-2">
                    <label class="text-slate-700 font-medium">🗓️ 时间表图片</label>
                    <label class="cursor-pointer px-2.5 py-1 rounded-lg liquid-silver-btn font-medium transition">+ 多选上传<input type="file" id="arc-schedule-files" accept="image/*" multiple class="hidden" onchange="handleMultiScheduleUpload(event, 'arc')" /></label>
                  </div>
                  <div class="flex gap-1.5">
                    <input id="arc-schedule-url-input" type="text" placeholder="图片网址 https://..." class="flex-1 px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs" />
                    <button type="button" onclick="addScheduleImageByUrl('arc')" class="px-2.5 py-1.5 rounded-lg liquid-silver-btn font-medium">添加</button>
                  </div>
                  <div id="arc-schedule-thumbs" class="flex gap-2 flex-wrap pt-1"></div>
                </div>
                <div><label class="text-slate-700 font-medium block mb-1">🎤 现场歌单（每行一首）</label><textarea id="arc-setlist" rows="4" placeholder="1. 过敏&#10;2. 镜中人" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white leading-relaxed"></textarea></div>
              </div>

              <div class="sm:col-span-2 p-3 rounded-lg bg-slate-50 border border-slate-200 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <label class="text-slate-700 font-medium">🔭 授权实拍视角相册</label>
                  <label class="cursor-pointer px-2.5 py-1 rounded-lg liquid-silver-btn font-medium transition">+ 上传<input type="file" accept="image/*" multiple class="hidden" onchange="handleMultiViewUpload(event, 'arc')" /></label>
                </div>
                <div id="arc-view-thumbs" class="flex gap-2 flex-wrap"></div>
              </div>

              <div class="sm:col-span-2"><label class="text-slate-500 block mb-1">官宣原帖 / 回顾链接</label><input id="arc-url" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
            </div>
          </div>

          <!-- 近期演出 -->
          <div id="cp-tour-fields" class="hidden sm:col-span-2 space-y-3 p-3.5 rounded-xl bg-white/90 border border-slate-300">
            <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 space-y-2">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <label class="font-semibold text-slate-800">🖼️ 官宣海报</label>
                <div class="flex items-center gap-2 flex-wrap">
                  <label class="cursor-pointer px-3 py-1 rounded-lg liquid-silver-btn font-medium transition">选择本地海报<input type="file" accept="image/*" class="hidden" onchange="handleUpcomingPosterUpload(event)" /></label>
                  <button type="button" id="cp-ocr-btn" onclick="runSmartPosterRecognition('ticket')" class="px-3 py-1 rounded-lg obsidian-btn font-medium transition">🔍 识别海报</button>
                </div>
              </div>
              <input id="cp-tour-poster" type="text" placeholder="或粘贴海报网址 https://..." class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs" />
              <div id="cp-ocr-status" class="hidden text-[11px] text-slate-600 font-medium"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><label class="text-slate-700 font-medium block mb-1">巡演主题</label><input id="cp-tour-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-700 font-medium block mb-1">站次（必填）</label><input id="cp-tour-title" type="text" placeholder="如：合肥站" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div>
                <label class="text-slate-500 block mb-1">场馆</label>
                <div class="flex gap-1.5">
                  <input id="cp-tour-venue" type="text" placeholder="如：MAO Livehouse" class="flex-1 px-3 py-2 rounded-lg border border-slate-300 bg-white" />
                  <button type="button" onclick="autoFillVenueTransport()" class="px-2.5 py-1.5 rounded-lg liquid-silver-btn shrink-0 font-medium">🚇 路线</button>
                </div>
              </div>
              <div><label class="text-slate-500 block mb-1">演出日期</label><input id="cp-tour-showdate" type="text" placeholder="如：2026-12-26 ~ 12-27 (连演2天)" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-700 font-medium block mb-1">⏰ 开场时间</label><input id="cp-tour-starttime" type="text" placeholder="如：19:30 开场" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-700 font-medium block mb-1">💰 票价档位</label><input id="cp-tour-prices" type="text" placeholder="如：380 / 580 / 780 / 1080" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-700 font-medium block mb-1">🎤 预计演出时段</label><input id="cp-tour-slot" type="text" placeholder="如：16:20-17:00" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
              <div>
                <label class="text-slate-700 font-medium block mb-1">💺 座位图</label>
                <div class="flex gap-1.5">
                  <input id="cp-tour-seat" type="text" placeholder="https://..." class="flex-1 px-2.5 py-2 rounded-lg border border-slate-300 bg-white" />
                  <label class="cursor-pointer px-2.5 py-2 rounded-lg liquid-silver-btn shrink-0 font-medium">上传<input type="file" accept="image/*" class="hidden" onchange="handleUpcomingSeatUpload(event)" /></label>
                </div>
              </div>

              <div class="sm:col-span-2 p-3 rounded-lg bg-slate-50 border border-slate-200 space-y-2">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <div class="flex items-center gap-2 flex-wrap">
                    <label class="text-slate-800 font-semibold">🔭 舞台结构：</label>
                    <select id="cp-stage-type" class="px-2.5 py-1 rounded border border-slate-300 bg-white text-xs">
                      <option value="auto">自动识别</option>
                      <option value="arena_3">体育馆 · 三面台</option>
                      <option value="arena_4">体育馆 · 四面台</option>
                      <option value="livehouse">Livehouse 站席</option>
                      <option value="outdoor">户外音乐节</option>
                    </select>
                  </div>

    function compressImageToDataURL(file, maxWidth = 760, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject; img.src = e.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    }

    /* 第一人称视角投影 */
    function buildProjector(eye, camX, d) {
      const F = 330, CX = 200, CY = 112;
      const yaw = Math.atan2(camX, d);       // 相机转向舞台中心
      const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
      return (X, Y, Z) => {
        const dx = X - camX, dz = Z;
        const Xc = dx * cosY - dz * sinY;
        const Zc = dx * sinY + dz * cosY;
        const zz = Zc <= 0.1 ? 0.1 : Zc;
        return { x: CX + F * Xc / zz, y: CY - F * (Y - eye) / zz };
      };
    }

    function renderFirstPerson(zone, stageType) {
      const cont = document.getElementById('vv-fp-svg-container');
      const P = buildProjector(zone.eye, zone.camX || 0, zone.d);

      // 舞台参数
      const stage = {
        w: stageType === 'livehouse' ? 12 : (stageType === 'outdoor' ? 24 : 20),
        h: stageType === 'livehouse' ? 5 : 9,
        d: zone.d
      };
      const halfW = stage.w / 2;

      // 舞台前立面四角
      const sTL = P(-halfW, stage.h, stage.d);
      const sTR = P(halfW, stage.h, stage.d);
      const sBR = P(halfW, 0, stage.d);
      const sBL = P(-halfW, 0, stage.d);

      // 大屏（Z = d + 4）
      const scrW = stage.w * 0.62, scrH = stage.h * 0.5;
      const scrBase = 2.2;
      const dS = stage.d + 4;
      const gTL = P(-scrW/2, scrBase + scrH, dS);
      const gTR = P(scrW/2, scrBase + scrH, dS);
      const gBR = P(scrW/2, scrBase, dS);
      const gBL = P(-scrW/2, scrBase, dS);

      // 音响塔
      const spkL1 = P(-halfW - 1.5, 0, stage.d - 1);
      const spkL2 = P(-halfW - 1.5, stage.h * 0.85, stage.d - 1);
      const spkR1 = P(halfW + 1.5, 0, stage.d - 1);
      const spkR2 = P(halfW + 1.5, stage.h * 0.85, stage.d - 1);

      const poly = pts => pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

      let svg = `
      <svg viewBox="0 0 400 240" class="w-full" style="background:linear-gradient(180deg,#0b1220 0%,#111827 55%,#1f2937 100%)">
        <defs>
          <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#0f172a"/>
          </linearGradient>
          <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#1e40af"/>
          </linearGradient>
        </defs>
        <!-- 地面 -->
        <rect x="0" y="112" width="400" height="128" fill="#0b1220"/>
        <line x1="0" y1="112" x2="400" y2="112" stroke="#334155" stroke-width="0.6" stroke-dasharray="3 3"/>
        <!-- 大屏（在舞台后方） -->
        <polygon points="${poly([gTL,gTR,gBR,gBL])}" fill="url(#screenGrad)" opacity="0.95" stroke="#60a5fa" stroke-width="0.8"/>
        <text x="${((gTL.x+gTR.x)/2).toFixed(0)}" y="${((gTL.y+gBR.y)/2).toFixed(0)}" text-anchor="middle" fill="#e0f2fe" font-size="7" font-weight="bold">SCREEN</text>
        <!-- 舞台主体 -->
        <polygon points="${poly([sTL,sTR,sBR,sBL])}" fill="url(#stageGrad)" stroke="#64748b" stroke-width="1"/>
        <!-- 舞台桁架顶线 -->
        <line x1="${sTL.x.toFixed(0)}" y1="${sTL.y.toFixed(0)}" x2="${sTR.x.toFixed(0)}" y2="${sTR.y.toFixed(0)}" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="${((sTL.x+sTR.x)/2).toFixed(0)}" y="${((sTL.y+sBL.y)/2).toFixed(0)}" text-anchor="middle" fill="#cbd5e1" font-size="8" font-weight="bold">STAGE</text>
        <!-- 音响塔 -->
        <polygon points="${poly([spkL1, spkL2, {x:spkL2.x+10,y:spkL2.y}, {x:spkL1.x+10,y:spkL1.y}])}" fill="#020617" stroke="#334155" stroke-width="0.6"/>
        <polygon points="${poly([spkR1, spkR2, {x:spkR2.x+10,y:spkR2.y}, {x:spkR1.x+10,y:spkR1.y}])}" fill="#020617" stroke="#334155" stroke-width="0.6"/>
      `;

      // 调音台遮挡
      if (zone.obstacle === 'console') {
        svg += `<rect x="150" y="168" width="100" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
                <text x="200" y="182" text-anchor="middle" fill="#94a3b8" font-size="7">调音台 FOH</text>`;
      }
      // 音响塔遮挡（侧翼）
      if (zone.obstacle === 'speaker') {
        svg += `<rect x="0" y="40" width="42" height="200" fill="#020617" opacity="0.9"/>
                <text x="21" y="120" text-anchor="middle" fill="#64748b" font-size="7" transform="rotate(-90 21 120)">侧屏 / 音响塔遮挡</text>`;
      }
      // 人群剪影
      if (zone.obstacle === 'crowd' || zone.id === 'lh_mid' || zone.id === 'a3_vip_b') {
        const baseY = 214;
        let heads = '';
        for (let x = 20; x < 400; x += 26) {
          const h = 10 + ((x * 7) % 6);
          heads += `<circle cx="${x}" cy="${baseY - h}" r="${7 + ((x*3)%3)}" fill="#020617"/><rect x="${x-11}" y="${baseY - h + 4}" width="22" height="30" rx="6" fill="#020617"/>`;
        }
        svg += heads;
      }
      svg += `</svg>`;
      cont.innerHTML = svg;
    }

     /* ===================== 数据解析 ===================== */
    function parseTicketRow(row) {
      const parts = (row.title || '').split('|');
      if (parts.length >= 5) {
        let meta = {};
        if (row.platform && row.platform.startsWith('META:')) {
          try { meta = JSON.parse(row.platform.slice(5)); } catch(e){}
        }
        return {
          cloudId: row.id,
          artist: parts[0], city: parts[1], venue: parts[2], show_date: parts[3], slot: parts[4],
          rounds: meta.rounds || [],
          transport: meta.transport || '',
          theme: meta.theme || '',
          prices: meta.prices || '',
          startTime: meta.startTime || '',
          posterUrl: meta.posterUrl || '',
          seatUrl: meta.seatUrl || '',
          stageType: meta.stageType || 'auto',
          scheduleImgs: meta.scheduleImgs || [],
          viewImgs: meta.viewImgs || [],
          ticket_time: row.ticket_time,
          source_url: row.url
        };
      }
      // 旧格式兼容
      return {
        cloudId: row.id, artist: 'ONER', city: row.title || '演出',
        venue: '', show_date: (row.ticket_time || '').slice(0, 10), slot: '',
        rounds: [], ticket_time: row.ticket_time, source_url: row.url,
        scheduleImgs: [], viewImgs: []
      };
    }
    function parseArchiveRow(row) {
      if (!row.title || !row.title.startsWith('ARCHIVE|')) return null;
      const parts = row.title.split('|');
      let meta = {};
      if (row.platform && row.platform.startsWith('ARCHIVE:')) {
        try { meta = JSON.parse(row.platform.slice(8)); } catch(e){}
      }
      return {
        cloudId: row.id, artist: parts[1] || 'ONER', title: parts[2] || '', date: parts[3] || '',
        subType: meta.subType || 'tour', theme: meta.theme || '', venue: meta.venue || '',
        posterUrl: meta.posterUrl || '', prices: meta.prices || '', seatUrl: meta.seatUrl || '',
        slot: meta.slot || '', scheduleImgs: meta.scheduleImgs || [], viewImgs: meta.viewImgs || [],
        setlist: meta.setlist || [], source_url: row.url
      };
    }
    function parseFeedRow(row) {
      if (!row.title || !row.title.startsWith('FEED|')) return null;
      const parts = row.title.split('|');
      let meta = {};
      if (row.platform && row.platform.startsWith('FEED:')) {
        try { meta = JSON.parse(row.platform.slice(5)); } catch(e){}
      }
      return {
        cloudId: row.id,
        artist: meta.artist || parts[1] || 'ONER',
        platform: meta.platform || parts[2] || '微博',
        accountId: meta.accountId || '',
        content: meta.content || '',
        img: meta.img || '',
        time: meta.time || row.ticket_time || '',
        source_url: row.url || meta.url || ''
      };
    }

    /* ===================== 加载数据 ===================== */
    async function loadTourData() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/tickets?select=*&order=created_at.desc`, { headers: SB_HEADERS });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json();
        cloudTickets = rows.map(parseTicketRow);
        cloudArchives = rows.map(parseArchiveRow).filter(Boolean);
        renderTourCards();
        renderArchiveTimeline();
        document.getElementById('last-sync').textContent = '同步于 ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error(e);
        document.getElementById('last-sync').textContent = '同步失败：' + e.message;
      }
    }

    async function loadAllFeeds(silent = false) {

    /* ===================== 近期演出：三档排序 + 倒计时 ===================== */
    function parseShowDate(item) {
      const s = item.show_date || '';
      const m = s.match(/(\d{4})[年\-\.\/](\d{1,2})[月\-\.\/](\d{1,2})/);
      if (m) return new Date(`${m[1]}-${pad2(m[2])}-${pad2(m[3])}T20:00:00`);
      return new Date('2099-01-01');
    }

    function getShowStatus(item) {
      const now = Date.now();
      const rounds = (item.rounds || []).filter(r => r.sale_time);
      const started = rounds.filter(r => new Date(r.sale_time).getTime() <= now);
      const upcoming = rounds.filter(r => new Date(r.sale_time).getTime() > now)
                             .sort((a, b) => new Date(a.sale_time) - new Date(b.sale_time));
      const showTime = parseShowDate(item);
      if (upcoming.length) {
        return {
          tier: started.length ? 1 : 2,
          label: started.length ? '🔥 售票中' : '⏳ 即将开票',
          targetLabel: started.length ? '距开演' : `${upcoming[0].round_name || '开票'}`,
          target: started.length ? showTime : new Date(upcoming[0].sale_time)
        };
      }
      return { tier: 3, label: '🎟️ 待开演', targetLabel: '距开演', target: showTime };
    }

    function renderTourCards() {
      const grid = document.getElementById('tour-grid');
      if (!grid) return;
      let items = cloudTickets.slice();
      if (activeArtistId !== 'ALL') {
        const name = getArtistNameById(activeArtistId);
        items = items.filter(x => x.artist === name);
      }
      // 排序：tier 升序，同 tier 按演出日期升序
      items.sort((a, b) => {
        const sa = getShowStatus(a), sb = getShowStatus(b);
        if (sa.tier !== sb.tier) return sa.tier - sb.tier;
        return parseShowDate(a) - parseShowDate(b);
      });

      if (!items.length) {
        grid.innerHTML = `<div class="col-span-full text-sm text-slate-400 py-8 text-center">暂无近期演出数据</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {

              ${item.startTime ? `<p class="text-[11px] text-slate-600 mt-0.5">⏰ ${item.startTime}</p>` : ''}
              ${item.prices ? `<p class="text-[11px] text-slate-600">💰 ${item.prices}</p>` : ''}
            </div>

            <!-- 倒计时 -->

              <div class="flex items-center gap-1" data-countdown="${st.target.toISOString()}">
                <span class="cd-badge rounded-md px-1.5 py-0.5 text-sm sm:text-base"><span class="cd-num cd-d">--</span><span class="cd-unit">天</span></span>
                <span class="cd-badge rounded-md px-1.5 py-0.5 text-sm sm:text-base"><span class="cd-num cd-h">--</span><span class="cd-unit">时</span></span>
                <span class="cd-badge rounded-md px-1.5 py-0.5 text-sm sm:text-base"><span class="cd-num cd-m">--</span><span class="cd-unit">分</span></span>
