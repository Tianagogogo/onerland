<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ONER时光典藏纪念册</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body{background:#f4f5f7;background-image:radial-gradient(circle at 20% 0%,rgba(255,255,255,.96),transparent 55%),radial-gradient(circle at 85% 15%,rgba(203,213,225,.35),transparent 45%),linear-gradient(180deg,#f8f9fb 0%,#eceff4 100%);background-attachment:fixed}
  .metal-card{background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(241,244,249,.88));backdrop-filter:blur(16px);border:1px solid #cbd5e1;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 4px 18px rgba(15,23,42,.045)}
  .chronicle-card{background:linear-gradient(135deg,#fff 0%,#f1f5f9 55%,#e2e8f0 100%);border:1px solid #94a3b8;box-shadow:inset 0 1px 0 #fff,0 8px 26px rgba(15,23,42,.07)}
  .liquid-silver-btn{background:linear-gradient(135deg,#fff 0%,#e2e8f0 52%,#cbd5e1 100%);border:1px solid #94a3b8;color:#0f172a;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(15,23,42,.06)}
  .liquid-silver-btn:hover{background:linear-gradient(135deg,#f8fafc 0%,#cbd5e1 52%,#94a3b8 100%);color:#020617}
  .obsidian-btn{background:linear-gradient(135deg,#334155 0%,#1e293b 50%,#0f172a 100%);border:1px solid #475569;color:#f8fafc;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 6px rgba(15,23,42,.14)}
  .obsidian-btn:hover{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%)}
  .line-clamp-1-clean{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .no-scrollbar::-webkit-scrollbar{height:6px;width:6px}
  .no-scrollbar::-webkit-scrollbar-track{background:#e2e8f0;border-radius:999px}
  .no-scrollbar::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:999px}
  .cd-badge{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);border:1px solid #475569;color:#f8fafc;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 6px rgba(15,23,42,.2)}
  .cd-badge .cd-num{font-weight:800;letter-spacing:.02em}
  .cd-badge .cd-unit{font-size:9px;color:#94a3b8;display:block;text-align:center;line-height:1;margin-top:2px}
  .zone-hit{cursor:pointer;transition:opacity .15s,filter .15s}
  .zone-hit:hover{filter:brightness(1.15)}
  .zone-hit.active rect,.zone-hit.active path,.zone-hit.active polygon,.zone-hit.active circle{stroke:#f59e0b!important;stroke-width:2.5!important}
  #vv-fp-svg-container svg{display:block;width:100%;height:auto}
  @media(max-width:640px){input,select,textarea{font-size:16px!important}.modal-scroll-safe{max-height:90dvh!important}}
  .touch-pinch{touch-action:pinch-zoom pan-x pan-y}
  .menu-l0{padding-left:12px}.menu-l1{padding-left:28px}.menu-l2{padding-left:44px}
</style>
</head>
<body class="text-slate-800 min-h-screen antialiased selection:bg-slate-300 selection:text-slate-950">

<header class="sticky top-0 z-30 bg-white/85 backdrop-blur-xl border-b border-slate-300/80 shadow-sm">
  <div class="max-w-5xl mx-auto px-3 sm:px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
    <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-slate-700 animate-pulse"></span>
        <h1 class="font-bold text-base sm:text-lg tracking-tight text-slate-900 whitespace-nowrap">ONER时光典藏纪念册</h1>
      </div>
      <div class="inline-flex items-center p-0.5 rounded-full bg-slate-200/85 border border-slate-300 text-xs">
        <button type="button" id="nav-tab-shows" onclick="switchMainTab('shows')" class="px-3 py-1 rounded-full obsidian-btn font-semibold transition whitespace-nowrap">🎫 演出典藏</button>
        <button type="button" id="nav-tab-feeds" onclick="switchMainTab('feeds')" class="px-3 py-1 rounded-full text-slate-600 hover:text-slate-900 font-medium transition whitespace-nowrap">📱 社媒动态</button>
      </div>
      <div class="relative" id="artist-dropdown-wrap">
        <button type="button" onclick="toggleArtistMenu(event)" class="px-3 py-1.5 rounded-full text-xs font-semibold text-white bg-slate-800 shadow flex items-center gap-1.5 hover:opacity-90 whitespace-nowrap">
          <span>🎤 <span id="current-artist-label">全部艺人</span></span><span class="text-[10px]">▾</span>
        </button>
        <div id="artist-dropdown-menu" class="hidden absolute left-0 mt-2 w-52 rounded-xl bg-white/97 backdrop-blur-xl border border-slate-300 shadow-xl py-1.5 z-40 max-h-[70vh] overflow-y-auto no-scrollbar"></div>
      </div>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span id="last-sync" class="text-slate-400 hidden lg:inline">准备就绪</span>
      <div id="admin-entry-buttons" class="hidden items-center gap-2">
        <button id="admin-unlock-btn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-lg liquid-silver-btn font-medium whitespace-nowrap">🔒 管理</button>
        <button onclick="openManageModal()" class="px-3 py-1.5 rounded-lg liquid-silver-btn font-medium hidden sm:inline-block whitespace-nowrap">⚙️ 订阅源</button>
      </div>
      <button onclick="refreshCurrentTab()" class="px-3 py-1.5 rounded-lg obsidian-btn font-semibold whitespace-nowrap">刷新同步</button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-3 sm:px-4 py-6 space-y-8">

  <!-- 管理面板 -->
  <section id="admin-publisher-panel" class="hidden p-4 sm:p-5 rounded-2xl chronicle-card space-y-3">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <span class="text-sm font-bold text-slate-900">✨ 管理员投喂台</span>
      <div class="flex items-center gap-3 text-xs">
        <button type="button" onclick="configGeminiKey()" class="text-slate-700 hover:underline font-medium">🔑 AI密钥 (<span id="ai-key-status">未配置</span>)</button>
        <button onclick="lockAdminMode()" class="text-slate-400 hover:text-rose-600">退出管理</button>
      </div>
    </div>
    <textarea id="raw-post-input" rows="2" placeholder="粘贴微博/小红书/抖音分享口令或官宣文案…" class="w-full text-xs sm:text-sm p-3 rounded-xl border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-slate-500"></textarea>
    <div class="flex items-center gap-2 flex-wrap">
      <button onclick="smartParsePost()" class="px-3.5 py-2 rounded-lg obsidian-btn text-xs font-semibold">🪄 智能识别文案</button>
      <button onclick="openTicketFormDirectly()" class="px-3.5 py-2 rounded-lg liquid-silver-btn text-xs font-semibold">🎫 手动新增演出</button>
      <button onclick="openArchiveFormDirectly()" class="px-3.5 py-2 rounded-lg liquid-silver-btn text-xs font-semibold">🏛️ 录入往日演出</button>
      <button onclick="resetConfirmForm()" class="px-3 py-2 rounded-lg bg-slate-200/80 text-slate-600 hover:text-slate-900 text-xs">清空收起</button>
    </div>
    <div id="parse-confirm-box" class="hidden pt-3 border-t border-dashed border-slate-300 space-y-3">
      <div id="editing-banner" class="hidden px-3 py-2 rounded-lg bg-slate-200/70 border border-slate-400 text-xs flex items-center justify-between">
        <span>✏️ 正在编辑：<strong id="editing-target-name"></strong></span>
        <button type="button" onclick="resetConfirmForm()" class="text-rose-600 underline font-medium">取消编辑</button>
      </div>
      <div id="entry-type-selector" class="flex items-center gap-4 text-xs flex-wrap">
        <span class="text-slate-500">同步至：</span>
        <label class="flex items-center gap-1 cursor-pointer font-medium"><input type="radio" name="cloudEntryType" value="feed" checked onchange="toggleCloudFields()" /> 📱 社媒动态</label>
        <label class="flex items-center gap-1 cursor-pointer font-medium"><input type="radio" name="cloudEntryType" value="ticket" onchange="toggleCloudFields()" /> 🎫 近期演出</label>
        <label class="flex items-center gap-1 cursor-pointer font-medium"><input type="radio" name="cloudEntryType" value="archive" onchange="toggleCloudFields()" /> 🏛️ 往日档案</label>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
        <div><label class="text-slate-500 block mb-1">关联艺人</label>
          <select id="cp-artist" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white">
            <option value="ONER">ONER</option><option value="坤音娱乐">坤音娱乐</option><option value="岳岳">岳岳</option><option value="木子洋">木子洋</option><option value="灵超">灵超</option>
          </select></div>
        <div id="cp-feed-platform-wrap"><label class="text-slate-500 block mb-1">来源平台</label><input id="cp-platform" type="text" placeholder="微博" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>
        <div id="cp-ticket-url-top" class="hidden"><label class="text-slate-500 block mb-1">官宣原帖/购票链接</label><input id="cp-url-ticket" type="text" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" /></div>

        <!-- 档案表单 -->
        <div id="cp-archive-fields" class="hidden sm:col-span-2 space-y-3 p-3 rounded-xl bg-white/90 border border-slate-300">
          <div class="flex items-center gap-3 flex-wrap">
            <span class="font-bold text-slate-800">演出类型：</span>
            <label class="flex items-center gap-1 cursor-pointer font-medium"><input type="radio" name="archiveSubType" value="tour" checked onchange="toggleArchiveSubFields()" /> 🏟️ 巡演/Livehouse</label>
            <label class="flex items-center gap-1 cursor-pointer font-medium"><input type="radio" name="archiveSubType" value="festival" onchange="toggleArchiveSubFields()" /> 🎪 音乐节</label>
          </div>
          <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200 space-y-2">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <label class="font-semibold text-slate-800 text-xs">🖼️ 官宣海报/排期表</label>
              <div class="flex items-center gap-2 flex-wrap">
                <label class="cursor-pointer px-2.5 py-1 rounded-lg liquid-silver-btn font-medium text-xs">选择图片<input type="file" id="arc-poster-file" accept="image/*" class="hidden" onchange="handlePosterUpload(event,'arc')" /></label>
                <button type="button" onclick="runSmartPosterRecognition('archive')" class="px-2.5 py-1 rounded-lg obsidian-btn font-medium text-xs">🔍 识别海报</button>
              </div>
            </div>
            <input id="arc-poster-url" type="text" placeholder="或粘贴海报链接" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs" />
            <div id="arc-ocr-status" class="hidden text-[11px] text-slate-600 font-medium"></div>
            <div id="multi-show-batch-box" class="hidden pt-2 border-t border-slate-200 space-y-2">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <span class="font-bold text-slate-800 text-xs">📋 多场排期（勾选导入）</span>
                <div class="flex items-center gap-2">
                  <select id="batch-target-section" class="px-2 py-1 rounded border border-slate-300 bg-white text-[11px]">
                    <option value="archive">→ 往日档案</option><option value="ticket">→ 近期演出</option>
                  </select>
                  <button type="button" onclick="batchImportRecognizedShows()" class="px-2.5 py-1 rounded-lg obsidian-btn font-semibold text-xs">✅ 批量导入</button>
                </div>
              </div>
              <div id="multi-show-list" class="space-y-1.5 max-h-56 overflow-y-auto no-scrollbar"></div>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div><label class="text-slate-500 block mb-1">巡演主题</label><input id="arc-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">站次（必填）</label><input id="arc-title" type="text" placeholder="如：合肥站" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">演出日期（必填）</label><input id="arc-date" type="date" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">场馆</label><input id="arc-venue" type="text" placeholder="如：北京 · 疆进酒·OMNI SPACE" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div id="arc-tour-only" class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div><label class="text-slate-500 block mb-1">票价</label><input id="arc-prices" type="text" placeholder="预售280/全价380" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-500 block mb-1">座位图</label><input id="arc-seat-url" type="text" placeholder="链接" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            </div>
            <div id="arc-fest-only" class="hidden sm:col-span-2 space-y-2">
              <div><label class="text-slate-500 block mb-1">演出时段</label><input id="arc-slot" type="text" placeholder="如：16:20-17:00" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
              <div><label class="text-slate-500 block mb-1">现场歌单（每行一首）</label><textarea id="arc-setlist" rows="3" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white"></textarea></div>
            </div>
            <div class="sm:col-span-2"><label class="text-slate-500 block mb-1">原帖/回顾链接</label><input id="arc-url" type="text" placeholder="https://..." class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
          </div>
        </div>

        <!-- 演出表单 -->
        <div id="cp-tour-fields" class="hidden sm:col-span-2 space-y-3 p-3 rounded-xl bg-white/90 border border-slate-300">
          <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200 space-y-2">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <label class="font-semibold text-slate-800 text-xs">🖼️ 官宣海报</label>
              <div class="flex items-center gap-2 flex-wrap">
                <label class="cursor-pointer px-2.5 py-1 rounded-lg liquid-silver-btn font-medium text-xs">选择图片<input type="file" accept="image/*" class="hidden" onchange="handlePosterUpload(event,'cp')" /></label>
                <button type="button" onclick="runSmartPosterRecognition('ticket')" class="px-2.5 py-1 rounded-lg obsidian-btn font-medium text-xs">🔍 识别海报</button>
              </div>
            </div>
            <input id="cp-tour-poster" type="text" placeholder="或粘贴海报链接" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs" />
            <div id="cp-ocr-status" class="hidden text-[11px] text-slate-600 font-medium"></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div><label class="text-slate-500 block mb-1">巡演主题</label><input id="cp-tour-theme" type="text" placeholder="如：「极尽声色」巡回演唱会" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">站次（必填）</label><input id="cp-tour-title" type="text" placeholder="如：合肥站" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">场馆</label><input id="cp-tour-venue" type="text" placeholder="如：MAO Livehouse" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">演出日期</label><input id="cp-tour-showdate" type="text" placeholder="2026-12-26 或 2026-12-26~12-27" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">开场时间</label><input id="cp-tour-starttime" type="text" placeholder="如：19:30 开场" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">票价</label><input id="cp-tour-prices" type="text" placeholder="380/580/780" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">预计时段</label><input id="cp-tour-slot" type="text" placeholder="音乐节适用" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
            <div><label class="text-slate-500 block mb-1">舞台结构</label>
              <select id="cp-stage-type" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white text-xs">
                <option value="auto">自动识别</option><option value="arena_3">体育馆三面台</option><option value="arena_4">体育馆四面台</option><option value="livehouse">Livehouse</option><option value="outdoor">户外音乐节</option>
              </select></div>
          </div>
          <div class="pt-2 border-t border-slate-200 space-y-2">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <span class="text-slate-800 font-semibold text-xs">🎫 开票轮次</span>
              <button type="button" onclick="addTicketRoundRow('预售','','大麦')" class="px-2.5 py-1 rounded-lg liquid-silver-btn font-medium text-xs">+ 添加一轮</button>
            </div>
            <div id="ticket-rounds-container" class="space-y-2"></div>
          </div>
          <div><label class="text-slate-500 block mb-1">交通路线</label><textarea id="cp-tour-transport" rows="2" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white"></textarea></div>
        </div>

        <!-- 动态表单 -->
        <div id="cp-feed-fields" class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div class="sm:col-span-2"><label class="text-slate-500 block mb-1">博文正文</label><textarea id="cp-content" rows="4" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white"></textarea></div>
          <div><label class="text-slate-500 block mb-1">发布时间</label><input id="cp-time" type="datetime-local" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
          <div><label class="text-slate-500 block mb-1">原帖链接</label><input id="cp-url" type="text" class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
          <div class="sm:col-span-2"><label class="text-slate-500 block mb-1">配图链接</label><input id="cp-img" type="text" placeholder="https://..." class="w-full px-2.5 py-1.5 rounded border border-slate-300 bg-white" /></div>
        </div>
      </div>
      <button id="cp-submit-btn" onclick="submitCloudEntry()" class="px-4 py-2 rounded-lg obsidian-btn text-xs font-semibold">☁️ 确认发布</button>
    </div>
  </section>

  <!-- 页面一：演出典藏 -->
  <div id="view-shows-page" class="space-y-8">
    <section>
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h2 class="text-base font-bold text-slate-900">🎫 近期演出</h2>
      </div>
      <div id="tour-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h2 class="text-base font-bold text-slate-900">🏛️ 往日演出回顾档案</h2>
        <div class="flex items-center gap-2 flex-wrap">
          <div class="flex items-center gap-1 bg-white/90 p-1 rounded-lg border border-slate-300 text-xs">
            <button onclick="setArchiveTypeFilter('ALL')" id="arc-filter-ALL" class="px-2.5 py-1 rounded-md obsidian-btn font-medium">全部</button>
            <button onclick="setArchiveTypeFilter('tour')" id="arc-filter-tour" class="px-2.5 py-1 rounded-md text-slate-600 hover:bg-slate-100">🏟️ 巡演</button>
            <button onclick="setArchiveTypeFilter('festival')" id="arc-filter-festival" class="px-2.5 py-1 rounded-md text-slate-600 hover:bg-slate-100">🎪 音乐节</button>
          </div>
          <select id="archive-year-filter" onchange="renderArchiveTimeline()" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700"><option value="ALL">全部年份</option></select>
        </div>
      </div>
      <div id="archive-timeline-list" class="space-y-3"></div>
    </section>
  </div>

  <!-- 页面二：社媒动态 -->
  <div id="view-feeds-page" class="hidden space-y-5">
    <section id="latest-spotlight" class="hidden">
      <div class="p-4 sm:p-5 rounded-2xl chronicle-card">
        <div class="flex items-center justify-between gap-2 mb-2">
          <div class="flex items-center gap-2 text-xs font-semibold text-slate-700 flex-wrap">
            <span class="px-2 py-0.5 rounded obsidian-btn text-white">最新动态</span>
            <span id="spotlight-artist" class="font-bold text-slate-900"></span><span class="text-slate-400">·</span>
            <span id="spotlight-platform" class="text-slate-700"></span><span class="text-slate-400">·</span>
            <span id="spotlight-time" class="text-slate-500"></span>
          </div>

function compressImageToDataURL(file,maxW=760,q=0.72){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',q));
      };
      img.onerror=rej;img.src=e.target.result;
    };
    r.onerror=rej;r.readAsDataURL(file);
  });
}

/* ===================== 近期演出：三档排序 + 倒计时 ===================== */
function parseShowDate(item){
  const s=item.show_date||'';
  const m=s.match(/(\d{4})[年\-\.\/](\d{1,2})[月\-\.\/](\d{1,2})/);
  if(m)return new Date(m[1]+'-'+pad2(m[2])+'-'+pad2(m[3])+'T20:00:00');
  return new Date('2099-01-01');
}
function getShowStatus(item){
  const now=Date.now();
  const rounds=(item.rounds||[]).filter(r=>r.sale_time);
  const started=rounds.filter(r=>new Date(r.sale_time).getTime()<=now);
  const upcoming=rounds.filter(r=>new Date(r.sale_time).getTime()>now)
    .sort((a,b)=>new Date(a.sale_time)-new Date(b.sale_time));
  const showTime=parseShowDate(item);
  if(upcoming.length){
    if(started.length)return{tier:1,label:'🔥 售票中',targetLabel:'距开演',target:showTime};
    return{tier:2,label:'⏳ 即将开票',targetLabel:(upcoming[0].round_name||'开票'),target:new Date(upcoming[0].sale_time)};
  }
  return{tier:3,label:'🎟️ 待开演',targetLabel:'距开演',target:showTime};
}

function renderTourCards(){
  const grid=document.getElementById('tour-grid');
  if(!grid)return;
  let items=cloudTickets.slice();
  if(activeArtistId!=='ALL'){
    const name=getArtistNameById(activeArtistId);
    items=items.filter(x=>x.artist===name);
  }
  items.sort((a,b)=>{
    const sa=getShowStatus(a),sb=getShowStatus(b);
    if(sa.tier!==sb.tier)return sa.tier-sb.tier;
    return parseShowDate(a)-parseShowDate(b);
  });
  if(!items.length){
    grid.innerHTML=`<div class="col-span-full text-sm text-slate-400 py-8 text-center">暂无近期演出数据</div>`;
    return;
  }
  grid.innerHTML=items.map(item=>{
    const st=getShowStatus(item);
    const poster=item.posterUrl
      ?`<img src="${item.posterUrl}" onclick="openLightbox(this.src,'${(item.city||'').replace(/'/g,'')}')" class="w-full h-44 object-cover cursor-zoom-in" alt="" />`
      :`<div class="w-full h-44 flex items-center justify-center text-slate-400 text-xs bg-slate-100">暂无海报</div>`;
    const roundsHtml=(item.rounds||[]).map(r=>`
      <div class="flex items-center justify-between text-[11px] px-2 py-1 rounded bg-slate-50 border border-slate-200">
        <span class="font-medium">${r.round_name||'开票'}</span>
        <span class="text-slate-600">${(r.sale_time||'').replace('T',' ')}</span>
        <span class="text-slate-500">${r.platform||''}</span>
      </div>`).join('')||'<div class="text-[11px] text-slate-400">暂无开票轮次</div>';
    const ring=st.tier===1?'ring-2 ring-amber-400/70':'';
    return `
    <article class="chronicle-card rounded-2xl overflow-hidden flex flex-col ${ring}">
      <div class="relative">
        ${poster}
        <span class="absolute top-2 left-2 text-[11px] px-2 py-0.5 rounded-full obsidian-btn text-white font-semibold">${st.label}</span>
        <span class="absolute top-2 right-2 text-[11px] px-2 py-0.5 rounded-full bg-white/90 border border-slate-300 text-slate-700 font-semibold">${item.artist||'ONER'}</span>
      </div>
      <div class="p-3.5 space-y-2.5 flex-1 flex flex-col">
        <div>
          <h3 class="font-bold text-sm text-slate-900">${item.city||'演出场次'}</h3>
          <p class="text-[11px] text-slate-500 mt-0.5">${item.venue||'场馆待补充'} · ${item.show_date||'日期待定'}</p>
          ${item.startTime?`<p class="text-[11px] text-slate-600 mt-0.5">⏰ ${item.startTime}</p>`:''}
          ${item.prices?`<p class="text-[11px] text-slate-600">💰 ${item.prices}</p>`:''}
        </div>
        <div class="flex items-center gap-2 flex-wrap p-2 rounded-xl bg-slate-900/95">
          <span class="text-[10px] text-slate-300 font-medium">${st.targetLabel}</span>
          <div class="flex items-center gap-1" data-countdown="${st.target.toISOString()}">
            <span class="cd-badge rounded-md px-1.5 py-0.5 text-sm sm:text-base"><span class="cd-num cd-d">--</span><span class="cd-unit">天</span></span>
            <span class="cd-badge rounded-md px-1.5 py-0.5 text-sm sm:text-base"><span class="cd-num cd-h">--</span><span class="cd-unit">时</span></span>
            <span class="cd-badge rounded-md px-1.5 py-0.5 text-sm sm:text-base"><span class="cd-num cd-m">--</span><span class="cd-unit">分</span></span>

/* 倒计时刷新 */
let cdTimer=null;
function startCountdown(){
  if(cdTimer)clearInterval(cdTimer);
  const tick=()=>{
    document.querySelectorAll('[data-countdown]').forEach(el=>{
      const target=new Date(el.dataset.countdown).getTime();
      let diff=target-Date.now();
      if(diff<0)diff=0;
      const d=Math.floor(diff/86400000);
      const h=Math.floor(diff%86400000/3600000);
      const m=Math.floor(diff%3600000/60000);
      const s=Math.floor(diff%60000/1000);
      const dn=el.querySelector('.cd-d'),hn=el.querySelector('.cd-h'),mn=el.querySelector('.cd-m'),sn=el.querySelector('.cd-s');
      if(dn)dn.textContent=pad2(d);
      if(hn)hn.textContent=pad2(h);
      if(mn)mn.textContent=pad2(m);
      if(sn)sn.textContent=pad2(s);
    });
  };
  tick();
  cdTimer=setInterval(tick,1000);
}

/* 投影器 */
function buildProjector(eye,camX,d){
  const F=330,CX=200,CY=112;
  const yaw=Math.atan2(camX||0,d);
  const sY=Math.sin(yaw),cY=Math.cos(yaw);
  return (X,Y,Z)=>{
    const dx=X-(camX||0),dz=Z;
    const Xc=dx*cY-dz*sY;
    const Zc=dx*sY+dz*cY;
    const zz=Zc<=0.1?0.1:Zc;
    return {x:CX+F*Xc/zz,y:CY-F*(Y-eye)/zz};
  };
}

function selectZone(zoneId){
  const zones=ZONE_DEFS[vvCtx.stageType]||ZONE_DEFS.arena_3;

function renderFirstPerson(zone,stageType){
  const cont=document.getElementById('vv-fp-svg-container');
  if(!cont)return;
  const P=buildProjector(zone.eye,zone.camX||0,zone.d);
  const stageW=stageType==='livehouse'?12:(stageType==='outdoor'?24:20);
  const stageH=stageType==='livehouse'?5:9;
  const halfW=stageW/2,d=zone.d;
  const sTL=P(-halfW,stageH,d),sTR=P(halfW,stageH,d),sBR=P(halfW,0,d),sBL=P(-halfW,0,d);
  const scrW=stageW*0.62,scrH=stageH*0.5,scrBase=2.2,dS=d+4;
  const gTL=P(-scrW/2,scrBase+scrH,dS),gTR=P(scrW/2,scrBase+scrH,dS);
  const gBR=P(scrW/2,scrBase,dS),gBL=P(-scrW/2,scrBase,dS);
  const spkL1=P(-halfW-1.5,0,d-1),spkL2=P(-halfW-1.5,stageH*0.85,d-1);
  const spkR1=P(halfW+1.5,0,d-1),spkR2=P(halfW+1.5,stageH*0.85,d-1);
  const pts=arr=>arr.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let svg=`<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" style="background:linear-gradient(180deg,#0b1220 0%,#111827 55%,#1f2937 100%)">
    <defs>
      <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
      <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    </defs>
    <rect x="0" y="112" width="400" height="128" fill="#0b1220"/>
    <line x1="0" y1="112" x2="400" y2="112" stroke="#334155" stroke-width="0.6" stroke-dasharray="3 3"/>
    <polygon points="${pts([gTL,gTR,gBR,gBL])}" fill="url(#screenGrad)" opacity="0.95" stroke="#60a5fa" stroke-width="0.8"/>
    <polygon points="${pts([sTL,sTR,sBR,sBL])}" fill="url(#stageGrad)" stroke="#64748b" stroke-width="1"/>
    <line x1="${sTL.x.toFixed(0)}" y1="${sTL.y.toFixed(0)}" x2="${sTR.x.toFixed(0)}" y2="${sTR.y.toFixed(0)}" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="${((sTL.x+sTR.x)/2).toFixed(0)}" y="${((sTL.y+sBL.y)/2).toFixed(0)}" text-anchor="middle" fill="#cbd5e1" font-size="8" font-weight="bold">STAGE</text>
    <polygon points="${pts([spkL1,spkL2,{x:spkL2.x+10,y:spkL2.y},{x:spkL1.x+10,y:spkL1.y}])}" fill="#020617" stroke="#334155" stroke-width="0.6"/>
    <polygon points="${pts([spkR1,spkR2,{x:spkR2.x+10,y:spkR2.y},{x:spkR1.x+10,y:spkR1.y}])}" fill="#020617" stroke="#334155" stroke-width="0.6"/>`;
  if(zone.obstacle==='console'){
    svg+=`<rect x="150" y="168" width="100" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
      <text x="200" y="182" text-anchor="middle" fill="#94a3b8" font-size="7">调音台 FOH</text>`;
  }
  if(zone.obstacle==='speaker'){
    svg+=`<rect x="0" y="40" width="42" height="200" fill="#020617" opacity="0.9"/>
      <text x="21" y="120" text-anchor="middle" fill="#64748b" font-size="7" transform="rotate(-90 21 120)">侧屏/音响塔遮挡</text>`;
  }
  if(zone.obstacle==='crowd'||zone.id==='lh_mid'||zone.id==='a3_vip_b'){
    const baseY=214;
    let heads='';
    for(let x=20;x<400;x+=26){
      const h=10+((x*7)%6);
      heads+=`<circle cx="${x}" cy="${baseY-h}" r="${7+((x*3)%3)}" fill="#020617"/><rect x="${x-11}" y="${baseY-h+4}" width="22" height="30" rx="6" fill="#020617"/>`;
    }
    svg+=heads;
  }
  svg+=`</svg>`;
  cont.innerHTML=svg;
}

async function submitCloudEntry(){
  const t=document.querySelector('input[name="cloudEntryType"]:checked');
  const type=t?t.value:'feed';
  const artist=document.getElementById('cp-artist').value;
  try{
    let payload;
    if(type==='feed'){
      const content=document.getElementById('cp-content').value.trim();
      if(!content)return alert('请填写博文正文');
      const platform=document.getElementById('cp-platform').value.trim()||'微博';
      const time=document.getElementById('cp-time').value||new Date().toISOString().slice(0,16);
      const url=document.getElementById('cp-url').value.trim();
      const img=document.getElementById('cp-img').value.trim();
      const meta={artist,platform,content,img,time:time.replace('T',' '),url};
      payload={title:`FEED|${artist}|${platform}`,ticket_time:time,platform:'FEED:'+JSON.stringify(meta),url:url||null};
    }else if(type==='ticket'){
      const city=document.getElementById('cp-tour-title').value.trim();
      if(!city)return alert('请填写站次/场次名');
      const venue=document.getElementById('cp-tour-venue').value.trim();
      const showdate=document.getElementById('cp-tour-showdate').value.trim();
      const startTime=document.getElementById('cp-tour-starttime').value.trim();
      const prices=document.getElementById('cp-tour-prices').value.trim();
      const slot=document.getElementById('cp-tour-slot').value.trim();
      const theme=document.getElementById('cp-tour-theme').value.trim();
      const poster=document.getElementById('cp-tour-poster').value.trim();
      const transport=document.getElementById('cp-tour-transport').value.trim();
      const stageType=document.getElementById('cp-stage-type').value;
      const url=document.getElementById('cp-url-ticket').value.trim();
      const rounds=[];
      document.querySelectorAll('.ticket-round-row').forEach(r=>{
        const n=r.querySelector('.tr-name').value.trim();
        const tm=r.querySelector('.tr-time').value;
        const pl=r.querySelector('.tr-plat').value.trim();
        if(tm)rounds.push({round_name:n||'开票',sale_time:tm.replace('T',' '),platform:pl||'大麦'});
      });
      const meta={rounds,transport,theme,prices,startTime,posterUrl:poster,stageType,scheduleImgs:cpScheduleImgs,viewImgs:cpViewImgs};
      const title=`${artist}|${theme?theme+' · ':''}${city}|${venue||'场馆待补充'}|${showdate||'日期待定'}|${slot||''}`;
      const earliest=rounds.length?rounds.map(r=>r.sale_time).sort()[0]:new Date().toISOString().slice(0,16).replace('T',' ');
      payload={title,ticket_time:earliest,platform:'META:'+JSON.stringify(meta),url:url||null};
    }else{
      const title=document.getElementById('arc-title').value.trim();
      if(!title)return alert('请填写站次/场次名');
      const date=document.getElementById('arc-date').value;
      if(!date)return alert('请填写演出日期');
      const sub=(document.querySelector('input[name="archiveSubType"]:checked')||{}).value||'tour';
      const theme=document.getElementById('arc-theme').value.trim();
      const venue=document.getElementById('arc-venue').value.trim();
      const prices=document.getElementById('arc-prices').value.trim();
      const seatUrl=document.getElementById('arc-seat-url').value.trim();
      const slot=document.getElementById('arc-slot').value.trim();
      const setlist=(document.getElementById('arc-setlist').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
      const poster=document.getElementById('arc-poster-url').value.trim();
      const url=document.getElementById('arc-url').value.trim();
      const meta={subType:sub,theme,venue,posterUrl:poster,prices,seatUrl,slot,scheduleImgs:arcScheduleImgs,viewImgs:arcViewImgs,setlist};
      const displayTitle=`${theme?theme+' · ':''}${title}`;
      payload={title:`ARCHIVE|${artist}|${displayTitle}|${date}`,ticket_time:date+'T19:30',platform:'ARCHIVE:'+JSON.stringify(meta),url:url||null};
    }
    let res;
    if(editingTicketId){
      res=await fetch(SUPABASE_URL+'/rest/v1/tickets?id=eq.'+editingTicketId,{method:'PATCH',headers:SB_HEADERS,body:JSON.stringify(payload)});
    }else{
      res=await fetch(SUPABASE_URL+'/rest/v1/tickets',{method:'POST',headers:SB_HEADERS,body:JSON.stringify([payload])});
    }
    if(!res.ok)throw new Error('HTTP '+res.status+': '+await res.text());
    alert(editingTicketId?'修改已保存！':'发布成功！');
    resetConfirmForm();
    await loadTourData();
    await loadAllFeeds(true);
  }catch(e){
    alert('提交失败：'+e.message);
  }
}

async function runSmartPosterRecognition(mode){
  const imgId=mode==='ticket'?'cp-tour-poster':'arc-poster-url';
  const statusId=mode==='ticket'?'cp-ocr-status':'arc-ocr-status';
  const src=document.getElementById(imgId).value.trim();
  if(!src)return alert('请先上传海报图片');
  const st=document.getElementById(statusId);st.classList.remove('hidden');
  const key=localStorage.getItem(GEMINI_KEY_STORAGE);
  try{
    let text='';
    if(key&&src.startsWith('data:image/')){
      st.textContent='🤖 Gemini 视觉引擎识别中…';
      text=await geminiVision(key,src);
    }else{
      st.textContent='🔍 本地 OCR 识别中（首次加载模型较慢）…';
      const r=await Tesseract.recognize(src,'chi_sim+eng');
      text=(r.data&&r.data.text)||'';
    }
    if(!text.trim()){st.textContent='⚠️ 未识别到文字，建议配置 AI 密钥或手动填写';return;}
    const shows=parseShowsFromText(text);
    if(mode==='ticket')fillTicketForm(shows[0]);
    else renderBatch(shows);
    st.textContent='✅ 识别完成，请核对后保存';
  }catch(e){
    st.textContent='❌ 识别失败：'+e.message;
  }
}

async function geminiVision(key,dataUrl){
  const base64=dataUrl.split(',')[1];
  const mime=(dataUrl.split(';')[0].split(':')[1])||'image/jpeg';
  const prompt='识别这张演出海报/排期表中的所有场次，严格仅返回 JSON 数组（不要 markdown），字段：artist, theme, city_or_title, date(YYYY-MM-DD), date_display, start_time, venue, prices, slot, sale_time(YYYY-MM-DD HH:mm), platform, type(tour/festival)。';
  const models=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.0-flash'];
  let lastErr='';
  for(const m of models){
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`;
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:mime,data:base64}}]}]})});
    if(res.ok){
      const j=await res.json();
      const t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text)||'';
      return t.replace(/```json/gi,'').replace(/```/g,'').trim();
    }
    lastErr=m+' HTTP '+res.status;
  }
  throw new Error(lastErr||'所有 Gemini 模型均失败');
}

function parseShowsFromText(text){
  try{
    const j=JSON.parse(text);
    if(Array.isArray(j))return j;
  }catch(e){}
  // 本地 OCR 文本解析（简易）
  const year=new Date().getFullYear();
  const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const out=[];
  const themeM=text.match(/[「《]([^」》]+)[」》]/);
  const theme=themeM?themeM[1]:'';
  lines.forEach(line=>{
    const dm=line.match(/(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?/);
    const cm=line.match(/([\u4e00-\u9fa5]{2,5})(?:站|市)/);
    if(dm&&cm){
      const y=dm[1]||year,mo=pad2(dm[2]),da=pad2(dm[3]);
      out.push({artist:'ONER',theme,city_or_title:cm[1]+'站',date:y+'-'+mo+'-'+da,date_display:y+'-'+mo+'-'+da,venue:line.replace(/.*(?:站|市)/,'').trim(),type:/音乐节|嘉年华/.test(line)?'festival':'tour'});
    }
  });
  if(out.length)return out;
  return [{artist:'ONER',theme,city_or_title:theme||'演出场次',date:'',date_display:'',venue:'',type:'tour'}];
}

function fillTicketForm(s){
  if(!s)return;
  if(s.artist)document.getElementById('cp-artist').value=s.artist;
  if(s.theme)document.getElementById('cp-tour-theme').value=s.theme;
  if(s.city_or_title)document.getElementById('cp-tour-title').value=s.city_or_title;
  if(s.venue)document.getElementById('cp-tour-venue').value=s.venue;
  if(s.date_display||s.date)document.getElementById('cp-tour-showdate').value=s.date_display||s.date;
  if(s.start_time)document.getElementById('cp-tour-starttime').value=s.start_time;
  if(s.prices)document.getElementById('cp-tour-prices').value=s.prices;
  if(s.slot)document.getElementById('cp-tour-slot').value=s.slot;
  document.querySelectorAll('input[name="cloudEntryType"]').forEach(r=>r.checked=(r.value==='ticket'));

}
function renderBatch(shows){
  if(!shows||!shows.length)return;
  const first=shows[0];
  if(first.artist)document.getElementById('cp-artist').value=first.artist;
  if(first.theme)document.getElementById('arc-theme').value=first.theme;
  if(first.city_or_title)document.getElementById('arc-title').value=first.city_or_title;
  if(first.date)document.getElementById('arc-date').value=(first.date||'').slice(0,10);
  if(first.venue)document.getElementById('arc-venue').value=first.venue;
  document.querySelectorAll('input[name="cloudEntryType"]').forEach(r=>r.checked=(r.value==='archive'));
  toggleCloudFields();
  if(shows.length<2)return;
  batchParsedItems=shows.map((s,i)=>({
    checked:true,artist:s.artist||'ONER',theme:s.theme||'',
    title:s.city_or_title||('第'+(i+1)+'场'),date:(s.date||'').slice(0,10),
    venue:s.venue||'',prices:s.prices||'',sale_time:s.sale_time||'',platform:s.platform||'大麦',slot:s.slot||'',
    type:s.type||(/音乐节/.test(JSON.stringify(s))?'festival':'tour')
  }));
  const box=document.getElementById('multi-show-batch-box');
  const list=document.getElementById('multi-show-list');
  list.innerHTML=batchParsedItems.map((it,i)=>`
    <div class="grid grid-cols-1 sm:grid-cols-12 gap-1 items-center p-1.5 rounded bg-white border border-slate-200 text-[11px]">
      <div class="sm:col-span-1 flex items-center gap-1"><input type="checkbox" checked onchange="batchParsedItems[${i}].checked=this.checked" /><span class="text-slate-400">#${i+1}</span></div>
      <div class="sm:col-span-3"><input type="text" value="${it.title}" onchange="batchParsedItems[${i}].title=this.value" class="w-full px-1.5 py-1 rounded border border-slate-300 bg-transparent font-semibold" /></div>
      <div class="sm:col-span-2"><input type="date" value="${it.date}" onchange="batchParsedItems[${i}].date=this.value" class="w-full px-1.5 py-1 rounded border border-slate-300 bg-transparent" /></div>
      <div class="sm:col-span-4"><input type="text" value="${it.venue}" onchange="batchParsedItems[${i}].venue=this.value" class="w-full px-1.5 py-1 rounded border border-slate-300 bg-transparent" /></div>
      <div class="sm:col-span-2"><input type="text" value="${it.prices||it.slot||''}" onchange="batchParsedItems[${i}].prices=this.value" class="w-full px-1.5 py-1 rounded border border-slate-300 bg-transparent" /></div>
    </div>`).join('');
  box.classList.remove('hidden');
}
async function batchImportRecognizedShows(){
  const sel=batchParsedItems.filter(x=>x.checked);
  if(!sel.length)return alert('请至少勾选一场');
  const target=document.getElementById('batch-target-section').value;
  const poster=document.getElementById('arc-poster-url').value.trim();
  const url=document.getElementById('arc-url').value.trim();
  const payloads=sel.map(it=>{
    const date=it.date||new Date().toISOString().slice(0,10);
    if(target==='ticket'){
      const rounds=it.sale_time?[{round_name:'正式开票',sale_time:it.sale_time.replace('T',' '),platform:it.platform||'大麦'}]:[];
      const title=`${it.artist}|${it.theme?it.theme+' · ':''}${it.title}|${it.venue||'场馆待补充'}|${date}|${it.slot||''}`;
      const meta={rounds,theme:it.theme,prices:it.prices,posterUrl:poster,stageType:'auto'};
      return{title,ticket_time:(it.sale_time||date+'T12:00').replace('T',' '),platform:'META:'+JSON.stringify(meta),url:url||null};
    }
    const meta={subType:it.type,theme:it.theme,venue:it.venue,posterUrl:poster,prices:it.prices,slot:it.slot,setlist:[]};
    return{title:`ARCHIVE|${it.artist}|${it.theme?it.theme+' · ':''}${it.title}|${date}`,ticket_time:date+'T19:30',platform:'ARCHIVE:'+JSON.stringify(meta),url:url||null};
  });
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/tickets',{method:'POST',headers:SB_HEADERS,body:JSON.stringify(payloads)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    alert('成功导入 '+payloads.length+' 场');
    resetConfirmForm();
    await loadTourData();
  }catch(e){alert('批量导入失败：'+e.message);}
}

/* ===================== 智能文案识别 ===================== */
function smartParsePost(){
  const text=document.getElementById('raw-post-input').value.trim();
  if(!text)return alert('请先粘贴文案');
  editingTicketId=null;
  document.getElementById('editing-banner').classList.add('hidden');
  const isTicket=/开票|预售|抢票|巡演|演唱会|音乐节|嘉年华|Livehouse|大麦|秀动|售票|购票|优先购/i.test(text);
  document.querySelectorAll('input[name="cloudEntryType"]').forEach(r=>r.checked=(r.value===(isTicket?'ticket':'feed')));
  let artist='ONER';
  if(text.includes('岳岳')||text.includes('PINKRAY'))artist='岳岳';
  else if(text.includes('木子洋')||text.includes('KWIN'))artist='木子洋';
  else if(text.includes('灵超')||text.includes('DIDI'))artist='灵超';
  else if(text.includes('坤音'))artist='坤音娱乐';
  document.getElementById('cp-artist').value=artist;
  if(isTicket){
    const themeM=text.match(/[「《]([^」》]+)[」》]\s*(巡回演唱会|演唱会|巡演|音乐节|嘉年华)?/);
    if(themeM)document.getElementById('cp-tour-theme').value=`「${themeM[1]}」${themeM[2]||'巡回演唱会'}`;
    const cityM=text.match(/([\u4e00-\u9fa5]{2,5}站)/);
    if(cityM)document.getElementById('cp-tour-title').value=cityM[1];
    const venueM=text.match(/(?:场馆|地址|地点|📍)[：:]?\s*([^\n\r！!。]+)/);
    if(venueM)document.getElementById('cp-tour-venue').value=venueM[1].trim();
    const dateM=text.match(/(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?/);
    if(dateM){const y=dateM[1]||new Date().getFullYear();document.getElementById('cp-tour-showdate').value=`${y}-${pad2(dateM[2])}-${pad2(dateM[3])}`;}
    const timeM=text.match(/(\d{1,2}[:：]\d{2})\s*(?:开场|开演)?/);
    if(timeM)document.getElementById('cp-tour-starttime').value=timeM[1].replace('：',':')+' 开场';
    const priceM=text.match(/(?:票价|价格|门票)[：:]?\s*([^\n\r]+)/);
    if(priceM)document.getElementById('cp-tour-prices').value=priceM[1].trim();
    const c=document.getElementById('ticket-rounds-container');c.innerHTML='';
    const saleM=text.match(/(?:开票|预售|售票)[^\n\r]{0,40}/);
    let saleIso='';
    if(saleM){
      const sm=saleM[0].match(/(?:(\d{4})[年\.\-\/])?(\d{1,2})[月\.\-\/](\d{1,2})[日号]?\s*(?:(\d{1,2})[:：](\d{1,2}))?/);
      if(sm){const y=sm[1]||new Date().getFullYear();saleIso=`${y}-${pad2(sm[2])}-${pad2(sm[3])}T${pad2(sm[4]||'12')}:${pad2(sm[5]||'00')}`;}
    }
    addTicketRoundRow(/预售/.test(text)?'预售':'正式开票',saleIso,'大麦');
    const urlM=text.match(/https?:\/\/[^\s\u4e00-\u9fa5]+/);
    if(urlM)document.getElementById('cp-url-ticket').value=urlM[0];
  }else{
    document.getElementById('cp-content').value=text;
    document.getElementById('cp-time').value=new Date().toISOString().slice(0,16);
    let plat='微博';
    if(/小红书|xhslink/.test(text))plat='小红书';
    else if(/抖音|douyin/.test(text))plat='抖音';
    else if(/B站|bilibili/.test(text))plat='B站';
    document.getElementById('cp-platform').value=plat;
    const urlM=text.match(/https?:\/\/[^\s\u4e00-\u9fa5]+/);
    if(urlM)document.getElementById('cp-url').value=urlM[0];
  }
  toggleCloudFields();
  document.getElementById('parse-confirm-box').classList.remove('hidden');
  document.getElementById('parse-confirm-box').scrollIntoView({behavior:'smooth',block:'center'});
}
